<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__APP_TOKEN__">
<title>Apontador de Horas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⏱%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #16181d; }
  * { box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  .panel { position: fixed; inset: 0; background: #16181d; color: #e6e8ec; display: flex; flex-direction: column; overflow: hidden; font-size: 13px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #2b2f38; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  button { background: #262a33; color: #e6e8ec; border: 1px solid #353a45; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  button:hover { background: #2f3440; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.danger { background: transparent; border-color: #7f1d1d; color: #fca5a5; }
  button.danger.confirm { background: #b91c1c; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  a { color: #93c5fd; }
  .icon { padding: 5px 8px; }
  .week-label { font-weight: 600; min-width: 150px; text-align: center; }
  .grow { flex: 1; }
  .goal { display: flex; align-items: center; gap: 8px; }
  .bar { width: 120px; height: 8px; background: #2b2f38; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #17c964; }
  .bar.low > i { background: #f5a524; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #713f12; color: #fde68a; }
  .body { flex: 1; display: flex; min-height: 0; }
  aside { width: 290px; border-right: 1px solid #2b2f38; display: flex; flex-direction: column; min-height: 0; }
  .search { padding: 10px; border-bottom: 1px solid #2b2f38; display: flex; gap: 6px; }
  input, select, textarea { background: #0f1115; color: #e6e8ec; border: 1px solid #353a45; border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #2563eb; border-color: transparent; }
  .list { overflow: auto; flex: 1; padding: 6px; }
  .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8b93a3; padding: 10px 6px 4px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: #1f232b; }
  .item.sel { border-color: #2563eb; background: #1a2440; }
  .item .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .item .txt { flex: 1; min-width: 0; }
  .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { color: #8b93a3; font-size: 11px; }
  .item .h { font-variant-numeric: tabular-nums; color: #cbd5e1; font-size: 12px; }
  .item .acts { display: flex; gap: 2px; opacity: 0; }

  .running-box { padding: 10px; border-top: 1px solid #2b2f38; background: #1c1420; display: none; }

  .cal { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .cal-head { display: grid; grid-template-columns: 52px repeat(7, minmax(90px, 1fr)); border-bottom: 1px solid #2b2f38; }

  .dh .n { font-weight: 600; }
  .dh .tot { font-size: 12px; color: #8b93a3; display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .dh .mini { height: 4px; background: #2b2f38; border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .dh .mini > i { display: block; height: 100%; background: #17c964; }
  .dh .mini.low > i { background: #f5a524; }
  .dh.we { opacity: .7; }
  .scroller { flex: 1; overflow: auto; }
  .grid { display: grid; grid-template-columns: 52px repeat(7, minmax(90px, 1fr)); position: relative; }
  .gutter { position: relative; }
  .gutter span { position: absolute; right: 6px; font-size: 11px; color: #6b7280; transform: translateY(-50%); }
  .col { position: relative; border-left: 1px solid #2b2f38; cursor: crosshair; user-select: none; }
  .col.we { background: rgba(255,255,255,.015); }
  .col.today { background: rgba(37,99,235,.05); }
  .hl { position: absolute; left: 0; right: 0; border-top: 1px solid #23262e; pointer-events: none; }
  .hl.half { border-top-style: dashed; border-color: #1d2027; }
  .now { position: absolute; left: 0; right: 0; border-top: 2px solid #f31260; pointer-events: none; z-index: 3; }
  .blk { position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 6px; overflow: hidden; cursor: pointer; z-index: 2;
    font-size: 11.5px; line-height: 1.25; color: #0b0d10; border: 1px solid rgba(0,0,0,.25); }
  .blk:hover { filter: brightness(1.1); }
  .blk b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .ghost { position: absolute; left: 3px; right: 3px; border-radius: 6px; background: rgba(37,99,235,.35); border: 1px dashed #60a5fa; z-index: 4; pointer-events: none; font-size: 11px; padding: 3px 6px; }
  .status { padding: 4px 14px; font-size: 12px; color: #8b93a3; border-top: 1px solid #2b2f38; display: flex; gap: 12px; }

  .modal h2 { margin: 0; font-size: 15px; }

  .row { display: flex; gap: 8px; }

  .foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

  .tabs button { position: relative; }

  .tlay { display: flex; gap: 18px; align-items: flex-start; justify-content: center; }
  .tw { flex: 1; max-width: 620px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .pk { background: #1f1c14; border: 1px solid #4d3f12; border-radius: 10px; padding: 10px 12px; }
  .pk-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; }

  .pk-t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }

  .tcard { background: #1b1e25; border: 1px solid #2b2f38; border-radius: 12px; padding: 16px 18px; }
  .clock { font-size: 64px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: 2px; margin: 6px 0 2px; }
  .clock.run { color: #86efac; }
  .clock.pause { color: #fde68a; }
  .tstate { text-align: center; color: #9aa3b2; font-size: 13px; min-height: 18px; }
  .tbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .tbtns button { padding: 11px 6px; font-size: 14px; font-weight: 600; border-radius: 8px; }
  .tbtns .go { background: #16a34a; border-color: #16a34a; color: #fff; }
  .tbtns .pz { background: #ca8a04; border-color: #ca8a04; color: #fff; }
  .tbtns .ap { background: #2563eb; border-color: #2563eb; color: #fff; }
  .tbtns .st { background: #b91c1c; border-color: #b91c1c; color: #fff; }
  .seg { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #23262e; font-size: 13px; font-variant-numeric: tabular-nums; }
  .seg:last-child { border-bottom: 0; }
  .tlink { background: none; border: 0; color: #93c5fd; padding: 0; font-size: 12px; cursor: pointer; }
  .side-tabs { display: flex; gap: 4px; padding: 8px 10px 0; }
  .side-tabs button { flex: 1; font-size: 12px; padding: 6px 4px; background: transparent; border-color: transparent; color: #9aa3b2; border-radius: 6px 6px 0 0; border-bottom: 2px solid transparent; }
  .side-tabs button.on { color: #e6e8ec; border-bottom-color: #2563eb; background: #1b1e25; }

  .item .new { font-size: 10px; padding: 0 5px; border-radius: 6px; background: #1e3a8a; color: #bfdbfe; margin-left: 4px; }
  .cardsv { flex: 1; overflow: auto; padding: 14px 18px; display: none; }
  .cardsv.on { display: block; }
  .legend { display: flex; gap: 14px; font-size: 11.5px; color: #9aa3b2; margin: 0 0 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .bars2 { display: flex; align-items: flex-end; gap: 4px; height: 130px; border-bottom: 1px solid #2b2f38; }

  .bars2 .b i { display: block; width: 40%; border-radius: 2px 2px 0 0; }

  .bars2 .b.we { opacity: .45; }
  .chips2 { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px; }
  .chips2 button { border-radius: 14px; font-size: 12px; padding: 3px 10px; }
  .chips2 button.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .chips2 button b { margin-left: 4px; }
  .ctool { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .ctool input[type=search] { max-width: 280px; }
  .ctool select { width: auto; }
  table.t tr.grp td { background: #15171d; font-weight: 600; color: #cbd5e1; border-top: 1px solid #2b2f38; }
  table.t tr.crow { cursor: default; }
  table.t tr.crow:hover td { background: #1f232b; }
  .stp { font-size: 11px; padding: 1px 7px; border-radius: 8px; background: #262a33; color: #cbd5e1; white-space: nowrap; }
  .stp.done { background: #14532d; color: #bbf7d0; } .stp.act { background: #1e3a8a; color: #bfdbfe; } .stp.new { background: #3f3f46; color: #e4e4e7; }
  .ibtn { padding: 1px 6px; font-size: 12px; background: transparent; border-color: transparent; }
  .ibtn:hover { background: #2f3440; }
  .tpl { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid #2b2f38; border-radius: 8px; background: #14161c; }
  .tpl.off { opacity: .55; }
  .tpl .sw2 { flex: none; display: flex; flex-direction: row; align-items: center; gap: 8px; width: 170px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: #e6e8ec; }
  .tpl .sw2 input { width: auto; }
  .tpl input.tt { flex: 1; }
  .tpl .badge2 { font-size: 10.5px; padding: 1px 6px; border-radius: 8px; background: #713f12; color: #fde68a; white-space: nowrap; }
  .seg3 { display: inline-flex; background: #0f1115; border: 1px solid #353a45; border-radius: 8px; padding: 2px; }
  .seg3 button { border: 0; background: transparent; padding: 4px 10px; font-size: 12px; }
  .seg3 button.on { background: #2563eb; color: #fff; }
  .created li { margin: 3px 0; }
  .tok { background: #14161c; border: 1px solid #2b2f38; border-radius: 10px; padding: 12px; }
  .tabs { display: flex; background: #0f1115; border: 1px solid #353a45; border-radius: 8px; padding: 2px; }
  .tabs button { border: 0; background: transparent; padding: 4px 10px; }
  .tabs button.on { background: #2563eb; color: #fff; }
  .prod { flex: 1; overflow: auto; padding: 14px 18px; display: none; }
  .prod.on { display: block; }
  .body.off { display: none; }
  .p-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .p-nav .mlabel { font-weight: 600; font-size: 15px; min-width: 150px; text-align: center; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #1b1e25; border: 1px solid #2b2f38; border-radius: 10px; padding: 12px 14px; }
  .kpi .l { color: #8b93a3; font-size: 12px; }
  .kpi .v { font-size: 28px; font-weight: 700; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; color: #8b93a3; font-weight: 500; }
  .kpi .h { color: #9aa3b2; font-size: 12px; }
  .kpi .pbar { height: 6px; background: #2b2f38; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .kpi .pbar > i { display: block; height: 100%; background: #17c964; }
  .kpi .pbar.low > i { background: #f5a524; }
  .chart { background: #1b1e25; border: 1px solid #2b2f38; border-radius: 10px; padding: 12px 14px 8px; margin-bottom: 18px; }

  .bars .goal-line { position: absolute; left: 0; right: 0; border-top: 1px dashed #f5a524; pointer-events: none; }

  .bars .b.sel { background: rgba(37,99,235,.18); }
  .bars .b i { display: block; width: 70%; background: #4f8cff; border-radius: 3px 3px 0 0; min-height: 0; }

  .bars .b.we i { background: #475569; }

  .xlab span.today { color: #93c5fd; font-weight: 700; }

<body>
<div class="panel">
  <header>
    <h1>⏱ Apontador de Horas</h1>
    <button class="icon" data-act="prev" title="Semana anterior">‹</button>
    <span class="week-label"></span>
    <button class="icon" data-act="next" title="Próxima semana">›</button>
    <button data-act="today">Hoje</button>
    <span class="tabs"><button data-act="view-cal" class="on">📅 Calendário</button><button data-act="view-prod">📊 Produtividade</button><button data-act="view-timer">⏱ Cronômetro<span class="tdot"></span></button><button data-act="view-cards">🗂 Cards</button></span>
    <span class="grow"></span>
    <span class="badge test" style="display:none">MODO TESTE: nada é gravado</span>
    <span class="goal"><span class="goal-txt"></span><span class="bar"><i></i></span></span>
    <button class="icon" data-act="new" title="Nova sessão">＋ Sessão</button>
    <button class="icon" data-act="reload" title="Recarregar">↻</button>
    <button class="icon" data-act="settings" title="Configurações">⚙</button>
  </header>
  <div class="body">
    <aside>
      <div class="side-tabs"><button data-act="side-mine" class="on">Meus itens</button><button data-act="side-recent">Criados recentemente</button></div>
      <div class="range" style="display:none"><button data-act="r-days" data-days="1" class="on">Hoje</button><button data-act="r-days" data-days="3">3 dias</button><button data-act="r-days" data-days="7">7 dias</button><span class="hint">2 cliques = apontar</span></div>
      <div class="search"><input class="q" placeholder="Filtrar, #ID ou título…"><button class="icon" data-act="search" title="Buscar no Azure">🔎</button></div>
      <div class="list"></div>
      <div class="running-box"></div>
    </aside>
    <div class="cal">
      <div class="cal-head"></div>
      <div class="scroller"><div class="grid"></div></div>
    </div>
  </div>
  <div class="prod"></div>
  <div class="timerv"></div>
  <div class="cardsv"></div>
  <div class="status"><span class="st-left">Arraste no calendário para criar uma sessão · clique numa sessão para editar</span><span class="grow"></span><span class="st-sync" title="O app recarrega sozinho a cada 30 s e quando você volta para a janela"></span><span class="st-right"></span></div>
  <div class="loading">Carregando…</div>
  <div class="modal-bg"><div class="modal"></div></div>
  <div class="toast"></div>
</div>
<script>
(function () {
  'use strict';
  const APP_TOKEN = document.querySelector('meta[name="app-token"]').content;
  const F_WS = 'Custom.WorkSessionEntry';
  const F_AH = 'Custom.ActualHours';
  const F_CAH = 'Custom.ChildActualHours';
  const FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.Parent', 'System.TeamProject', F_WS, F_AH];
  const LS_KEY = 'apontadorHoras.app.v1';
  const PALETTE = ['#4f8cff', '#f5a524', '#17c964', '#f31260', '#9353d3', '#06b7db', '#ff7a45', '#a3e635', '#e879f9', '#94a3b8'];
  const PX_PER_HOUR = 44;
  const SNAP_MIN = 15;
  const DAY_NAMES = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  const prefs = Object.assign({ pinned: [], known: [], dailyGoal: 8, cardGoal: 0, dayStart: 7, dayEnd: 20, dryRun: false }, loadPrefs());
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
  function savePrefs() { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch { /* ignore */ } }

  const S = { me: null, org: 'emr-cm', project: 'EMR', items: new Map(), weekStart: startOfWeek(new Date()), selectedId: null, filter: '', busy: false, view: 'cal', side: 'mine' };
  // Aba lateral "Criados recentemente"
  const R = { days: 1, rows: [], raw: new Map(), loading: false, error: '', key: '' };

  // ───────── Datas ─────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function startOfWeek(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function timeStr(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function dateInput(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function combine(ds, ts) { const [y, m, d] = ds.split('-').map(Number); const [h, mi] = ts.split(':').map(Number); return new Date(y, m - 1, d, h, mi, 0, 0); }
  function truncMin(d) { const x = new Date(d); x.setSeconds(0, 0); return x; }
  function fmtH(h) { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h${pad(m % 60)}`; }
  function fmtRange(e) { const s = new Date(e.start); return `${pad(s.getDate())}/${pad(s.getMonth() + 1)} ${timeStr(s)}–${e.end ? timeStr(new Date(e.end)) : 'em andamento'}`; }

  // ───────── Sessões (mesmo formato da extensão Work Session Hub) ─────────
  function decodeHtml(s) { return new DOMParser().parseFromString(`<textarea>${s}</textarea>`, 'text/html').querySelector('textarea').value; }
  function htmlText(s) { return new DOMParser().parseFromString(s, 'text/html').documentElement.textContent || ''; }
  function parseEntries(raw) {
    if (raw == null) return [];
    if (typeof raw !== 'string') return null;
    const s = raw.trim();
    if (!s) return [];
    for (const c of [s, decodeHtml(s), htmlText(s)]) {
      try { const v = JSON.parse(c); if (Array.isArray(v)) return v; } catch { /* tenta o próximo */ }
    }
    return null;
  }
  const floorMin = (d) => Math.floor(new Date(d).getTime() / 6e4) * 6e4;
  function entryHours(e, now = Date.now()) {
    if (!e.start) return 0;
    const s = new Date(e.start).getTime();
    const en = e.end ? new Date(e.end).getTime() : now;
    return Math.max(0, (en - s) / 36e5);
  }
  function closedTotal(arr) { return Math.round(100 * arr.reduce((a, e) => (e.start && e.end ? a + entryHours(e) : a), 0)) / 100; }
  function overlaps(a, b) {
    if (!a.start || !b.start) return false;
    const as = floorMin(a.start), bs = floorMin(b.start);
    const ae = a.end ? floorMin(a.end) : Infinity, be = b.end ? floorMin(b.end) : Infinity;
    return Math.max(as, bs) < Math.min(ae, be);
  }
  function isMine(e) { return !!S.me && (e.userEmail || '').trim().toLowerCase() === S.me.email; }
  function newId() { return `ws-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`; }

  // ───────── Comunicação com o app local ─────────
  async function local(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, { method, body: body ? JSON.stringify(body) : undefined, headers: { 'X-App-Token': APP_TOKEN, 'Content-Type': 'application/json' } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || `Erro ${res.status}`);
    return j;
  }
  async function api(path, { method = 'GET', body, headers = {} } = {}) {
    let res;
    try {
      res = await fetch('/api/ado' + path, { method, body, headers: { 'X-App-Token': APP_TOKEN, Accept: 'application/json', ...headers } });
    } catch {
      throw new Error('O app foi fechado. Abra o ApontadorHoras.exe de novo.');
    }
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch { /* não-JSON */ }
    if (!res.ok) {
      const err = new Error((json && json.message) || `HTTP ${res.status}`);
      err.status = res.status;
      if (res.status === 401) setTimeout(() => openSetup('O token não está mais valendo. Gere um novo e cole aqui.'), 50);
      throw err;
    }
    return json;
  }
  async function wiql(query, project = S.project, top = 200) {
    const j = await api(`/${encodeURIComponent(project)}/_apis/wit/wiql?$top=${top}&api-version=7.1`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }),
    });
    return (j.workItems || []).map((w) => w.id);
  }
  async function getItems(ids) {
    const out = [];
    const uniq = [...new Set(ids.map(Number))].filter(Boolean);
    for (let i = 0; i < uniq.length; i += 200) {
      const chunk = uniq.slice(i, i + 200);
      const j = await api(`/_apis/wit/workitems?ids=${chunk.join(',')}&fields=${FIELDS.join(',')}&errorPolicy=Omit&api-version=7.1`);
      for (const w of j.value || []) if (w && w.fields) out.push(w);
    }
    return out;
  }
  // ───────── Lista do Work Session Hub (para os itens aparecerem lá) ─────────
  async function idx(method, sub = '', body) {
    let res;
    try { res = await fetch('/api/index' + sub, { method, body: body ? JSON.stringify(body) : undefined, headers: { 'X-App-Token': APP_TOKEN, 'Content-Type': 'application/json' } }); }
    catch { throw new Error('O app foi fechado. Abra o ApontadorHoras.exe de novo.'); }
    const text = await res.text();
    let j = null;
    try { j = text ? JSON.parse(text) : null; } catch { /* não-JSON */ }
    if (!res.ok) { const e = new Error((j && j.message) || `HTTP ${res.status}`); e.status = res.status; e.code = j?.code; e.typeKey = j?.typeKey; throw e; }
    return j;
  }
  async function readIndex() {
    try { return await idx('GET', '/' + encodeURIComponent(S.me.email)); }
    catch (e) { if (e.status === 404) return null; throw e; }
  }
  async function writeIndex(update) {
    let cur = await readIndex();
    for (let attempt = 1; attempt <= 4; attempt++) {
      const before = cur?.workItems ?? [];
      const after = update(before.slice());
      if (cur && after.length === before.length && after.every((x, i) => x === before[i])) return cur;
      const doc = { ...(cur || {}), id: S.me.email, name: cur?.name ?? S.me.email, workItems: after };
      if (!cur) delete doc.__etag;
      if (attempt === 4) doc.__etag = -1;
      try { return await idx('PUT', '', doc); }
      catch (e) {
        const conflict = e.status === 409 || e.status === 412 || /InvalidDocumentVersion|1660003/.test(`${e.message} ${e.typeKey || ''}`);
        if (attempt === 4 || !conflict) throw e;
        cur = await readIndex();
      }
    }
  }
  function indexWarn(e) {
    console.warn('[Apontador] índice do hub', e);
    if (S.indexWarned) return;
    S.indexWarned = true;
    toast(e.code === 'EXT_SCOPE'
      ? 'Horas salvas no item, mas para aparecerem no Work Session Hub o token precisa da permissão "Extension Data (Read & write)". Gere um novo em ⚙ → Trocar token.'
      : `Horas salvas, mas não consegui atualizar a lista do Work Session Hub: ${e.message}`, true);
  }
  async function hubAdd(ids) {
    if (prefs.dryRun || !ids.length) return;
    try { await writeIndex((w) => [...w, ...ids.filter((id) => !w.includes(id))]); } catch (e) { indexWarn(e); }
  }
  async function hubRemoveIfEmpty(id) {
    if (prefs.dryRun) return;
    const it = S.items.get(id);
    if (it && it.entries.some(isMine)) return;
    try { await writeIndex((w) => w.filter((x) => x !== id)); } catch (e) { indexWarn(e); }
  }

  function toItem(w) {
    const entries = parseEntries(w.fields[F_WS]);
    return {
      id: w.id, rev: w.rev,
      title: w.fields['System.Title'] || `#${w.id}`,
      type: w.fields['System.WorkItemType'] || '',
      state: w.fields['System.State'] || '',
      parent: w.fields['System.Parent'],
      project: w.fields['System.TeamProject'] || S.project,
      entries: entries || [],
      unreadable: entries === null,
    };
  }

  function parseItemId(v) { const m = String(v || '').match(/\d{3,}/); return m ? Number(m[0]) : null; }
  // Busca um item que ainda não está na lista e fixa ele, para aparecer da próxima vez
  async function ensureItem(id) {
    if (S.items.has(id)) return S.items.get(id);
    const [w] = await getItems([id]);
    if (!w) return null;
    const it = toItem(w);
    S.items.set(it.id, it);
    if (!prefs.pinned.includes(it.id)) { prefs.pinned.push(it.id); savePrefs(); }
    return it;
  }

  async function loadAll() {
    let ids = [];
    const base = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.ChangedDate] >= @Today - 45`;
    try {
      ids = await wiql(`${base} AND ([System.AssignedTo] = @Me OR [System.AssignedTo] EVER @Me) ORDER BY [System.ChangedDate] DESC`);
    } catch (e) {
      if (e.status === 401) throw e;
      ids = await wiql(`${base} AND [System.AssignedTo] = @Me ORDER BY [System.ChangedDate] DESC`);
    }
    let hubIds = [];
    try { hubIds = (await readIndex())?.workItems || []; S.hubIds = hubIds; } catch (e) { if (e.code !== 'EXT_SCOPE') console.warn('[Apontador] índice', e); }
    const all = await getItems([...ids, ...prefs.pinned, ...prefs.known, ...hubIds]);
    S.items = new Map(all.map((w) => [w.id, toItem(w)]));
    rememberKnown();
    // Itens com sessões suas que o Work Session Hub ainda não lista (ex.: lançados por este app antes)
    const missing = [...S.items.values()].filter((it) => it.entries.some(isMine) && !hubIds.includes(it.id)).map((it) => it.id);
    if (missing.length) hubAdd(missing);
  }
  function rememberKnown() {
    const mine = [...S.items.values()].filter((it) => it.entries.some(isMine)).map((it) => it.id);
    prefs.known = [...new Set([...mine, ...prefs.known])].slice(0, 300);
    savePrefs();
  }
  async function refreshItem(id) {
    const [w] = await getItems([id]);
    if (w) S.items.set(w.id, toItem(w));
  }

  // Lê o item fresco, aplica a mudança e grava com teste de revisão (não sobrescreve alteração de outra pessoa).
  async function mutateItem(id, fn) {
    for (let attempt = 1; attempt <= 3; attempt++) {
      const [w] = await getItems([id]);
      if (!w) throw new Error(`Item #${id} não encontrado.`);
      const it = toItem(w);
      if (it.unreadable) throw new Error(`Não consegui ler as sessões já gravadas no item #${id}. Nada foi alterado.`);
      const next = fn(it.entries.slice(), it);
      const ops = [
        { op: 'test', path: '/rev', value: it.rev },
        { op: 'add', path: `/fields/${F_WS}`, value: JSON.stringify(next) },
        { op: 'add', path: `/fields/${F_AH}`, value: closedTotal(next) },
      ];
      try {
        await api(`/_apis/wit/workitems/${id}?api-version=7.1${prefs.dryRun ? '&validateOnly=true' : ''}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' }, body: JSON.stringify(ops),
        });
      } catch (e) {
        const revConflict = e.status === 409 || e.status === 412 || /\brev\b|TF26071|TF401289|test operation/i.test(e.message);
        if (attempt < 3 && revConflict) continue;
        throw e;
      }
      if (!prefs.dryRun) {
        await refreshItem(id);
        rollupFeature(it).catch((err) => console.warn('[Apontador] rollup da Feature falhou', err));
      }
      return next;
    }
    throw new Error('O item foi alterado por outra pessoa várias vezes seguidas. Tente de novo.');
  }

  // Mesmo comportamento da extensão: recalcula ActualHours/ChildActualHours da Feature pai.
  async function rollupFeature(it) {
    let featId = null;
    if (it.type === 'Feature') featId = it.id;
    else if (it.parent) {
      const [p] = await getItems([it.parent]);
      if (p && p.fields['System.WorkItemType'] === 'Feature') featId = p.id;
    }
    if (!featId) return;
    const proj = it.project || S.project;
    const childIds = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.Parent] = ${featId} AND [System.TeamProject] = '${proj.replace(/'/g, "''")}'`, proj);
    const all = await getItems([featId, ...childIds]);
    let own = 0, child = 0;
    for (const w of all) {
      const h = closedTotal(parseEntries(w.fields[F_WS]) || []);
      if (w.id === featId) own += h; else child += h;
    }
    await api(`/_apis/wit/workitems/${featId}?api-version=7.1`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' },
      body: JSON.stringify([
        { op: 'add', path: `/fields/${F_AH}`, value: Math.round(own * 100) / 100 },
        { op: 'add', path: `/fields/${F_CAH}`, value: Math.round(child * 100) / 100 },
      ]),
    });
  }

  async function assertNoConflict(candidate, excludeEntryId) {
    const fresh = await getItems([...S.items.keys()]);
    for (const w of fresh) {
      const it = toItem(w);
      S.items.set(it.id, it);
      for (const e of it.entries) {
        if (e.id && e.id === excludeEntryId) continue;
        if (isMine(e) && overlaps(candidate, e)) throw new Error(`Esse horário bate com outra sessão sua (${fmtRange(e)}) no item #${it.id}.`);
      }
    }
  }

  async function createSession({ itemId, start, end, notes }, ignoreEntryId) {
    start = truncMin(start); end = end ? truncMin(end) : undefined;
    if (end && end <= start) throw new Error('O fim precisa ser depois do início.');
    const email = S.me.email;
    const entry = {
      id: newId(), name: `${email} @ ${start.toISOString()}`, workItemId: itemId, userEmail: email,
      start: start.toISOString(), end: end ? end.toISOString() : undefined, notes: notes || '',
      createdAt: new Date().toISOString(), createdBy: email,
    };
    await assertNoConflict(entry, ignoreEntryId);
    await mutateItem(itemId, (entries) => {
      const clash = entries.find((e) => isMine(e) && e.id !== ignoreEntryId && overlaps(entry, e));
      if (clash) throw new Error(`Esse horário bate com outra sessão sua (${fmtRange(clash)}) neste item.`);
      return [...entries, entry];
    });
    if (!prefs.known.includes(itemId)) { prefs.known.unshift(itemId); savePrefs(); }
    await hubAdd([itemId]);
  }

  async function updateSession(itemId, entryId, { start, end, notes }) {
    start = truncMin(start); end = end ? truncMin(end) : undefined;
    if (end && end <= start) throw new Error('O fim precisa ser depois do início.');
    const probe = { start: start.toISOString(), end: end ? end.toISOString() : undefined };
    await assertNoConflict(probe, entryId);
    await mutateItem(itemId, (entries) => {
      const i = entries.findIndex((e) => e.id === entryId);
      if (i < 0) throw new Error('Essa sessão não existe mais (talvez tenha sido excluída em outro lugar).');
      const cur = entries[i];
      const upd = { ...cur, workItemId: itemId, start: probe.start, end: probe.end, notes: notes ?? cur.notes ?? '', lastUpdate: new Date().toISOString(), updatedBy: S.me.email };
      if (!upd.end) delete upd.end;
      return entries.map((e, j) => (j === i ? upd : e));
    });
  }

  async function deleteSession(itemId, entryId) {
    await mutateItem(itemId, (entries) => {
      const next = entries.filter((e) => e.id !== entryId);
      if (next.length === entries.length) throw new Error('Essa sessão não existe mais.');
      return next;
    });
    await hubRemoveIfEmpty(itemId);
  }

  async function moveSession(fromId, entryId, toId, data) {
    // Remove do item antigo e cria no novo; se a criação falhar, devolve a sessão original.
    const from = S.items.get(fromId);
    const orig = from?.entries.find((e) => e.id === entryId);
    if (!orig) throw new Error('Sessão original não encontrada.');
    if (prefs.dryRun) { await createSession({ ...data, itemId: toId }, entryId); return; }
    await deleteSession(fromId, entryId);
    try { await createSession({ ...data, itemId: toId }); }
    catch (e) {
      await mutateItem(fromId, (entries) => [...entries, orig]).catch(() => {});
      throw e;
    }
  }

  // ───────── Derivados p/ a tela ─────────
  function colorOf(id) { return PALETTE[Math.abs(Number(id) * 2654435761 % 2 ** 32) % PALETTE.length]; }
  function myEntries() {
    const out = [];
    for (const it of S.items.values()) for (const e of it.entries) if (isMine(e) && e.start) out.push({ it, e });
    return out;
  }
  function runningEntry() { return myEntries().find(({ e }) => !e.end); }
  function weekSegments() {
    const segs = [];
    const now = new Date();
    for (const { it, e } of myEntries()) {
      const s = new Date(e.start), en = e.end ? new Date(e.end) : now;
      for (let d = 0; d < 7; d++) {
        const day0 = addDays(S.weekStart, d), day1 = addDays(day0, 1);
        const a = s > day0 ? s : day0, b = en < day1 ? en : day1;
        if (b > a) segs.push({ it, e, day: d, a, b, hours: (b - a) / 36e5 });
      }
    }
    return segs;
  }

  // ───────── UI ─────────
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const azureUrl = (it) => `https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(it.project)}/_workitems/edit/${it.id}`;

  let toastTimer;
  function toast(msg, bad = false) {
    const t = $('.toast');
    t.textContent = msg; t.className = `toast on${bad ? ' bad' : ''}`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = 'toast'), bad ? 6000 : 3000);
  }
  function setLoading(on, msg = 'Carregando…') { const l = $('.loading'); l.textContent = msg; l.classList.toggle('on', on); }
  async function run(label, fn) {
    if (S.busy) return;
    S.busy = true; setLoading(true, label);
    try { await fn(); return true; }
    catch (e) { console.error('[Apontador]', e); if (e.status !== 401) toast(e.message || String(e), true); return false; }
    finally { S.busy = false; setLoading(false); render(); }
  }

  function render() {
    renderHeader(); renderList(); renderCalendar(); renderRunning();
    if (S.view === 'prod') renderProd();
    if (S.view === 'timer' && !document.activeElement?.closest?.('.timerv')) renderTimer(); else renderTimerBadge();
    $('.badge.test').style.display = prefs.dryRun ? '' : 'none';
    const r = S.me && runningEntry();
    document.title = r ? `● ${fmtH(entryHours(r.e))} · Apontador de Horas` : 'Apontador de Horas';
  }
  function renderHeader() {
    const end = addDays(S.weekStart, 6);
    const sameM = S.weekStart.getMonth() === end.getMonth();
    $('.week-label').textContent = `${S.weekStart.getDate()}${sameM ? '' : ' ' + MONTHS[S.weekStart.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
    const total = weekSegments().reduce((a, s) => a + s.hours, 0);
    const goal = prefs.dailyGoal * 5;
    $('.goal-txt').textContent = `Semana: ${fmtH(total)} / ${fmtH(goal)}`;
    const bar = $('.goal .bar');
    bar.querySelector('i').style.width = `${Math.min(100, (100 * total) / goal)}%`;
    bar.classList.toggle('low', total < goal);
    $('.st-right').textContent = S.me ? `${S.me.name} · ${S.org}/${S.project} · ${S.items.size} itens` : '';
  }
  function weekHoursByItem() {
    const m = new Map();
    for (const s of weekSegments()) m.set(s.it.id, (m.get(s.it.id) || 0) + s.hours);
    return m;
  }
  function renderList() {
    if (S.side === 'recent') return renderRecent();
    const list = $('.list');
    const f = S.filter.trim().toLowerCase().replace(/^#/, '');
    const wh = weekHoursByItem();
    const items = [...S.items.values()].filter((it) => !f || String(it.id).includes(f) || it.title.toLowerCase().includes(f));
    const closed = (it) => /^(Closed|Removed|Done)$/i.test(it.state);
    const groups = [
      ['Com horas nesta semana', items.filter((it) => wh.has(it.id)).sort((a, b) => wh.get(b.id) - wh.get(a.id))],
      ['Fixados', items.filter((it) => !wh.has(it.id) && prefs.pinned.includes(it.id))],
      ['Meus itens recentes', items.filter((it) => !wh.has(it.id) && !prefs.pinned.includes(it.id) && !closed(it))],
      ['Fechados', items.filter((it) => !wh.has(it.id) && !prefs.pinned.includes(it.id) && closed(it))],
    ];
    let html = '';
    for (const [name, arr] of groups) {
      if (!arr.length) continue;
      html += `<div class="sec">${esc(name)}</div>`;
      for (const it of arr) {
        const pinned = prefs.pinned.includes(it.id);
        html += `<div class="item${S.selectedId === it.id ? ' sel' : ''}" data-id="${it.id}" title="${esc(it.title)}">
          <span class="sw" style="background:${colorOf(it.id)}"></span>
          <div class="txt"><div class="t">${esc(it.title)}</div><div class="m">#${it.id} · ${esc(it.type)} · ${esc(it.state)}${it.unreadable ? ' · ⚠ sessões ilegíveis' : ''}</div></div>
          ${wh.has(it.id) ? `<span class="h">${fmtH(wh.get(it.id))}</span>` : ''}
          <span class="acts">
            <button data-act="timer" data-id="${it.id}" title="Iniciar no cronômetro">▶</button>
            <button data-act="pin" data-id="${it.id}" title="${pinned ? 'Desafixar' : 'Fixar'}">${pinned ? '★' : '☆'}</button>
            <a href="${azureUrl(it)}" target="_blank" rel="noopener" title="Abrir no Azure"><button tabindex="-1">↗</button></a>
          </span></div>`;
      }
    }
    if (!html) html = `<div class="empty">${S.me ? 'Nenhum item. Busque por #ID ou título e clique em 🔎.' : 'Carregando…'}</div>`;
    list.innerHTML = html;
  }

  // ───────── Produtividade: cards fechados com horas suas ─────────
  // Regra: conta o card se ele está fechado (Closed/Done/Resolved) e tem pelo menos uma sessão sua com horas.
  // O dia em que ele conta é o dia em que foi fechado (ClosedDate).
  const PROD_FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.TeamProject', 'System.AssignedTo', 'Microsoft.VSTS.Common.ClosedDate', 'Microsoft.VSTS.Common.ClosedBy', F_WS];
  const CLOSED_RE = /^(Closed|Done|Resolved)$/i;
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const dayKey = (d) => dateInput(d);
  const P = { month: monthStart(new Date()), rows: [], loadedKey: '', loading: false, selDay: null, error: '' };
  function weekdaysIn(a, b) { let n = 0; for (let d = new Date(a); d < b; d = addDays(d, 1)) if (d.getDay() % 6 !== 0) n++; return n; }
  const ymdW = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  async function getItemsWith(ids, fields) {
    const out = []; const uniq = [...new Set(ids.map(Number))].filter(Boolean);
    for (let i = 0; i < uniq.length; i += 200) {
      const j = await api(`/_apis/wit/workitems?ids=${uniq.slice(i, i + 200).join(',')}&fields=${fields.join(',')}&errorPolicy=Omit&api-version=7.1`);
      for (const w of j.value || []) if (w && w.fields) out.push(w);
    }
    return out;
  }
  function prodRange() {
    const m0 = P.month, m1 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
    const w0 = startOfWeek(new Date()), w1 = addDays(w0, 7);
    return { from: m0 < w0 ? m0 : w0, to: m1 > w1 ? m1 : w1, m0, m1 };
  }
  async function loadProd(force, silent) {
    const { from, to } = prodRange();
    const key = `${from.toISOString()}|${to.toISOString()}`;
    if (!force && P.loadedKey === key) { renderProd(); return; }
    if (!silent) { P.loading = true; P.error = ''; renderProd(); }
    try {
      const q = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [Microsoft.VSTS.Common.ClosedDate] >= '${ymdW(addDays(from, -1))}' AND [Microsoft.VSTS.Common.ClosedDate] < '${ymdW(addDays(to, 1))}' AND ([System.AssignedTo] = @Me OR [System.AssignedTo] EVER @Me OR [Microsoft.VSTS.Common.ClosedBy] = @Me)`;
      let ids = [];
      try { ids = await wiql(q, S.project, 2000); }
      catch (e) { if (e.status === 401) throw e; ids = await wiql(q.replace(' OR [System.AssignedTo] EVER @Me', ''), S.project, 2000); }
      // Também os itens onde você tem sessões (podem ter sido fechados por outra pessoa)
      const withMine = [...S.items.values()].filter((it) => it.entries.some(isMine)).map((it) => it.id);
      const all = await getItemsWith([...ids, ...withMine, ...(S.hubIds || [])], PROD_FIELDS);
      P.rows = all.map((w) => {
        const f = w.fields;
        const entries = (parseEntries(f[F_WS]) || []).filter((e) => isMine(e) && e.start && e.end);
        const closed = f['Microsoft.VSTS.Common.ClosedDate'] && CLOSED_RE.test(f['System.State'] || '') ? new Date(f['Microsoft.VSTS.Common.ClosedDate']) : null;
        const who = (x) => (x && (x.uniqueName || x.displayName) || '').toLowerCase();

          id: w.id, title: f['System.Title'] || `#${w.id}`, type: f['System.WorkItemType'] || '', state: f['System.State'] || '',

  function prodStats(a, b) {

    const counted = P.rows.filter((r) => inP(r.closed) && r.myHours > 0);
    // Horas suas no período: junta as sessões do calendário com as dos cards carregados aqui (sem contar duas vezes)
    const seen = new Map();
    for (const { it, e } of myEntries()) seen.set(`${it.id}:${e.id || e.start}`, e);
    for (const r of P.rows) for (const e of r.entries) seen.set(`${r.id}:${e.id || e.start}`, e);
    let hours = 0;
    for (const e of seen.values()) { const s = new Date(e.start); if (e.end && s >= a && s < b) hours += entryHours(e); }

  }
  function kpi(label, sub, st, goal) {
    const n = st.counted.length;

    return `<div class="kpi"><div class="l">${esc(label)} <span class="muted">· ${esc(sub)}</span></div>
      <div class="v">${n}${goal ? ` <small>/ ${goal}</small>` : ''} <small>card${n === 1 ? '' : 's'}</small></div>

    const t0 = new Date(); t0.setHours(0, 0, 0, 0);

    const sToday = prodStats(t0, addDays(t0, 1)), sWeek = prodStats(w0, addDays(w0, 7)), sMonth = prodStats(m0, m1);

    html += `<div class="chart"><h3>Cards fechados com horas, por dia${P.selDay ? ' · clique de novo no dia para ver o mês todo' : ' · clique num dia para filtrar'}</h3><div class="bars">
      ${g ? `<div class="goal-line" style="bottom:${(100 * g) / max}%" title="Meta: ${g}/dia"></div>` : ''}
      ${days.map((d, i) => `<div class="b${d.getDay() % 6 === 0 ? ' we' : ''}${g && per[i] >= g ? ' met' : ''}${P.selDay === dayKey(d) ? ' sel' : ''}" data-act="p-day" data-day="${dayKey(d)}" title="${pad(d.getDate())}/${pad(d.getMonth() + 1)}: ${per[i]} card(s)">
        ${per[i] ? `<span>${per[i]}</span>` : ''}<i style="height:${(100 * per[i]) / max}%"></i></div>`).join('')}
      </div><div class="xlab">${days.map((d) => `<span class="${sameDay(d, t0) ? 'today' : ''}">${d.getDate()}</span>`).join('')}</div></div>`;
    // Lista filtrada
    let a = m0, b = m1, label = 'no mês';
    if (P.selDay) { const [y, mo, dd] = P.selDay.split('-').map(Number); a = new Date(y, mo - 1, dd); b = addDays(a, 1); label = `em ${pad(dd)}/${pad(mo)}`; }
    const st = prodStats(a, b);
    const rows = st.counted.slice().sort((x, y) => y.closed - x.closed);
    const link = (r) => `<a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(r.project)}/_workitems/edit/${r.id}" target="_blank" rel="noopener">#${r.id}</a>`;

  // ───────── Cronômetro ─────────
  // Cada cronômetro guarda trechos (início/fim). Ao apontar, cada trecho vira uma sessão no Work Session Hub.
  // "Pausar" estaciona o cronômetro num card lateral e libera o principal para outro work item.
  const T_KEY = 'apontadorHoras.timer.v1';
  const T = Object.assign({ itemId: null, notes: '', segs: [], parked: [] }, (() => { try { return JSON.parse(localStorage.getItem(T_KEY)) || {}; } catch { return {}; } })());
  if (!Array.isArray(T.parked)) T.parked = [];
  const tSave = () => { try { localStorage.setItem(T_KEY, JSON.stringify({ itemId: T.itemId, notes: T.notes, segs: T.segs, parked: T.parked })); } catch { /* ignore */ } };
  const isRun = (t) => t.segs.length > 0 && !t.segs[t.segs.length - 1].e;
  const msOf = (t) => t.segs.reduce((a, g) => a + ((g.e ? new Date(g.e) : new Date()) - new Date(g.s)), 0);
  const tRunning = () => isRun(T);
  const tMs = () => msOf(T);
  const tState = () => (tRunning() ? 'run' : T.segs.length ? 'pause' : 'idle');
  const hms = (ms) => { const t = Math.floor(ms / 1000); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`; };
  const itemOf = (id) => id && (S.items.get(id) || R.rows.find((r) => r.id === id));
  // Trechos prontos para gravar: corta no minuto (como a extensão) e junta trechos que encostam
  function pendingOf(t, closeNow) {
    const segs = t.segs.map((g) => ({ s: new Date(g.s), e: g.e ? new Date(g.e) : (closeNow ? new Date() : null) })).filter((g) => g.e).sort((x, y) => x.s - y.s);
    const out = [];
    for (const g of segs) {
      const s0 = truncMin(g.s), e0 = truncMin(g.e);
      if (e0 <= s0) continue;
      const last = out[out.length - 1];
      if (last && s0 <= last.e) { if (e0 > last.e) last.e = e0; } else out.push({ s: s0, e: e0 });
    }
    return out;
  }
  const tPending = (closeNow) => pendingOf(T, closeNow);

  function tStart() {

  // Pausar = fecha o trecho atual e estaciona o cronômetro no painel de pausados

    else T.parked.unshift({ pid: `p${Date.now()}${Math.random().toString(36).slice(2, 6)}`, itemId: T.itemId, notes: T.notes, segs: T.segs, pausedAt: new Date().toISOString() });

  // Grava os trechos de um cronômetro no Azure. keepRunning: continua contando a partir de agora.
  async function logTimer(t, keepRunning) {
    if (!t.itemId) { toast('Informe o work item.', true); return false; }
    const wasRunning = isRun(t);
    const cut = new Date();
    if (wasRunning) t.segs[t.segs.length - 1].e = cut.toISOString();
    const items = pendingOf(t, false);
    if (!items.length) {
      toast('Menos de 1 minuto contado: nada para apontar ainda.', true);
      if (wasRunning) t.segs[t.segs.length - 1].e = null;
      tSave(); renderTimer(); return false;
    }
    const it = adoptItem(t.itemId) || await ensureItem(t.itemId);
    if (!it) { toast(`Item #${t.itemId} não encontrado.`, true); if (wasRunning) t.segs[t.segs.length - 1].e = null; return false; }
    let done = 0;
    const ok = await run(prefs.dryRun ? 'Validando…' : `Apontando ${items.length} trecho(s) em #${t.itemId}…`, async () => {
      for (const g of items) { await createSession({ itemId: t.itemId, start: g.s, end: g.e, notes: t.notes }); done++; }
    });
    const total = items.reduce((a, g) => a + (g.e - g.s), 0) / 36e5;
    if (ok && !prefs.dryRun) {
      t.segs = keepRunning && wasRunning ? [{ s: cut.toISOString(), e: null }] : [];
      P.loadedKey = '';

    const mine = C.rows.filter((r) => r.assignedMe || r.createdMe || r.myHours > 0);
    const hoursMonth = (r) => r.entries.reduce((a, e) => a + (inM(new Date(e.start)) ? entryHours(e) : 0), 0);
    const active = mine.filter((r) => !isDone(r.state) && r.assignedMe);
    const closedM = mine.filter((r) => inM(r.closed));
    const createdM = mine.filter((r) => inM(r.created) && r.createdMe);
    const hM = mine.reduce((a, r) => a + hoursMonth(r), 0);
    html += `<div class="kpis">
      <div class="kpi"><div class="l">Ativos com você</div><div class="v">${active.length}</div><div class="h">${fmtH(active.reduce((a, r) => a + r.myHours, 0))} apontadas neles</div></div>
      <div class="kpi"><div class="l">Fechados no mês</div><div class="v">${closedM.length}</div><div class="h">${closedM.filter((r) => r.myHours > 0).length} com horas suas</div></div>
      <div class="kpi"><div class="l">Criados por você no mês</div><div class="v">${createdM.length}</div><div class="h">${[...new Set(createdM.map((r) => r.parent).filter(Boolean))].length} US/issue(s) pai</div></div>
      <div class="kpi"><div class="l">Horas apontadas no mês</div><div class="v" style="font-size:24px">${fmtH(hM)}</div><div class="h">em ${mine.filter((r) => hoursMonth(r) > 0).length} card(s)</div></div>
    </div>`;
    const days = []; for (let d = new Date(m0); d < m1; d = addDays(d, 1)) days.push(new Date(d));
    const cr = days.map((d) => mine.filter((r) => r.createdMe && r.created && sameDay(r.created, d)).length);
    const fe = days.map((d) => mine.filter((r) => r.closed && sameDay(r.closed, d)).length);
    const mx = Math.max(1, ...cr, ...fe);
    const t0 = new Date();
    html += `<div class="chart"><h3>Cards no mês</h3><div class="legend"><span><i style="background:#4f8cff"></i>Criados por você</span><span><i style="background:#17c964"></i>Fechados</span></div>
      <div class="bars2">${days.map((d, i) => `<div class="b${d.getDay() % 6 === 0 ? ' we' : ''}" title="${pad(d.getDate())}/${pad(d.getMonth() + 1)}: ${cr[i]} criado(s), ${fe[i]} fechado(s)"><i class="c" style="height:${(100 * cr[i]) / mx}%"></i><i class="f" style="height:${(100 * fe[i]) / mx}%"></i></div>`).join('')}</div>
      <div class="xlab">${days.map((d) => `<span class="${sameDay(d, t0) ? 'today' : ''}">${d.getDate()}</span>`).join('')}</div></div>`;
    // Status
    const pool = C.show === 'active' ? mine.filter((r) => !isDone(r.state)) : C.show === 'closedM' ? closedM : mine;
    const states = {}; for (const r of pool) states[r.state] = (states[r.state] || 0) + 1;
    html += `<div class="ctool"><input type="search" class="c-q" placeholder="Filtrar por #ID ou título…" value="${esc(C.q)}">
      <select class="c-show"><option value="active"${C.show === 'active' ? ' selected' : ''}>Não fechados</option><option value="closedM"${C.show === 'closedM' ? ' selected' : ''}>Fechados no mês</option><option value="all"${C.show === 'all' ? ' selected' : ''}>Todos (últimos 120 dias)</option></select>
      <label class="chk"><input type="checkbox" class="c-group" ${C.group ? 'checked' : ''}> Agrupar por US/issue pai</label>
      <span class="grow"></span><button class="icon" data-act="c-reload" title="Recarregar">↻</button></div>
      <div class="chips2"><button data-act="c-state" data-st="" class="${C.state ? '' : 'on'}">Todos<b>${pool.length}</b></button>
      ${Object.entries(states).sort((a, b) => b[1] - a[1]).map(([st, n]) => `<button data-act="c-state" data-st="${esc(st)}" class="${C.state === st ? 'on' : ''}">${esc(st)}<b>${n}</b></button>`).join('')}</div>`;
    const f = C.q.trim().toLowerCase().replace(/^#/, '');
    const rows = pool.filter((r) => (!C.state || r.state === C.state) && (!f || String(r.id).includes(f) || r.title.toLowerCase().includes(f) || String(r.parent || '').includes(f)))
      .sort((a, b) => (b.changed || 0) - (a.changed || 0));
    const dt = (d) => (d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}` : '—');
    const link = (r) => `<a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(r.project || S.project)}/_workitems/edit/${r.id}" target="_blank" rel="noopener">#${r.id}</a>`;
    const rowHtml = (r) => `<tr class="crow" data-cid="${r.id}" title="Clique 2x para apontar horas">
      <td>${link(r)}</td><td>${esc(r.title)}</td><td class="muted">${esc(r.type)}</td><td><span class="stp ${stClass(r.state)}">${esc(r.state)}</span></td>
      <td class="num">${r.myHours ? fmtH(r.myHours) : '—'}</td><td class="num">${hoursMonth(r) ? fmtH(hoursMonth(r)) : '—'}</td>
      <td class="num" style="text-align:left">${dt(r.created)}</td><td class="num" style="text-align:left">${r.closed ? dt(r.closed) : dt(r.changed)}</td>
      <td class="num" style="white-space:nowrap"><button class="ibtn" data-act="timer" data-id="${r.id}" title="Iniciar no cronômetro">▶</button></td></tr>`;
    let body = '';
    if (C.group) {
      const groups = new Map();
      for (const r of rows) { const k = r.parent || `self-${r.id}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
      for (const [k, list] of groups) {
        const p = typeof k === 'number' ? C.parents.get(k) : null;
        const h = list.reduce((a, r) => a + r.myHours, 0);
        body += p
          ? `<tr class="grp"><td colspan="8">${esc(p.type || 'Pai')} ${link(p)} ${esc(p.title || '')} <span class="stp ${stClass(p.state)}">${esc(p.state || '')}</span> <span class="muted" style="font-weight:400">· ${list.length} card(s) · ${fmtH(h)}</span></td>
             <td class="num"><button class="ibtn" data-act="c-new" data-parent="${p.id}" title="Criar cards nesta US">＋ cards</button></td></tr>`
          : `<tr class="grp"><td colspan="9"><span class="muted" style="font-weight:400">Sem pai</span></td></tr>`;
        body += list.map(rowHtml).join('');
      }
    } else body = rows.map(rowHtml).join('');
    html += `<div class="p-sec"><h3>${rows.length} card(s)${C.state ? ` em "${esc(C.state)}"` : ''}</h3>${rows.length ? `<table class="t"><tr><th>Card</th><th>Título</th><th>Tipo</th><th>Estado</th><th style="text-align:right">Suas horas</th><th style="text-align:right">No mês</th><th>Criado</th><th>Atualizado</th><th></th></tr>${body}</table>` : '<div class="muted">Nenhum card com esses filtros.</div>'}</div>`;
    if (C.loading) html += '<div class="muted">Atualizando…</div>';
    const scroll = el.scrollTop;
    el.innerHTML = html;
    el.scrollTop = scroll;
    const q = el.querySelector('.c-q');
    q.addEventListener('input', () => { C.q = q.value; const pos = q.selectionStart; renderCards(); const nq = $('.cardsv .c-q'); nq.focus(); nq.setSelectionRange(pos, pos); });
    el.querySelector('.c-show').addEventListener('change', (e) => { C.show = e.target.value; C.state = null; renderCards(); });
    el.querySelector('.c-group').addEventListener('change', (e) => { C.group = e.target.checked; renderCards(); });
  }
  // Card da aba Cards entra na lista de trabalho do app (para apontar/cronometrar)
  function adoptCard(id) {
    if (S.items.has(id)) return S.items.get(id);
    const w = C.raw.get(id);
    if (!w) return null;
    const it = toItem(w); S.items.set(id, it); return it;
  }

  // ───────── Criar cards a partir da US/issue pai ─────────
  const DEFAULT_TPL = [
    { key: 'analise', label: '🔍 Análise', num: 'Análise da issue {id}', tit: 'Análise - {titulo}', on: true },
    { key: 'dev', label: '💻 Desenvolvimento', num: 'Desenvolvimento da issue {id}', tit: 'Desenvolvimento - {titulo}', on: true },
    { key: 'testes', label: '🧪 Testes', num: 'Testes da issue {id}', tit: 'Testes - {titulo}', on: true },
    { key: 'commit', label: '📦 Commit', num: 'Commit das alterações {id}', tit: 'Commit das alterações - {titulo}', on: true },
  ];
  const tplList = () => DEFAULT_TPL.map((d) => ({ ...d, ...((prefs.cardTpl || {})[d.key] || {}) }));
  const fillTpl = (pat, p) => pat.replace(/\{id\}/g, p ? p.id : '{id}').replace(/\{titulo\}/g, p ? p.title : '{titulo}').slice(0, 255);
  async function openCreateCards(parentId) {
    let parent = null, children = [];
    let fmt = prefs.cardFmt || 'num';
    const rows = tplList().map((t) => ({ ...t, title: '', edited: false }));
    let extra = [];
    let created = [];
    const m = $('.modal');
    m.classList.add('wide');
    const patOf = (r) => (fmt === 'num' ? r.num : fmt === 'tit' ? r.tit : `${r.num} - {titulo}`);
    const exists = (title) => children.some((c) => norm2(c.title) === norm2(title));
    const norm2 = (x) => String(x || '').replace(/\s+/g, ' ').trim().toLowerCase();
    const refreshTitles = () => { for (const r of rows) if (!r.edited) r.title = fillTpl(patOf(r), parent); };
    const draw = () => {
      refreshTitles();
      const all = [...rows, ...extra];
      const sel = all.filter((r) => r.on && r.title.trim());
      m.innerHTML = `<h2>＋ Criar cards</h2>
        <p style="font-size:12px">Informe a US (ou issue) pai e escolha os cards. Eles serão criados como <b>filhos</b> dela, na mesma área e iteração.</p>
        <label>US / issue pai<input class="k-parent" list="k-parents" placeholder="Número ou título, ex.: 784761" value="${parent ? esc(`${parent.id} — ${parent.title}`) : parentId ? parentId : ''}" autocomplete="off"></label>
        <datalist id="k-parents">${[...C.parents.values()].filter((p) => p && !isDone(p.state) && !/^(Issue|Task)$/i.test(p.type || '')).map((p) => `<option value="${esc(`${p.id} — ${p.title}`)}"></option>`).join('')}</datalist>
        <div class="k-info" style="font-size:12px;color:#8b93a3;margin-top:-4px">${parent ? `✓ ${esc(parent.type)} · ${esc(parent.state)} · ${esc(parent.area)} · ${esc(parent.iteration)}${children.length ? ` · já tem ${children.length} filho(s)` : ''}` : ''}</div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:12px;color:#9aa3b2">Formato do título</span>
          <span class="seg3 k-fmt"><button data-f="num" class="${fmt === 'num' ? 'on' : ''}">Número da US</button><button data-f="tit" class="${fmt === 'tit' ? 'on' : ''}">Título da US</button><button data-f="both" class="${fmt === 'both' ? 'on' : ''}">Número + título</button></span>
        </div>
        <div class="tpls" style="display:flex;flex-direction:column;gap:6px">
          ${all.map((r, i) => `<div class="tpl${r.on ? '' : ' off'}" data-i="${i}">
            <label class="sw2"><input type="checkbox" class="k-on" ${r.on ? 'checked' : ''}> ${esc(r.label)}</label>
            <input class="tt k-title" value="${esc(r.title)}" placeholder="Título do card">
            ${parent && exists(r.title) ? '<span class="badge2" title="A US já tem um filho com esse título">já existe</span>' : ''}
            ${r.key ? `<button class="ibtn k-star" title="Usar este título como padrão para os próximos">⭐</button>` : '<button class="ibtn k-del" title="Remover">🗑</button>'}
          </div>`).join('')}
        </div>
        <div><button class="k-add">＋ Card personalizado</button> <span class="muted" style="font-size:11.5px">Use {id} e {titulo} no título para preencher com os dados da US.</span></div>
        <div class="row" style="align-items:center">
          <label style="flex:none">Tipo<select class="k-type">${['Issue', 'Task', 'Bug'].map((t) => `<option${(prefs.cardType || 'Issue') === t ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
          <label class="chk" style="margin-top:16px"><input type="checkbox" class="k-me" ${prefs.cardAssignMe === false ? '' : 'checked'}> Atribuir a mim</label>
          <span class="grow"></span>
          <span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#9aa3b2">Estado ao criar</span>
            <span class="seg3 k-state"><button data-s="New" class="${(prefs.cardState || 'New') === 'New' ? 'on' : ''}">New</button><button data-s="Active" class="${prefs.cardState === 'Active' ? 'on' : ''}">Active</button></span></span>
        </div>
        ${created.length ? `<div class="p-sec" style="margin:0"><h3>Criados</h3><ul class="created" style="margin:0;padding-left:18px">${created.map((c) => `<li>${c.error ? `<span style="color:#fca5a5">✗ ${esc(c.title)}: ${esc(c.error)}</span>` : `✓ <a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(parent.project)}/_workitems/edit/${c.id}" target="_blank" rel="noopener">#${c.id}</a> ${esc(c.title)}${c.state ? ` <span class="stp ${stClass(c.state)}">${esc(c.state)}</span>` : ''}${c.warn ? ` <span style="color:#fde68a;font-size:11.5px">⚠ ${esc(c.warn)}</span>` : ''} <button class="ibtn" data-act="timer" data-id="${c.id}" title="Iniciar no cronômetro">▶</button>`}</li>`).join('')}</ul></div>` : ''}
        <div class="err"></div>
        <div class="foot"><span class="grow"></span><button class="k-cancel">${created.length ? 'Fechar' : 'Cancelar'}</button>
          <button class="primary k-go" ${parent && sel.length ? '' : 'disabled'}>${prefs.dryRun ? 'Validar' : 'Criar'} ${sel.length} card(s)</button></div>`;
      bind();
    };
    let lookTimer = null, seq = 0;
    const lookup = async (val) => {
      const id = parseItemId(val);
      if (!id) { parent = null; children = []; draw(); return; }
      const my = ++seq;
      m.querySelector('.k-info').textContent = `Procurando #${id}…`;
      try {
        const [w] = await getItemsWith([id], ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.TeamProject', 'System.AreaPath', 'System.IterationPath']);
        if (my !== seq) return;
        if (!w) { parent = null; m.querySelector('.k-info').textContent = `#${id} não encontrado no Azure.`; m.querySelector('.k-info').style.color = '#fca5a5'; return; }
        const f = w.fields;
        parent = { id: w.id, title: f['System.Title'], type: f['System.WorkItemType'], state: f['System.State'], project: f['System.TeamProject'], area: f['System.AreaPath'], iteration: f['System.IterationPath'] };
        const kids = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.Parent] = ${w.id}`, parent.project, 200).catch(() => []);
        children = kids.length ? (await getItemsWith(kids, ['System.Id', 'System.Title', 'System.State'])).map((x) => ({ id: x.id, title: x.fields['System.Title'] })) : [];
        for (const r of [...rows, ...extra]) if (!r.edited || r.on) { const t = r.edited ? r.title : fillTpl(patOf(r), parent); if (exists(t)) r.on = false; }
        draw();
        const inp = m.querySelector('.k-parent'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      } catch (e) { if (my === seq) { m.querySelector('.k-info').textContent = e.message; m.querySelector('.k-info').style.color = '#fca5a5'; } }
    };
    const bind = () => {
      const all = [...rows, ...extra];
      const pin = m.querySelector('.k-parent');
      pin.addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(() => lookup(pin.value), 450); });
      pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(lookTimer); lookup(pin.value); } });
      m.querySelectorAll('.k-fmt button').forEach((b) => b.addEventListener('click', () => { fmt = b.dataset.f; prefs.cardFmt = fmt; savePrefs(); for (const r of rows) r.edited = false; draw(); }));
      m.querySelectorAll('.tpl').forEach((row) => {
        const r = all[Number(row.dataset.i)];
        row.querySelector('.k-on').addEventListener('change', (e) => { r.on = e.target.checked; draw(); });
        row.querySelector('.k-title').addEventListener('input', (e) => { r.title = e.target.value; r.edited = true; const go = m.querySelector('.k-go'); const n = [...rows, ...extra].filter((x) => x.on && x.title.trim()).length; go.textContent = `${prefs.dryRun ? 'Validar' : 'Criar'} ${n} card(s)`; go.disabled = !parent || !n; });
        row.querySelector('.k-star')?.addEventListener('click', () => {
          // guarda o título como padrão, trocando o número/título da US por {id}/{titulo}
          let pat = r.title;
          if (parent) { pat = pat.split(String(parent.title)).join('{titulo}').split(String(parent.id)).join('{id}'); }
          prefs.cardTpl = prefs.cardTpl || {};
          prefs.cardTpl[r.key] = { ...(prefs.cardTpl[r.key] || {}), [fmt === 'tit' ? 'tit' : 'num']: fmt === 'both' ? pat.replace(/ - \{titulo\}$/, '') : pat };
          savePrefs(); toast(`Padrão de "${r.label.replace(/^\S+\s/, '')}" salvo: ${pat}`);
        });
        row.querySelector('.k-del')?.addEventListener('click', () => { extra = extra.filter((x) => x !== r); draw(); });
      });
      m.querySelector('.k-add').addEventListener('click', () => { extra.push({ label: '✏ Personalizado', title: parent ? `${parent.id} - ` : '', on: true, edited: true }); draw(); setTimeout(() => { const ins = m.querySelectorAll('.k-title'); ins[ins.length - 1]?.focus(); }, 0); });
      m.querySelector('.k-type').addEventListener('change', (e) => { prefs.cardType = e.target.value; savePrefs(); });
      m.querySelector('.k-me').addEventListener('change', (e) => { prefs.cardAssignMe = e.target.checked; savePrefs(); });
      m.querySelectorAll('.k-state button').forEach((b) => b.addEventListener('click', () => {
        prefs.cardState = b.dataset.s; savePrefs();
        m.querySelectorAll('.k-state button').forEach((x) => x.classList.toggle('on', x === b));
      }));
      m.querySelector('.k-cancel').addEventListener('click', closeModal);
      m.querySelector('.k-go').addEventListener('click', createAll);
    };
    const createAll = async () => {
      const sel = [...rows, ...extra].filter((r) => r.on && r.title.trim());
      if (!parent || !sel.length) return;
      const type = m.querySelector('.k-type').value, me = m.querySelector('.k-me').checked;
      const wantState = prefs.cardState === 'Active' ? 'Active' : null;
      let stateInCreate = !!wantState; // tenta criar já no estado; se o Azure não aceitar, cria e muda logo depois
      const go = m.querySelector('.k-go'); go.disabled = true;
      const errEl = m.querySelector('.err');
      const body = (title) => JSON.stringify([
        { op: 'add', path: '/fields/System.Title', value: title.trim() },
        ...(stateInCreate ? [{ op: 'add', path: '/fields/System.State', value: wantState }] : []),
        { op: 'add', path: '/fields/System.AreaPath', value: parent.area },
        { op: 'add', path: '/fields/System.IterationPath', value: parent.iteration },
        ...(me ? [{ op: 'add', path: '/fields/System.AssignedTo', value: S.me.email }] : []),
        { op: 'add', path: '/relations/-', value: { rel: 'System.LinkTypes.Hierarchy-Reverse', url: `https://dev.azure.com/${S.org}/_apis/wit/workItems/${parent.id}` } },
      ]);
      const url = (validate) => `/${encodeURIComponent(parent.project)}/_apis/wit/workitems/$${encodeURIComponent(type)}?api-version=7.1${validate ? '&validateOnly=true' : ''}`;
      // 1) valida o primeiro antes de criar qualquer um (mostra campo obrigatório faltando, permissão etc.)
      errEl.textContent = 'Validando com o Azure…';
      try { await api(url(true), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(sel[0].title) }); }
      catch (e) {
        if (!stateInCreate) { errEl.textContent = `O Azure recusou: ${e.message}`; go.disabled = false; return; }
        // o processo não deixa nascer como Active: valida sem o estado e muda depois de criar
        stateInCreate = false;
        try { await api(url(true), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(sel[0].title) }); }
        catch (e2) { errEl.textContent = `O Azure recusou: ${e2.message}`; go.disabled = false; return; }
      }
      if (prefs.dryRun) { errEl.textContent = 'Modo teste: o Azure aceitaria criar estes cards. Nada foi criado.'; go.disabled = false; return; }
      created = [];
      for (const r of sel) {
        errEl.textContent = `Criando "${r.title}"…`;
        try {
          let w = await api(url(false), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(r.title) });
          let warn = '';
          if (wantState && w.fields && w.fields['System.State'] !== wantState) {
            try {
              w = await api(`/_apis/wit/workitems/${w.id}?api-version=7.1`, { method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' }, body: JSON.stringify([{ op: 'add', path: '/fields/System.State', value: wantState }]) });
            } catch (e) { warn = `criado como ${w.fields['System.State']}; não consegui mudar para ${wantState}: ${e.message}`; }
          }
          created.push({ id: w.id, title: r.title, state: w.fields ? w.fields['System.State'] : '', warn });
          if (w.fields) S.items.set(w.id, toItem(w));
          r.on = false;
        } catch (e) { created.push({ title: r.title, error: e.message }); }
      }
      const ok = created.filter((c) => !c.error).length;
      if (ok) { toast(`${ok} card(s) criado(s) em #${parent.id}.`); C.key = ''; R.key = ''; children.push(...created.filter((c) => !c.error)); }
      draw();
      if (S.view === 'cards') loadCards(true);
    };
    $('.modal-bg').classList.add('on');
    draw();
    if (parentId) lookup(String(parentId)); else setTimeout(() => m.querySelector('.k-parent')?.focus(), 0);
  }

  function setView(v) {
    S.view = v;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.act === `view-${v}`));
    $('.body').classList.toggle('off', v !== 'cal');
    $('.prod').classList.toggle('on', v === 'prod');
    $('.timerv').classList.toggle('on', v === 'timer');
    $('.cardsv').classList.toggle('on', v === 'cards');
    $('.st-left').textContent = v === 'prod'
      ? 'Conta como feito: card fechado e com horas suas apontadas. O dia é o dia do fechamento.'
      : v === 'timer' ? 'Apontar grava o tempo até agora e continua contando · Parar/Apontar grava tudo e zera. O cronômetro continua salvo se você fechar o app.'
      : v === 'cards' ? 'Seus cards: atribuídos a você, criados por você ou com horas suas · clique 2x num card para apontar'
      : 'Arraste no calendário para criar uma sessão · clique numa sessão para editar';
    if (v === 'prod') loadProd(true);

  async function reload(scrollToNow) {
    const ok = await run('Carregando suas sessões…', loadAll);
    if (ok) { lastSync = Date.now(); syncLabel(`✓ atualizado às ${timeStr(new Date())}`); }
    if (ok && scrollToNow) {

  async function searchAzure() {
    const q = S.filter.trim().replace(/^#/, '');
    if (!q) return;
    await run('Buscando no Azure…', async () => {
      let ids;
      if (/^\d+$/.test(q)) ids = [Number(q)];
      else ids = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.Title] CONTAINS '${q.replace(/'/g, "''")}' ORDER BY [System.ChangedDate] DESC`, S.project, 30);
      const found = await getItems(ids);
      if (!found.length) throw new Error('Nenhum item encontrado.');
      for (const w of found) {
        S.items.set(w.id, toItem(w));
        if (!prefs.pinned.includes(w.id)) prefs.pinned.push(w.id);
      }
      savePrefs();
      if (found.length === 1) S.selectedId = found[0].id;
      toast(`${found.length} item(ns) adicionado(s) aos fixados.`);
    });
  }

  document.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('[data-act]');
    const itemEl = ev.target.closest('.item');
    const blk = ev.target.closest('.blk');
    if (btn) {
      const act = btn.dataset.act, id = Number(btn.dataset.id);
      ev.stopPropagation();
      if (!S.me && act !== 'settings') return;
      if (act === 'prev') { S.weekStart = addDays(S.weekStart, -7); render(); }
      else if (act === 'next') { S.weekStart = addDays(S.weekStart, 7); render(); }
      else if (act === 'today') { S.weekStart = startOfWeek(new Date()); render(); }
      else if (act === 'reload') { await reload(false); if (S.view === 'prod') loadProd(true); if (S.side === 'recent') loadRecent(true); }
      else if (act === 'settings') openSettings();
      else if (act === 'side-mine' || act === 'side-recent') setSide(act === 'side-mine' ? 'mine' : 'recent');
      else if (act === 'r-days') { R.days = Number(btn.dataset.days); document.querySelectorAll('.range button').forEach((b) => b.classList.toggle('on', b === btn)); loadRecent(true); }
      else if (act === 'view-cal' || act === 'view-prod' || act === 'view-timer' || act === 'view-cards') setView(act.slice(5));
      else if (act === 'c-prev' || act === 'c-next') { C.month = new Date(C.month.getFullYear(), C.month.getMonth() + (act === 'c-prev' ? -1 : 1), 1); renderCards(); }
      else if (act === 'c-today') { C.month = monthStart(new Date()); renderCards(); }
      else if (act === 'c-reload') loadCards(true);
      else if (act === 'c-state') { C.state = btn.dataset.st || null; renderCards(); }
      else if (act === 'c-new') openCreateCards(btn.dataset.parent ? Number(btn.dataset.parent) : null);
      else if (act === 'p-prev' || act === 'p-next') { P.month = new Date(P.month.getFullYear(), P.month.getMonth() + (act === 'p-prev' ? -1 : 1), 1); P.selDay = null; loadProd(); }
      else if (act === 'p-today') { P.month = monthStart(new Date()); P.selDay = null; loadProd(); }
      else if (act === 'p-day') { const k = btn.dataset.day; P.selDay = P.selDay === k ? null : k; renderProd(); }
      else if (act === 'p-log') { const it = P.rows.find((r) => r.id === id); if (it) { const ensure = await ensureItem(id); const end = it.closed ? truncMin(it.closed) : truncMin(new Date()); openSessionDialog({ itemId: ensure ? ensure.id : id, start: new Date(end.getTime() - 3600e3), end }); } }
      else if (act === 'search') { if (S.side === 'recent') loadRecent(true); else searchAzure(); }
      else if (act === 'new') {
        const now = truncMin(new Date());
        now.setMinutes(Math.floor(now.getMinutes() / SNAP_MIN) * SNAP_MIN);
        openSessionDialog({ itemId: S.selectedId, start: new Date(now.getTime() - 3600e3), end: now });
      }
      else if (act === 'pin') {
        prefs.pinned = prefs.pinned.includes(id) ? prefs.pinned.filter((x) => x !== id) : [...prefs.pinned, id];
        savePrefs(); renderList();
      }
      else if (act === 'timer') timerFor(id);
      else if (act === 't-start') tStart();
      else if (act === 't-pause') tPark(false);
      else if (act === 't-edit') openSegEditor('main');
      else if (act === 'pk-resume') tResume(btn.dataset.pid);
      else if (act === 'pk-edit') openSegEditor(btn.dataset.pid);
      else if (act === 'pk-log') parkedLog(btn.dataset.pid);
      else if (act === 'pk-discard') { if (btn.dataset.confirm) parkedDiscard(btn.dataset.pid); else { btn.dataset.confirm = '1'; btn.textContent = 'Confirmar?'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = '✕'; } }, 4000); } }
      else if (act === 't-log') tLog(true);
      else if (act === 't-stop') tLog(false);
      else if (act === 't-discard') { if (btn.dataset.confirm) tDiscard(); else { btn.dataset.confirm = '1'; btn.textContent = 'Confirmar?'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = '✕ Descartar'; } }, 4000); } }
      else if (act === 'stop') stopTimer(id, btn.dataset.eid);
      return;
    }
    if (itemEl && !ev.target.closest('a')) {
      // Só troca a classe (sem redesenhar a lista), para o clique duplo funcionar no mesmo elemento
      const id = Number(itemEl.dataset.id);
      S.selectedId = S.selectedId === id ? null : id;
      document.querySelectorAll('.list .item.sel').forEach((e) => e.classList.remove('sel'));
      if (S.selectedId) itemEl.classList.add('sel');
      return;
    }
    if (blk && !dragJustEnded) {
      const it = S.items.get(Number(blk.dataset.id));
      const e = it?.entries.find((x) => x.id === blk.dataset.eid);
      if (it && e) openSessionDialog({ itemId: it.id, entry: e });
    }
  });

  document.addEventListener('dblclick', (ev) => {
    const crow = ev.target.closest('tr.crow');
    if (crow && !ev.target.closest('a,button') && S.me) { ev.preventDefault(); const id = Number(crow.dataset.cid); adoptCard(id); quickLog(id); return; }
    const itemEl = ev.target.closest('.item');
    if (!itemEl || ev.target.closest('.acts') || !S.me) return;
