<style>

<body>
<div class="panel">
  <header>

    <aside>
      <div class="side-tabs"><button data-act="side-mine" class="on">Meus itens</button><button data-act="side-recent">Criados recentemente</button></div>
      <div class="range" style="display:none"><button data-act="r-days" data-days="1" class="on">Hoje</button><button data-act="r-days" data-days="3">3 dias</button><button data-act="r-days" data-days="7">7 dias</button><span class="hint">2 cliques = apontar</span></div>

  <div class="loading">Carregando…</div>
  <div class="modal-bg"><div class="modal"></div></div>
  <div class="toast"></div>
</div>
<script>
(function () {
  'use strict';
  const APP_TOKEN = document.querySelector('meta[name="app-token"]').content;
  const F_WS = 'Custom.WorkSessionEntry';
  const F_AH = 'Custom.ActualHours';
  const F_CAH = 'Custom.ChildActualHours';
  const FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.Parent', 'System.TeamProject', F_WS, F_AH];
  const LS_KEY = 'apontadorHoras.app.v1';
  const HAD_PREFS = (() => { try { return !!localStorage.getItem(LS_KEY); } catch { return false; } })(); // já usava o app antes desta abertura
  const PALETTE = ['#4f8cff', '#f5a524', '#17c964', '#f31260', '#9353d3', '#06b7db', '#ff7a45', '#a3e635', '#e879f9', '#94a3b8'];
  const PX_PER_HOUR = 44;
  const SNAP_MIN = 15;
  const DAY_NAMES = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  const MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  const prefs = Object.assign({ pinned: [], known: [], dailyGoal: 8, cardGoal: 0, dayStart: 7, dayEnd: 20, dryRun: false }, loadPrefs());
  function loadPrefs() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
  if (!Array.isArray(prefs.closedCats)) prefs.closedCats = ['Resolved', 'Completed'];
  if (!Array.isArray(prefs.hideTitles)) prefs.hideTitles = ['Code Review', 'Integrated Test'];
  if (!Array.isArray(prefs.hiddenIds)) prefs.hiddenIds = [];
  if (!Array.isArray(prefs.hideTypes)) prefs.hideTypes = [];
  // Padrões novos (1.2.3): Unit Test e Release Note costumam ser criados pelo Azure/outros e apontados em outro card
  if ((prefs.hideVer || 1) < 2) {
    if (!prefs.hideTitles.some((x) => x.toLowerCase() === 'unit test')) prefs.hideTitles.push('Unit Test');
    if (!prefs.hideTypes.some((x) => x.toLowerCase() === 'release note')) prefs.hideTypes.push('Release Note');
    prefs.hideVer = 2;
  }
  function savePrefs() { try { localStorage.setItem(LS_KEY, JSON.stringify(prefs)); } catch { /* ignore */ } }

  const S = { me: null, org: 'emr-cm', project: 'EMR', items: new Map(), weekStart: startOfWeek(new Date()), selectedId: null, filter: '', busy: false, view: 'cal', side: 'mine' };
  // Aba lateral "Criados recentemente"
  const R = { days: 1, rows: [], raw: new Map(), loading: false, error: '', key: '' };

  // ───────── Datas ─────────
  function pad(n) { return String(n).padStart(2, '0'); }
  function startOfWeek(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function timeStr(d) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function dateInput(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  function combine(ds, ts) { const [y, m, d] = ds.split('-').map(Number); const [h, mi] = ts.split(':').map(Number); return new Date(y, m - 1, d, h, mi, 0, 0); }
  function truncMin(d) { const x = new Date(d); x.setSeconds(0, 0); return x; }
  function fmtH(h) { const m = Math.round(h * 60); return `${Math.floor(m / 60)}h${pad(m % 60)}`; }
  function fmtRange(e) { const s = new Date(e.start); return `${pad(s.getDate())}/${pad(s.getMonth() + 1)} ${timeStr(s)}–${e.end ? timeStr(new Date(e.end)) : 'em andamento'}`; }

  // ───────── Feriados ─────────
  // Nacionais calculados aqui + os que vêm do Clockin (pelo script) ou adicionados à mão.
  function easterOf(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, mo - 1, da);
  }
  function nationalHolidays(y) {
    const e = easterOf(y);
    return [[`${y}-01-01`, 'Confraternização Universal'], [dateInput(addDays(e, -2)), 'Sexta-feira Santa'], [`${y}-04-21`, 'Tiradentes'],
      [`${y}-05-01`, 'Dia do Trabalho'], [`${y}-09-07`, 'Independência do Brasil'], [`${y}-10-12`, 'Nossa Senhora Aparecida'],
      [`${y}-11-02`, 'Finados'], [`${y}-11-15`, 'Proclamação da República'], [`${y}-11-20`, 'Dia da Consciência Negra'], [`${y}-12-25`, 'Natal']]
      .map(([date, name]) => ({ date, name, source: 'nacional' }));
  }
  // Pontos facultativos que muitas empresas dão (cada um liga nas Configurações)
  const OPT_HOL = {
    carnaval: { label: 'Carnaval (segunda e terça)', days: (e) => [[addDays(e, -48), 'Carnaval'], [addDays(e, -47), 'Carnaval']] },
    cinzas: { label: 'Quarta-feira de Cinzas', days: (e) => [[addDays(e, -46), 'Quarta-feira de Cinzas']] },
    corpus: { label: 'Corpus Christi', days: (e) => [[addDays(e, 60), 'Corpus Christi']] },
  };
  if (!Array.isArray(prefs.optHol)) prefs.optHol = [];
  let HOL_SAVED = [], HOL_TEAM = [], HOL_TEAMINFO = {};
  const HOL = new Map();
  // Ordem: nacionais → facultativos ligados → lista da equipe → Clockin e os seus (que podem desativar qualquer um)
  function baseHolidays(y) {
    const out = nationalHolidays(y);
    const e = easterOf(y);
    for (const k of prefs.optHol) if (OPT_HOL[k]) for (const [d, name] of OPT_HOL[k].days(e)) out.push({ date: dateInput(d), name, source: 'facultativo' });
    for (const h of HOL_TEAM) if (h.date.startsWith(String(y))) out.push({ date: h.date, name: h.name, source: 'equipe' });
    return out;
  }
  function rebuildHolidays() {
    HOL.clear();
    const y = new Date().getFullYear();
    for (const yy of [y - 1, y, y + 1]) for (const h of baseHolidays(yy)) HOL.set(h.date, h);
    for (const h of HOL_SAVED) { if (h.off) HOL.delete(h.date); else HOL.set(h.date, h); }
  }
  rebuildHolidays();
  function applyHolidays(r) { if (!r) return; HOL_SAVED = r.holidays || []; if (r.team) HOL_TEAM = r.team; if (r.teamInfo) HOL_TEAMINFO = r.teamInfo; rebuildHolidays(); }
  async function loadHolidays(refresh) { try { applyHolidays(await local('/api/holidays' + (refresh ? '?refresh=1' : ''))); } catch { /* mantém os nacionais */ } rebuildHolidays(); }
  const holidayOf = (d) => HOL.get(dateInput(d)) || null;
  const isWorkday = (d) => d.getDay() % 6 !== 0 && !holidayOf(d);
  const workdaysIn = (a, b) => { let n = 0; for (let d = new Date(a); d < b; d = addDays(d, 1)) if (isWorkday(d)) n++; return n; };

  // ───────── Sessões (mesmo formato da extensão Work Session Hub) ─────────
  function decodeHtml(s) { return new DOMParser().parseFromString(`<textarea>${s}</textarea>`, 'text/html').querySelector('textarea').value; }
  function htmlText(s) { return new DOMParser().parseFromString(s, 'text/html').documentElement.textContent || ''; }
  function parseEntries(raw) {
    if (raw == null) return [];
    if (typeof raw !== 'string') return null;
    const s = raw.trim();
    if (!s) return [];
    for (const c of [s, decodeHtml(s), htmlText(s)]) {
      try { const v = JSON.parse(c); if (Array.isArray(v)) return v; } catch { /* tenta o próximo */ }
    }
    return null;
  }
  const floorMin = (d) => Math.floor(new Date(d).getTime() / 6e4) * 6e4;
  function entryHours(e, now = Date.now()) {
    if (!e.start) return 0;
    const s = new Date(e.start).getTime();
    const en = e.end ? new Date(e.end).getTime() : now;
    return Math.max(0, (en - s) / 36e5);
  }
  function closedTotal(arr) { return Math.round(100 * arr.reduce((a, e) => (e.start && e.end ? a + entryHours(e) : a), 0)) / 100; }
  function overlaps(a, b) {
    if (!a.start || !b.start) return false;
    const as = floorMin(a.start), bs = floorMin(b.start);
    const ae = a.end ? floorMin(a.end) : Infinity, be = b.end ? floorMin(b.end) : Infinity;
    return Math.max(as, bs) < Math.min(ae, be);
  }
  function isMine(e) { return !!S.me && (e.userEmail || '').trim().toLowerCase() === S.me.email; }
  function newId() { return `ws-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`; }

  // ───────── Comunicação com o app local ─────────
  async function local(path, { method = 'GET', body } = {}) {
    const res = await fetch(path, { method, body: body ? JSON.stringify(body) : undefined, headers: { 'X-App-Token': APP_TOKEN, 'Content-Type': 'application/json' } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.message || `Erro ${res.status}`);
    return j;
  }
  async function api(path, { method = 'GET', body, headers = {} } = {}) {
    let res;
    try {
      res = await fetch('/api/ado' + path, { method, body, headers: { 'X-App-Token': APP_TOKEN, Accept: 'application/json', ...headers } });
    } catch {
      throw new Error('O app foi fechado. Abra o ApontadorHoras.exe de novo.');
    }
    const text = await res.text();
    let json = null;
    try { json = text ? JSON.parse(text) : null; } catch { /* não-JSON */ }
    if (!res.ok) {
      const err = new Error((json && json.message) || `HTTP ${res.status}`);
      err.status = res.status;
      if (res.status === 401) setTimeout(() => openSetup('O token não está mais valendo. Gere um novo e cole aqui.'), 50);
      throw err;
    }
    return json;
  }
  async function wiql(query, project = S.project, top = 200) {
    const j = await api(`/${encodeURIComponent(project)}/_apis/wit/wiql?$top=${top}&api-version=7.1`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }),
    });
    return (j.workItems || []).map((w) => w.id);
  }
  // Busca em lotes de 200, até 4 lotes ao mesmo tempo (em vez de um esperando o outro)
  async function inChunks(ids, fn, size = 200, conc = 4) {
    const uniq = [...new Set(ids.map(Number))].filter(Boolean);
    const chunks = []; for (let i = 0; i < uniq.length; i += size) chunks.push(uniq.slice(i, i + size));
    const out = []; let k = 0;
    await Promise.all(Array.from({ length: Math.min(conc, chunks.length) }, async () => { while (k < chunks.length) out.push(...await fn(chunks[k++])); }));
    return out;
  }
  async function getItems(ids) {
    return inChunks(ids, async (chunk) => ((await api(`/_apis/wit/workitems?ids=${chunk.join(',')}&fields=${FIELDS.join(',')}&errorPolicy=Omit&api-version=7.1`)).value || []).filter((w) => w && w.fields));
  }
  // ───────── Lista do Work Session Hub (para os itens aparecerem lá) ─────────
  async function idx(method, sub = '', body) {
    let res;
    try { res = await fetch('/api/index' + sub, { method, body: body ? JSON.stringify(body) : undefined, headers: { 'X-App-Token': APP_TOKEN, 'Content-Type': 'application/json' } }); }
    catch { throw new Error('O app foi fechado. Abra o ApontadorHoras.exe de novo.'); }
    const text = await res.text();
    let j = null;
    try { j = text ? JSON.parse(text) : null; } catch { /* não-JSON */ }
    if (!res.ok) { const e = new Error((j && j.message) || `HTTP ${res.status}`); e.status = res.status; e.code = j?.code; e.typeKey = j?.typeKey; throw e; }
    return j;
  }
  async function readIndex() {
    try { return await idx('GET', '/' + encodeURIComponent(S.me.email)); }
    catch (e) { if (e.status === 404) return null; throw e; }
  }
  async function writeIndex(update) {
    let cur = await readIndex();
    for (let attempt = 1; attempt <= 4; attempt++) {
      const before = cur?.workItems ?? [];
      const after = update(before.slice());
      if (cur && after.length === before.length && after.every((x, i) => x === before[i])) return cur;
      const doc = { ...(cur || {}), id: S.me.email, name: cur?.name ?? S.me.email, workItems: after };
      if (!cur) delete doc.__etag;
      if (attempt === 4) doc.__etag = -1;
      try { return await idx('PUT', '', doc); }
      catch (e) {
        const conflict = e.status === 409 || e.status === 412 || /InvalidDocumentVersion|1660003/.test(`${e.message} ${e.typeKey || ''}`);
        if (attempt === 4 || !conflict) throw e;
        cur = await readIndex();
      }
    }
  }
  function indexWarn(e) {
    console.warn('[Apontador] índice do hub', e);
    if (S.indexWarned) return;
    S.indexWarned = true;
    toast(e.code === 'EXT_SCOPE'
      ? 'Horas salvas no item, mas para aparecerem no Work Session Hub o token precisa da permissão "Extension Data (Read & write)". Gere um novo em ⚙ → Trocar token.'
      : `Horas salvas, mas não consegui atualizar a lista do Work Session Hub: ${e.message}`, true);
  }
  async function hubAdd(ids) {
    // só mexe na lista do Work Session Hub se o item ainda não está nela
    const need = ids.filter((id) => !(S.hubIds || []).includes(id));
    if (prefs.dryRun || !need.length) return;
    try {
      const doc = await writeIndex((w) => [...w, ...need.filter((id) => !w.includes(id))]);
      S.hubIds = doc && Array.isArray(doc.workItems) ? doc.workItems : [...(S.hubIds || []), ...need];
    } catch (e) { indexWarn(e); }
  }
  async function hubRemoveIfEmpty(id) {
    if (prefs.dryRun) return;
    const it = S.items.get(id);
    if (it && it.entries.some(isMine)) return;
    try { await writeIndex((w) => w.filter((x) => x !== id)); } catch (e) { indexWarn(e); }
  }

  function toItem(w) {
    const entries = parseEntries(w.fields[F_WS]);
    return {
      id: w.id, rev: w.rev,
      title: w.fields['System.Title'] || `#${w.id}`,
      type: w.fields['System.WorkItemType'] || '',
      state: w.fields['System.State'] || '',
      parent: w.fields['System.Parent'],
      project: w.fields['System.TeamProject'] || S.project,
      entries: entries || [],
      unreadable: entries === null,
    };
  }

  function parseItemId(v) { const m = String(v || '').match(/\d{3,}/); return m ? Number(m[0]) : null; }
  // Busca um item que ainda não está na lista e fixa ele, para aparecer da próxima vez
  async function ensureItem(id) {
    if (S.items.has(id)) return S.items.get(id);
    const [w] = await getItems([id]);
    if (!w) return null;
    const it = toItem(w);
    S.items.set(it.id, it);
    if (!prefs.pinned.includes(it.id)) { prefs.pinned.push(it.id); savePrefs(); }
    return it;
  }

  async function loadAll() {
    const base = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.ChangedDate] >= @Today - 45`;
    const qIds = wiql(`${base} AND ([System.AssignedTo] = @Me OR [System.AssignedTo] EVER @Me) ORDER BY [System.ChangedDate] DESC`)
      .catch((e) => { if (e.status === 401) throw e; return wiql(`${base} AND [System.AssignedTo] = @Me ORDER BY [System.ChangedDate] DESC`); });
    const qHub = readIndex().then((x) => x?.workItems || []).catch((e) => { if (e.code !== 'EXT_SCOPE') console.warn('[Apontador] índice', e); return null; });
    // os itens já conhecidos não precisam esperar a consulta: começam a vir junto
    const qKnown = getItems([...prefs.pinned, ...prefs.known, ...(S.hubIds || [])]);
    const [ids, hubRes, known] = await Promise.all([qIds, qHub, qKnown]);
    const hubIds = hubRes || S.hubIds || [];
    if (hubRes) S.hubIds = hubRes;
    const have = new Set(known.map((w) => w.id));
    const all = known.concat(await getItems([...ids, ...hubIds].filter((id) => !have.has(Number(id)))));
    S.items = new Map(all.map((w) => [w.id, toItem(w)]));
    saveSnapshot(all);
    rememberKnown();
    // Itens com sessões suas que o Work Session Hub ainda não lista (ex.: lançados por este app antes)
    const missing = [...S.items.values()].filter((it) => it.entries.some(isMine) && !hubIds.includes(it.id)).map((it) => it.id);
    if (missing.length) hubAdd(missing);
  }
  // Cópia dos itens da última sessão: o calendário aparece na hora ao abrir e atualiza por trás
  const SNAP_KEY = 'apontadorHoras.snapshot.v1';
  function saveSnapshot(all) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify({ email: S.me.email, project: S.project, at: Date.now(), hubIds: S.hubIds || [], items: all.map((w) => ({ id: w.id, rev: w.rev, fields: w.fields })) })); } catch { /* cheio ou bloqueado: segue sem cópia */ }
  }
  function loadSnapshot() {
    try {
      const j = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
      if (!j || j.email !== S.me.email || j.project !== S.project || Date.now() - j.at > 14 * 864e5) return false;
      S.items = new Map(j.items.map((w) => [w.id, toItem(w)])); S.hubIds = j.hubIds || [];
      return true;
    } catch { return false; }
  }
  function rememberKnown() {
    const mine = [...S.items.values()].filter((it) => it.entries.some(isMine)).map((it) => it.id);
    prefs.known = [...new Set([...mine, ...prefs.known])].slice(0, 300);
    savePrefs();
  }
  async function refreshItem(id) {
    const [w] = await getItems([id]);
    if (w) S.items.set(w.id, toItem(w));
  }

  // Lê o item fresco, aplica a mudança e grava com teste de revisão (não sobrescreve alteração de outra pessoa).
  async function mutateItem(id, fn) {
    for (let attempt = 1; attempt <= 3; attempt++) {
      // acabou de ler este item (conferência de conflito)? usa a leitura; o teste de /rev garante que nada mudou
      let it = attempt === 1 && S.freshIds && S.freshIds.has(id) && Date.now() - S.freshAt < 5000 ? S.items.get(id) : null;
      if (!it) {
        const [w] = await getItems([id]);
        if (!w) throw new Error(`Item #${id} não encontrado.`);
        it = toItem(w);
      }
      if (it.unreadable) throw new Error(`Não consegui ler as sessões já gravadas no item #${id}. Nada foi alterado.`);
      const next = fn(it.entries.slice(), it);
      const ops = [
        { op: 'test', path: '/rev', value: it.rev },
        { op: 'add', path: `/fields/${F_WS}`, value: JSON.stringify(next) },
        { op: 'add', path: `/fields/${F_AH}`, value: closedTotal(next) },
      ];
      let saved = null;
      try {
        saved = await api(`/_apis/wit/workitems/${id}?api-version=7.1${prefs.dryRun ? '&validateOnly=true' : ''}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' }, body: JSON.stringify(ops),
        });
      } catch (e) {
        const revConflict = e.status === 409 || e.status === 412 || /\brev\b|TF26071|TF401289|test operation/i.test(e.message);
        if (revConflict && S.freshIds) S.freshIds.delete(id);
        if (attempt < 3 && revConflict) continue;
        throw e;
      }
      if (!prefs.dryRun) {
        // a resposta da gravação já é o item atualizado: não precisa ler de novo
        if (saved && saved.fields && saved.fields[F_WS] !== undefined) { const n = toItem(saved); S.items.set(n.id, n); } else await refreshItem(id);
        if (S.freshIds) S.freshIds.delete(id);
        rollupFeature(it).catch((err) => console.warn('[Apontador] rollup da Feature falhou', err));
      }
      return next;
    }
    throw new Error('O item foi alterado por outra pessoa várias vezes seguidas. Tente de novo.');
  }

  // Mesmo comportamento da extensão: recalcula ActualHours/ChildActualHours da Feature pai.
  async function rollupFeature(it) {
    let featId = null;
    if (it.type === 'Feature') featId = it.id;
    else if (it.parent) {
      const [p] = await getItems([it.parent]);
      if (p && p.fields['System.WorkItemType'] === 'Feature') featId = p.id;
    }
    if (!featId) return;
    const proj = it.project || S.project;
    const childIds = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.Parent] = ${featId} AND [System.TeamProject] = '${proj.replace(/'/g, "''")}'`, proj);
    const all = await getItems([featId, ...childIds]);
    let own = 0, child = 0;
    for (const w of all) {
      const h = closedTotal(parseEntries(w.fields[F_WS]) || []);
      if (w.id === featId) own += h; else child += h;
    }
    await api(`/_apis/wit/workitems/${featId}?api-version=7.1`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' },
      body: JSON.stringify([
        { op: 'add', path: `/fields/${F_AH}`, value: Math.round(own * 100) / 100 },
        { op: 'add', path: `/fields/${F_CAH}`, value: Math.round(child * 100) / 100 },
      ]),
    });
  }

  async function assertNoConflict(candidate, excludeEntryId) {
    const fresh = await getItems([...S.items.keys()]);
    S.freshAt = Date.now(); S.freshIds = new Set(fresh.map((w) => w.id));
    for (const w of fresh) {
      const it = toItem(w);
      S.items.set(it.id, it);
      for (const e of it.entries) {
        if (e.id && e.id === excludeEntryId) continue;
        if (isMine(e) && overlaps(candidate, e)) throw new Error(`Esse horário bate com outra sessão sua (${fmtRange(e)}) no item #${it.id}.`);
      }
    }
  }

  async function createSession({ itemId, start, end, notes }, ignoreEntryId) {
    start = truncMin(start); end = end ? truncMin(end) : undefined;
    if (end && end <= start) throw new Error('O fim precisa ser depois do início.');
    const email = S.me.email;
    const entry = {
      id: newId(), name: `${email} @ ${start.toISOString()}`, workItemId: itemId, userEmail: email,
      start: start.toISOString(), end: end ? end.toISOString() : undefined, notes: notes || '',
      createdAt: new Date().toISOString(), createdBy: email,
    };
    await assertNoConflict(entry, ignoreEntryId);
    await mutateItem(itemId, (entries) => {
      const clash = entries.find((e) => isMine(e) && e.id !== ignoreEntryId && overlaps(entry, e));
      if (clash) throw new Error(`Esse horário bate com outra sessão sua (${fmtRange(clash)}) neste item.`);
      return [...entries, entry];
    });
    if (!prefs.known.includes(itemId)) { prefs.known.unshift(itemId); savePrefs(); }
    hubAdd([itemId]); // em segundo plano: a sessão já está salva
  }

  async function updateSession(itemId, entryId, { start, end, notes }) {
    start = truncMin(start); end = end ? truncMin(end) : undefined;
    if (end && end <= start) throw new Error('O fim precisa ser depois do início.');
    const probe = { start: start.toISOString(), end: end ? end.toISOString() : undefined };
    await assertNoConflict(probe, entryId);
    await mutateItem(itemId, (entries) => {
      const i = entries.findIndex((e) => e.id === entryId);
      if (i < 0) throw new Error('Essa sessão não existe mais (talvez tenha sido excluída em outro lugar).');
      const cur = entries[i];
      const upd = { ...cur, workItemId: itemId, start: probe.start, end: probe.end, notes: notes ?? cur.notes ?? '', lastUpdate: new Date().toISOString(), updatedBy: S.me.email };
      if (!upd.end) delete upd.end;
      return entries.map((e, j) => (j === i ? upd : e));
    });
  }

  async function deleteSession(itemId, entryId) {
    await mutateItem(itemId, (entries) => {
      const next = entries.filter((e) => e.id !== entryId);
      if (next.length === entries.length) throw new Error('Essa sessão não existe mais.');
      return next;
    });
    await hubRemoveIfEmpty(itemId);
  }

  async function moveSession(fromId, entryId, toId, data) {
    // Remove do item antigo e cria no novo; se a criação falhar, devolve a sessão original.
    const from = S.items.get(fromId);
    const orig = from?.entries.find((e) => e.id === entryId);
    if (!orig) throw new Error('Sessão original não encontrada.');
    if (prefs.dryRun) { await createSession({ ...data, itemId: toId }, entryId); return; }
    await deleteSession(fromId, entryId);
    try { await createSession({ ...data, itemId: toId }); }
    catch (e) {
      await mutateItem(fromId, (entries) => [...entries, orig]).catch(() => {});
      throw e;
    }
  }

  // ───────── Derivados p/ a tela ─────────
  function colorOf(id) { return PALETTE[Math.abs(Number(id) * 2654435761 % 2 ** 32) % PALETTE.length]; }
  function myEntries() {
    const out = [];
    for (const it of S.items.values()) for (const e of it.entries) if (isMine(e) && e.start) out.push({ it, e });
    return out;
  }
  function runningEntry() { return myEntries().find(({ e }) => !e.end); }
  function weekSegments() {
    const segs = [];
    const now = new Date();
    for (const { it, e } of myEntries()) {
      const s = new Date(e.start), en = e.end ? new Date(e.end) : now;
      for (let d = 0; d < 7; d++) {
        const day0 = addDays(S.weekStart, d), day1 = addDays(day0, 1);
        const a = s > day0 ? s : day0, b = en < day1 ? en : day1;
        if (b > a) segs.push({ it, e, day: d, a, b, hours: (b - a) / 36e5 });
      }
    }
    return segs;
  }

  // ───────── UI ─────────
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const azureUrl = (it) => `https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(it.project)}/_workitems/edit/${it.id}`;

  let toastTimer;
  function toast(msg, bad = false) {
    const t = $('.toast');
    t.textContent = msg; t.className = `toast on${bad ? ' bad' : ''}`;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = 'toast'), bad ? 6000 : 3000);
  }
  function setLoading(on, msg = 'Carregando…') { const l = $('.loading'); l.textContent = msg; l.classList.toggle('on', on); }
  async function run(label, fn) {
    if (S.busy) return;
    S.busy = true; setLoading(true, label);
    try { await fn(); return true; }
    catch (e) { console.error('[Apontador]', e); if (e.status !== 401) toast(e.message || String(e), true); return false; }
    finally { S.busy = false; setLoading(false); render(); }
  }

  function render() {
    renderHeader(); renderList(); renderCalendar(); renderRunning();
    if (S.view === 'prod') renderProd();
    if (S.view === 'timer' && !document.activeElement?.closest?.('.timerv')) renderTimer(); else renderTimerBadge();
    $('.badge.test').style.display = prefs.dryRun ? '' : 'none';
    const r = S.me && runningEntry();
    document.title = r ? `● ${fmtH(entryHours(r.e))} · Apontador de Horas` : 'Apontador de Horas';
  }
  function renderHeader() {
    const end = addDays(S.weekStart, 6);
    const sameM = S.weekStart.getMonth() === end.getMonth();
    $('.week-label').textContent = `${S.weekStart.getDate()}${sameM ? '' : ' ' + MONTHS[S.weekStart.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
    const total = weekSegments().reduce((a, s) => a + s.hours, 0);
    const goal = prefs.dailyGoal * workdaysIn(S.weekStart, addDays(S.weekStart, 7));
    $('.goal-txt').textContent = `Semana: ${fmtH(total)} / ${fmtH(goal)}`;
    const bar = $('.goal .bar');
    bar.querySelector('i').style.width = `${goal ? Math.min(100, (100 * total) / goal) : 100}%`;
    bar.classList.toggle('low', total < goal);
    $('.st-right').textContent = S.me ? `${S.me.name} · ${S.org}/${S.project} · ${S.items.size} itens` : '';
  }
  function weekHoursByItem() {
    const m = new Map();
    for (const s of weekSegments()) m.set(s.it.id, (m.get(s.it.id) || 0) + s.hours);
    return m;
  }
  function renderList() {
    if (S.side === 'recent') return renderRecent();
    const list = $('.list');
    const f = S.filter.trim().toLowerCase().replace(/^#/, '');
    const wh = weekHoursByItem();
    const items = [...S.items.values()].filter((it) => !f || String(it.id).includes(f) || it.title.toLowerCase().includes(f));
    const closed = (it) => isClosedState(it.project, it.type, it.state) || isRemovedState(it.project, it.type, it.state);
    const groups = [
      ['Com horas nesta semana', items.filter((it) => wh.has(it.id)).sort((a, b) => wh.get(b.id) - wh.get(a.id))],
      ['Fixados', items.filter((it) => !wh.has(it.id) && prefs.pinned.includes(it.id))],
      ['Meus itens recentes', items.filter((it) => !wh.has(it.id) && !prefs.pinned.includes(it.id) && !closed(it))],
      ['Fechados', items.filter((it) => !wh.has(it.id) && !prefs.pinned.includes(it.id) && closed(it))],
    ];
    let html = '';
    for (const [name, arr] of groups) {

        html += `<div class="item${S.selectedId === it.id ? ' sel' : ''}" data-id="${it.id}" draggable="true" title="${esc(it.title)} · arraste para um dia do calendário para apontar">
          <span class="sw" style="background:${colorOf(it.id)}"></span>
          <div class="txt"><div class="t">${esc(it.title)}</div><div class="m">#${it.id} · ${esc(it.type)} · ${esc(it.state)}${it.unreadable ? ' · ⚠ sessões ilegíveis' : ''}</div></div>
          ${wh.has(it.id) ? `<span class="h">${fmtH(wh.get(it.id))}</span>` : ''}
          <span class="acts">
            <button data-act="timer" data-id="${it.id}" title="Iniciar no cronômetro">▶</button>
            <button data-act="pin" data-id="${it.id}" title="${pinned ? 'Desafixar' : 'Fixar'}">${pinned ? '★' : '☆'}</button>
            <a href="${azureUrl(it)}" target="_blank" rel="noopener" title="Abrir no Azure"><button tabindex="-1">↗</button></a>
          </span></div>`;
      }
    }
    if (!html) html = `<div class="empty">${S.me ? 'Nenhum item. Busque por #ID ou título e clique em 🔎.' : 'Carregando…'}</div>`;
    list.innerHTML = html;
  }
  const RECENT_FIELDS = [...FIELDS, 'System.CreatedDate', 'System.CreatedBy', 'System.AssignedTo'];
  async function loadRecent(force, silent) {
    const key = `${R.days}|${S.project}`;
    if (!force && R.key === key) { renderRecent(); return; }
    if (R.rows && R.rows.length && R.dataKey === key) { silent = true; renderRecent(); }
    if (!silent) { R.loading = true; R.error = ''; renderRecent(); }
    try {
      const ids = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.CreatedDate] >= @Today - ${R.days - 1} AND ([System.CreatedBy] = @Me OR [System.AssignedTo] = @Me) ORDER BY [System.CreatedDate] DESC`, S.project, 200);
      const out = await getItemsWith(ids, RECENT_FIELDS);
      R.raw = new Map(out.map((w) => [w.id, w]));
      R.rows = out.map((w) => {
        const it = toItem(w);
        const who = (x) => (x && (x.uniqueName || x.displayName) || '');
        return { ...it, created: new Date(w.fields['System.CreatedDate']), createdBy: who(w.fields['System.CreatedBy']), createdByName: w.fields['System.CreatedBy']?.displayName || '' };
      }).sort((a, b) => b.created - a.created);
      R.key = key; R.dataKey = key;
    } catch (e) { R.error = e.message; }
    finally { R.loading = false; renderRecent(); }
  }
  // Coloca um card da aba "recentes" na lista de trabalho do app (sem fixar), para poder apontar nele
  function adoptItem(id) {
    if (S.items.has(id)) return S.items.get(id);
    const w = R.raw.get(id) || C.raw.get(id);
    if (!w) return null;
    const it = toItem(w);
    S.items.set(id, it);
    return it;
  }
  function renderRecent() {
    const list = $('.list');
    const f = S.filter.trim().toLowerCase().replace(/^#/, '');
    if (R.loading && !R.rows.length) { list.innerHTML = '<div class="empty">Buscando cards criados…</div>'; return; }
    if (R.error) { list.innerHTML = `<div class="empty" style="color:#fca5a5">Não consegui buscar: ${esc(R.error)}</div>`; return; }
    const rows = R.rows.filter((r) => !f || String(r.id).includes(f) || r.title.toLowerCase().includes(f));
    if (!rows.length) { list.innerHTML = `<div class="empty">Nenhum card criado por você ou atribuído a você ${R.days === 1 ? 'hoje' : `nos últimos ${R.days} dias`}.</div>`; return; }
    const today = new Date();
    const wh = weekHoursByItem();
    let html = '', lastDay = '';
    for (const r of rows) {
      const dk = sameDay(r.created, today) ? 'Hoje' : r.created.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
      if (dk !== lastDay) { html += `<div class="sec">${esc(dk)}</div>`; lastDay = dk; }
      const mine = (r.createdBy || '').toLowerCase() === S.me.email;
      const live = S.items.get(r.id);
      const myH = (live ? live.entries : r.entries).filter(isMine).reduce((a, e) => a + (e.end ? entryHours(e) : 0), 0);
      html += `<div class="item${S.selectedId === r.id ? ' sel' : ''}" data-id="${r.id}" data-src="recent" draggable="true" title="Clique 2x ou arraste para um dia do calendário para apontar horas em #${r.id}">
        <span class="sw" style="background:${colorOf(r.id)}"></span>
        <div class="txt"><div class="t">${esc(r.title)}${Date.now() - r.created < 2 * 3600e3 ? '<span class="new">novo</span>' : ''}</div>
        <div class="m">#${r.id} · ${esc(r.type)} · ${esc(r.state)} · criado ${timeStr(r.created)}${mine ? '' : ` por ${esc(r.createdByName.split(' ')[0])}`}</div></div>
        ${myH ? `<span class="h" title="Suas horas neste card">${fmtH(myH)}</span>` : ''}
        <span class="acts">
          <button data-act="timer" data-id="${r.id}" title="Iniciar no cronômetro">▶</button>
          <a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(r.project)}/_workitems/edit/${r.id}" target="_blank" rel="noopener" title="Abrir no Azure"><button tabindex="-1">↗</button></a>
        </span></div>`;
    }
    if (R.loading) html += '<div class="empty">Atualizando…</div>';
    list.innerHTML = html;
  }
  function setSide(v) {
    S.side = v;
    document.querySelectorAll('.side-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.act === `side-${v}`));
    $('.range').style.display = v === 'recent' ? 'flex' : 'none';

    if (v === 'recent') loadRecent(true); else renderList();
  }
  // Clique duplo num card (qualquer aba) abre a tela de apontamento já com ele
  function quickLog(id) {
    const it = adoptItem(id) || S.items.get(id);
    if (!it) return;
    const now = truncMin(new Date());
    now.setMinutes(Math.floor(now.getMinutes() / SNAP_MIN) * SNAP_MIN);

  }

  function renderRunning() {
    const box = $('.running-box');
    const r = S.me && runningEntry();
    box.classList.toggle('on', !!r);
    if (!r) { box.innerHTML = ''; return; }
    box.innerHTML = `<div style="display:flex;align-items:center;gap:8px"><span style="color:#f31260">●</span>
      <div style="flex:1;min-width:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">#${r.it.id} ${esc(r.it.title)}</div>
      <div style="color:#8b93a3;font-size:11px">desde ${timeStr(new Date(r.e.start))} · ${fmtH(entryHours(r.e))}</div></div>
      <button class="primary" data-act="stop" data-id="${r.it.id}" data-eid="${esc(r.e.id)}">■ Parar</button></div>`;
  }
  function visibleRange() {
    let a = prefs.dayStart, b = prefs.dayEnd;
    for (const s of weekSegments()) {
      a = Math.min(a, s.a.getHours());
      b = Math.max(b, s.b.getHours() + (s.b.getMinutes() > 0 ? 1 : 0) || 24);
    }
    return [Math.max(0, a), Math.min(24, Math.max(b, a + 1))];
  }
  function renderCalendar() {
    const [h0, h1] = visibleRange();
    const today = new Date();
    const segs = weekSegments();
    const perDay = Array.from({ length: 7 }, () => 0);
    for (const s of segs) perDay[s.day] += s.hours;
    let head = '<div></div>';
    for (let d = 0; d < 7; d++) {
      const day = addDays(S.weekStart, d);
      const pct = Math.min(100, (100 * perDay[d]) / prefs.dailyGoal);
      const hol = holidayOf(day), work = d < 5 && !hol;
      head += `<div class="dh${sameDay(day, today) ? ' today' : ''}${d >= 5 ? ' we' : ''}${hol ? ' isHol' : ''}" data-day="${d}">
        <div class="n">${DAY_NAMES[d]} ${pad(day.getDate())}/${pad(day.getMonth() + 1)}</div>
        <div class="tot"><span>${fmtH(perDay[d])}</span><span>${work && perDay[d] < prefs.dailyGoal ? `faltam ${fmtH(prefs.dailyGoal - perDay[d])}` : ''}</span></div>
        ${work ? `<div class="mini${perDay[d] < prefs.dailyGoal ? ' low' : ''}"><i style="width:${pct}%"></i></div>` : ''}
        ${hol ? `<span class="hol" title="Feriado: ${esc(hol.name)}${hol.source === 'clockin' ? ' (Clockin)' : hol.source === 'manual' ? ' (adicionado por você)' : ' (nacional)'}">Feriado: ${esc(hol.name)}</span>` : ''}</div>`;
    }
    $('.cal-head').innerHTML = head;

    const height = (h1 - h0) * PX_PER_HOUR;
    let gutter = `<div class="gutter" style="height:${height}px">`;
    for (let h = h0 + 1; h < h1; h++) gutter += `<span style="top:${(h - h0) * PX_PER_HOUR}px">${pad(h)}:00</span>`;
    gutter += '</div>';
    let cols = '';
    for (let d = 0; d < 7; d++) {
      const day = addDays(S.weekStart, d);
      let inner = '';
      for (let h = h0; h < h1; h++) {
        inner += `<div class="hl" style="top:${(h - h0) * PX_PER_HOUR}px"></div><div class="hl half" style="top:${(h - h0 + 0.5) * PX_PER_HOUR}px"></div>`;
      }
      if (sameDay(day, today)) {
        const mins = today.getHours() * 60 + today.getMinutes() - h0 * 60;
        if (mins >= 0 && mins <= (h1 - h0) * 60) inner += `<div class="now" style="top:${(mins * PX_PER_HOUR) / 60}px"></div>`;
      }
      for (const s of segs.filter((x) => x.day === d)) {
        const top = ((s.a.getHours() * 60 + s.a.getMinutes() - h0 * 60) * PX_PER_HOUR) / 60;
        const endMin = sameDay(s.a, s.b) ? s.b.getHours() * 60 + s.b.getMinutes() : 24 * 60;
        // Altura real do trecho (sessões curtas, como uma daily de 15 min, não invadem a próxima)
        const hgt = Math.max(6, ((endMin - (s.a.getHours() * 60 + s.a.getMinutes())) * PX_PER_HOUR) / 60 - 2);
        const realEnd = s.e.end ? timeStr(new Date(s.e.end)) : 'agora';
        inner += `<div class="blk${s.e.end ? '' : ' run'}${hgt < 16 ? ' tiny' : ''}" data-id="${s.it.id}" data-eid="${esc(s.e.id)}" style="top:${top}px;height:${hgt}px;background:${colorOf(s.it.id)}"
          title="#${s.it.id} ${esc(s.it.title)}\n${timeStr(new Date(s.e.start))}–${realEnd} (${fmtH(entryHours(s.e))})${s.e.notes ? '\n' + esc(s.e.notes) : ''}">
          <b>#${s.it.id} ${esc(s.it.title)}</b>${hgt > 26 ? `${timeStr(s.a)}–${s.e.end ? timeStr(s.b) : 'agora'} · ${fmtH(s.hours)}` : ''}</div>`;
      }
      cols += `<div class="col${d >= 5 ? ' we' : ''}${sameDay(day, today) ? ' today' : ''}${holidayOf(day) ? ' isHol' : ''}" data-day="${d}" style="height:${height}px">${inner}</div>`;
    }
    const grid = $('.grid');
    grid.dataset.h0 = h0; grid.dataset.h1 = h1;
    grid.innerHTML = gutter + cols;
  }


  // ───────── Estados: o que conta como "fechado" ─────────
  // Cada processo tem estados próprios (Completed, Accepted, Closed…). Em vez de adivinhar pelo nome, o app lê
  // a categoria de cada estado no Azure (Proposed / InProgress / Resolved / Completed / Removed) por tipo de item.
  // Por padrão conta como fechado quem está em "Resolved" ou "Completed"; dá para mudar em ⚙ Configurações.
  const SCAT = new Map(); // `${projeto}|${tipo}` -> Map(estado em minúsculas -> { name, category })
  const SCAT_PROJ = new Map(); // projeto -> Promise
  const CLOSED_FALLBACK = /^(Closed|Done|Resolved|Completed|Accepted)$/i;
  const CAT_LABEL = { Resolved: 'Resolvido', Completed: 'Concluído' };
  function ensureStateCats(projects) {
    return Promise.all([...new Set(projects.filter(Boolean))].map((p) => {
      if (!SCAT_PROJ.has(p)) {
        SCAT_PROJ.set(p, (async () => {
          try {
            const j = await api(`/${encodeURIComponent(p)}/_apis/wit/workitemtypes?api-version=7.1`);
            for (const t of j.value || []) {
              let states = t.states;
              if (!Array.isArray(states) || !states.length) {
                try { states = (await api(`/${encodeURIComponent(p)}/_apis/wit/workitemtypes/${encodeURIComponent(t.name)}/states?api-version=7.1`)).value || []; } catch { states = []; }
              }
              SCAT.set(`${p}|${t.name}`, new Map(states.map((x) => [String(x.name).toLowerCase(), { name: x.name, category: x.category }])));
            }
          } catch (e) { if (e.status === 401) throw e; SCAT_PROJ.delete(p); }
        })());
      }
      return SCAT_PROJ.get(p).catch(() => {});
    }));
  }
  function stateCat(project, type, state) {
    const k = String(state || '').toLowerCase();
    const m = SCAT.get(`${project || S.project}|${type || ''}`);
    if (m && m.has(k)) return m.get(k).category;
    for (const [key, mm] of SCAT) if (key.startsWith(`${project || S.project}|`) && mm.has(k)) return mm.get(k).category;
    return null;
  }
  function isClosedState(project, type, state) {
    const c = stateCat(project, type, state);
    return c ? prefs.closedCats.includes(c) : CLOSED_FALLBACK.test(state || '');
  }
  function isRemovedState(project, type, state) {
    const c = stateCat(project, type, state);
    return c ? c === 'Removed' : /^Removed$/i.test(state || '');
  }
  // Estados conhecidos por categoria, para mostrar ao usuário
  function statesByCat() {
    const by = { Resolved: new Set(), Completed: new Set() };
    for (const [key, m] of SCAT) if (key.startsWith(`${S.project}|`)) for (const x of m.values()) if (by[x.category]) by[x.category].add(x.name);
    return { Resolved: [...by.Resolved].sort(), Completed: [...by.Completed].sort() };
  }
  function closedNamesText() {
    const by = statesByCat();
    const names = prefs.closedCats.flatMap((c) => by[c] || []);
    return names.length ? [...new Set(names)].join(', ') : 'Resolved, Completed, Closed, Done, Accepted';
  }
  // Quando o card fechou: ClosedDate se o estado é "Completed"; senão a data em que entrou no estado atual.
  function closedAtOf(f, project) {
    const st = f['System.State'] || '', ty = f['System.WorkItemType'] || '';
    if (!isClosedState(project, ty, st)) return null;
    const d = (stateCat(project, ty, st) === 'Completed' && f['Microsoft.VSTS.Common.ClosedDate'])
      || f['Microsoft.VSTS.Common.StateChangeDate'] || f['Microsoft.VSTS.Common.ResolvedDate'] || f['Microsoft.VSTS.Common.ClosedDate'] || f['System.ChangedDate'];
    return d ? new Date(d) : null;
  }
  // Cards de rotina sem horas (Code Review, Integrated Test…) que você não aponta: escondidos da lista "sem horas"
  // Por que um card fechado sem horas está oculto: escolhido um a um, pelo título ou pelo tipo
  function hiddenRule(r) {
    if (r.myHours > 0) return null;
    if (prefs.hiddenIds.includes(r.id)) return { k: 'id' };
    const t = (r.title || '').toLowerCase();
    const title = prefs.hideTitles.find((x) => x && t.includes(x.toLowerCase()));
    if (title) return { k: 'title', v: title, text: `título contém "${title}"` };
    const type = prefs.hideTypes.find((x) => x && x.toLowerCase() === String(r.type || '').toLowerCase());
    if (type) return { k: 'type', v: type, text: `tipo ${type}` };
    return null;
  }
  function hiddenWhy(r) { const h = hiddenRule(r); return !h ? '' : h.k === 'id' ? 'id' : h.text; }

  // Menu do "Ocultar ▾" na lista de fechados sem horas: só este card, todos com o mesmo título ou do mesmo tipo
  function closeHideMenu() { document.querySelectorAll('.hmenu').forEach((e) => e.remove()); }
  function openHideMenu(btn, id) {
    closeHideMenu();
    const r = P.rows.find((x) => x.id === id); if (!r) return;
    const m = document.createElement('div');
    m.className = 'hmenu';
    const short = (t) => (t.length > 48 ? t.slice(0, 46) + '…' : t);
    m.innerHTML = `<button data-act="p-hide" data-id="${id}">Só este card (#${id})</button>
      <button data-act="p-hidetitle" data-v="${esc(r.title)}" title="Esconde os cards cujo título contém este texto">Todos com o título "${esc(short(r.title))}"</button>
      ${r.type ? `<button data-act="p-hidetype" data-v="${esc(r.type)}">Todos do tipo ${esc(r.type)}</button>` : ''}
      <div class="muted" style="font-size:11px;padding:4px 8px 2px">Só esconde cards sem horas suas. Dá para desfazer em ⚙ ou no "Mostrar".</div>`;
    document.body.appendChild(m);
    const b = btn.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = `${Math.max(8, Math.min(b.right - mw, window.innerWidth - mw - 8))}px`;
    m.style.top = `${b.bottom + mh + 4 > window.innerHeight ? b.top - mh - 4 : b.bottom + 4}px`;
    setTimeout(() => {
      const off = (e) => { if (!e.target.closest('.hmenu')) { closeHideMenu(); document.removeEventListener('pointerdown', off, true); } };
      document.addEventListener('pointerdown', off, true);
    }, 0);
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeHideMenu(); });
  document.addEventListener('scroll', closeHideMenu, true);

  // ───────── Produtividade: cards fechados com horas suas ─────────
  // Regra: conta o card se ele está num estado de fechado (ver "Estados" acima) e tem pelo menos uma sessão sua com horas.
  // O dia em que ele conta é o dia em que foi fechado.
  const PROD_FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.TeamProject', 'System.AssignedTo', 'System.ChangedDate',
    'Microsoft.VSTS.Common.ClosedDate', 'Microsoft.VSTS.Common.ClosedBy', 'Microsoft.VSTS.Common.StateChangeDate', 'Microsoft.VSTS.Common.ResolvedDate', 'Microsoft.VSTS.Common.ResolvedBy', F_WS];
  const OPTIONAL_FIELDS = ['Microsoft.VSTS.Common.ResolvedDate', 'Microsoft.VSTS.Common.ResolvedBy', 'Microsoft.VSTS.Common.StateChangeDate'];
  const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
  const dayKey = (d) => dateInput(d);
  const P = { month: monthStart(new Date()), rows: [], loadedKey: '', loading: false, selDay: null, error: '' };
  function weekdaysIn(a, b) { return workdaysIn(a, b); }
  const ymdW = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  async function getItemsWith(ids, fields) {
    return inChunks(ids, async (chunk) => {
      const url = (fs) => `/_apis/wit/workitems?ids=${chunk.join(',')}&fields=${fs.join(',')}&errorPolicy=Omit&api-version=7.1`;
      let j;
      try { j = await api(url(fields)); }
      catch (e) {
        // algum campo opcional não existe nesta organização: tenta de novo sem eles
        if (e.status !== 400 || !fields.some((x) => OPTIONAL_FIELDS.includes(x))) throw e;
        j = await api(url(fields.filter((x) => !OPTIONAL_FIELDS.includes(x))));
      }
      return (j.value || []).filter((w) => w && w.fields);
    });
  }
  function prodRange() {
    const m0 = P.month, m1 = new Date(m0.getFullYear(), m0.getMonth() + 1, 1);
    const w0 = startOfWeek(new Date()), w1 = addDays(w0, 7);
    return { from: m0 < w0 ? m0 : w0, to: m1 > w1 ? m1 : w1, m0, m1 };
  }
  async function loadProd(force, silent) {
    const { from, to } = prodRange();
    const key = `${from.toISOString()}|${to.toISOString()}`;
    if (!force && P.loadedKey === key) { renderProd(); return; }
    // já tem os dados deste período: mostra na hora e atualiza sem tela de carregando
    if (P.rows.length && P.dataKey === key) { silent = true; renderProd(); }
    if (!silent) { P.loading = true; P.error = ''; P.rows = []; renderProd(); }
    try {
      const a = ymdW(addDays(from, -1)), b = ymdW(addDays(to, 1));
      const q = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND (([Microsoft.VSTS.Common.ClosedDate] >= '${a}' AND [Microsoft.VSTS.Common.ClosedDate] < '${b}') OR ([Microsoft.VSTS.Common.StateChangeDate] >= '${a}' AND [Microsoft.VSTS.Common.StateChangeDate] < '${b}')) AND ([System.AssignedTo] = @Me OR [System.AssignedTo] EVER @Me OR [Microsoft.VSTS.Common.ClosedBy] = @Me)`;
      let ids = [];
      try { ids = await wiql(q, S.project, 2000); }
      catch (e) { if (e.status === 401) throw e; ids = await wiql(q.replace(' OR [System.AssignedTo] EVER @Me', ''), S.project, 2000); }
      // Também os itens onde você tem sessões (podem ter sido fechados por outra pessoa)
      const withMine = [...S.items.values()].filter((it) => it.entries.some(isMine)).map((it) => it.id);
      const all = await getItemsWith([...ids, ...withMine, ...(S.hubIds || [])], PROD_FIELDS);
      await ensureStateCats([S.project, ...all.map((w) => w.fields['System.TeamProject'])]);
      P.rows = all.map((w) => {
        const f = w.fields;
        const project = f['System.TeamProject'] || S.project;
        const entries = (parseEntries(f[F_WS]) || []).filter((e) => isMine(e) && e.start && e.end);
        const who = (x) => (x && (x.uniqueName || x.displayName) || '').toLowerCase();
        return {
          id: w.id, title: f['System.Title'] || `#${w.id}`, type: f['System.WorkItemType'] || '', state: f['System.State'] || '',
          project, closed: closedAtOf(f, project), entries,
          removed: isRemovedState(project, f['System.WorkItemType'], f['System.State']),
          myHours: entries.reduce((a, e) => a + entryHours(e), 0),
          // "esquecido" só se o card fechou atribuído a você (quem só passou pelo card ou fechou para outro não conta)
          mineToClose: who(f['System.AssignedTo']) === S.me.email,
        };
      });
      if (S.side !== 'recent') renderList();
      P.loadedKey = key; P.dataKey = key; P.at = Date.now();
    } catch (e) { P.error = e.message; }
    finally { P.loading = false; renderProd(); }
  }
  function prodStats(a, b) {
    const inP = (d) => d && d >= a && d < b;
    const counted = P.rows.filter((r) => inP(r.closed) && r.myHours > 0);
    // Horas suas no período: junta as sessões do calendário com as dos cards carregados aqui (sem contar duas vezes)
    const seen = new Map();
    for (const { it, e } of myEntries()) seen.set(`${it.id}:${e.id || e.start}`, e);
    for (const r of P.rows) for (const e of r.entries) seen.set(`${r.id}:${e.id || e.start}`, e);
    let hours = 0;
    for (const e of seen.values()) { const s = new Date(e.start); if (e.end && s >= a && s < b) hours += entryHours(e); }
    const noH = P.rows.filter((r) => inP(r.closed) && r.myHours === 0 && r.mineToClose);
    return { counted, hours, noHours: noH.filter((r) => !hiddenWhy(r)), hidden: noH.filter((r) => hiddenWhy(r)) };
  }
  function kpi(label, sub, st, goal) {
    const n = st.counted.length;
    const pct = goal ? Math.min(100, (100 * n) / goal) : 0;
    return `<div class="kpi"><div class="l">${esc(label)} <span class="muted">· ${esc(sub)}</span></div>
      <div class="v">${n}${goal ? ` <small>/ ${goal}</small>` : ''} <small>card${n === 1 ? '' : 's'}</small></div>
      <div class="h">${fmtH(st.hours)} apontadas${st.noHours.length ? ` · <span class="warn-h">${st.noHours.length} fechado(s) sem horas</span>` : ''}</div>
      ${goal ? `<div class="pbar${n < goal ? ' low' : ''}"><i style="width:${pct}%"></i></div>` : ''}</div>`;
  }
  function renderProd() {
    const el = $('.prod');
    if (S.view !== 'prod') return;
    const g = prefs.cardGoal || 0;
    const { m0, m1 } = prodRange();
    const monthName = m0.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    let html = `<div class="p-nav"><button class="icon" data-act="p-prev">‹</button><span class="mlabel">${esc(monthName[0].toUpperCase() + monthName.slice(1))}</span>
      <button class="icon" data-act="p-next">›</button><button data-act="p-today">Mês atual</button><span class="grow"></span>
      <span class="muted" title="Conta o card quando ele chega num destes estados e tem horas suas. Mude em ⚙ Configurações.">Fechado = ${esc(closedNamesText())}</span>
      <span class="muted">·</span><span class="muted">${g ? `Meta: ${g} card${g === 1 ? '' : 's'}/dia` : 'Sem meta de cards: defina em ⚙'}</span></div>`;
    if (P.loading && !P.rows.length) { el.innerHTML = html + '<div class="muted">Carregando seus cards…</div>'; return; }
    if (P.error) html += `<div class="p-sec" style="color:#fca5a5">Não consegui carregar: ${esc(P.error)}</div>`;
    const t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const w0 = startOfWeek(t0);
    const sToday = prodStats(t0, addDays(t0, 1)), sWeek = prodStats(w0, addDays(w0, 7)), sMonth = prodStats(m0, m1);
    const isCur = m0.getTime() === monthStart(t0).getTime();
    html += `<div class="kpis">
      ${kpi('Hoje', `${pad(t0.getDate())}/${pad(t0.getMonth() + 1)}`, sToday, g)}
      ${kpi('Semana', `${pad(w0.getDate())}/${pad(w0.getMonth() + 1)} – ${pad(addDays(w0, 6).getDate())}/${pad(addDays(w0, 6).getMonth() + 1)}`, sWeek, g * workdaysIn(w0, addDays(w0, 7)))}
      ${kpi(isCur ? 'Mês' : 'Mês selecionado', `${weekdaysIn(m0, m1)} dias úteis`, sMonth, g * weekdaysIn(m0, m1))}
    </div>`;
    // Gráfico do mês
    const days = []; for (let d = new Date(m0); d < m1; d = addDays(d, 1)) days.push(new Date(d));
    const per = days.map((d) => sMonth.counted.filter((r) => sameDay(r.closed, d)).length);
    const max = Math.max(g || 0, ...per, 1);
    html += `<div class="chart"><h3>Cards fechados com horas, por dia${P.selDay ? ' · clique de novo no dia para ver o mês todo' : ' · clique num dia para filtrar'}</h3><div class="bars">
      ${g ? `<div class="goal-line" style="bottom:${(100 * g) / max}%" title="Meta: ${g}/dia"></div>` : ''}
      ${days.map((d, i) => `<div class="b${d.getDay() % 6 === 0 ? ' we' : ''}${holidayOf(d) ? ' hol' : ''}${g && per[i] >= g ? ' met' : ''}${P.selDay === dayKey(d) ? ' sel' : ''}" data-act="p-day" data-day="${dayKey(d)}" title="${pad(d.getDate())}/${pad(d.getMonth() + 1)}: ${per[i]} card(s)${holidayOf(d) ? ` · Feriado: ${esc(holidayOf(d).name)}` : ''}">
        ${per[i] ? `<span>${per[i]}</span>` : ''}<i style="height:${(100 * per[i]) / max}%"></i></div>`).join('')}
      </div><div class="xlab">${days.map((d) => `<span class="${sameDay(d, t0) ? 'today' : holidayOf(d) ? 'hol' : ''}" title="${holidayOf(d) ? `Feriado: ${esc(holidayOf(d).name)}` : ''}">${d.getDate()}</span>`).join('')}</div></div>`;
    // Lista filtrada
    let a = m0, b = m1, label = 'no mês';
    if (P.selDay) { const [y, mo, dd] = P.selDay.split('-').map(Number); a = new Date(y, mo - 1, dd); b = addDays(a, 1); label = `em ${pad(dd)}/${pad(mo)}`; }
    const st = prodStats(a, b);
    const rows = st.counted.slice().sort((x, y) => y.closed - x.closed);
    const link = (r) => `<a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(r.project)}/_workitems/edit/${r.id}" target="_blank" rel="noopener">#${r.id}</a>`;
    const when = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)} ${timeStr(d)}`;
    html += `<div class="p-sec"><h3>✅ Cards contabilizados ${esc(label)} (${rows.length})</h3>${rows.length ? `<table class="t"><tr><th>Fechado em</th><th>Card</th><th>Título</th><th>Tipo</th><th style="text-align:right">Suas horas</th></tr>
      ${rows.map((r) => `<tr><td class="num" style="text-align:left">${when(r.closed)}</td><td>${link(r)}</td><td>${esc(r.title)}</td><td class="muted">${esc(r.type)}</td><td class="num">${fmtH(r.myHours)}</td></tr>`).join('')}</table>` : '<div class="muted">Nenhum card fechado com horas suas nesse período.</div>'}</div>`;
    if (st.noHours.length || st.hidden.length) {
      const shown = P.showHidden ? st.noHours.concat(st.hidden) : st.noHours;
      const why = [...new Set(st.hidden.map((r) => { const h = hiddenRule(r); return h.k === 'id' ? '' : h.k === 'type' ? `tipo ${h.v}` : h.v; }).filter(Boolean))];
      const nIds = st.hidden.filter((r) => hiddenRule(r).k === 'id').length;
      if (nIds) why.push(`${nIds} escolhido(s) por você`);
      const hidNote = st.hidden.length ? ` <span class="muted hid-note">· ${st.hidden.length} oculto${st.hidden.length === 1 ? '' : 's'} (${esc(why.join(', '))}) <button class="chip-btn" data-act="p-hid">${P.showHidden ? 'Esconder' : 'Mostrar'}</button></span>` : '';
      html += `<div class="p-sec"><h3 class="warn-h" title="Cards fechados que estão atribuídos a você (Assigned To) e não têm horas suas">⚠ Fechados ${esc(label)} no seu nome e sem horas suas (${st.noHours.length}): não contam até você apontar${hidNote}</h3>${shown.length ? `<table class="t"><tr><th>Fechado em</th><th>Card</th><th>Título</th><th>Tipo</th><th></th></tr>
        ${shown.sort((x, y) => y.closed - x.closed).map((r) => { const h = hiddenRule(r); return `<tr${h ? ' class="hidrow"' : ''}><td class="num" style="text-align:left">${when(r.closed)}</td><td>${link(r)}</td><td>${esc(r.title)}</td><td class="muted">${esc(r.type)}</td><td class="num" style="white-space:nowrap">${
          !h ? `<button class="chip-btn subtle" data-act="p-hidemenu" data-id="${r.id}" title="Esconder este card (ou todos do mesmo título ou tipo) desta lista">Ocultar ▾</button> `
          : h.k === 'id' ? `<button class="chip-btn" data-act="p-unhide" data-id="${r.id}" title="Voltar a mostrar este card">Reexibir</button> `
          : `<span class="muted" style="font-size:11.5px">oculto: ${esc(h.text)}</span> <button class="chip-btn" data-act="p-unhidepat" data-k="${h.k}" data-v="${esc(h.v)}" title="Voltar a mostrar todos os cards com ${h.k === 'type' ? 'este tipo' : 'este título'}">Reexibir</button> `}<button class="chip-btn" data-act="p-log" data-id="${r.id}">Apontar</button></td></tr>`; }).join('')}</table>` : '<div class="muted">Todos os fechados sem horas deste período estão ocultos.</div>'}</div>`;
    }
    const open = P.rows.filter((r) => !r.closed && r.myHours > 0 && !r.removed).sort((x, y) => y.myHours - x.myHours);
    if (open.length) {
      html += `<div class="p-sec"><h3>⏳ Com horas suas, ainda abertos (${open.length}): contam quando chegarem em ${esc(closedNamesText())}</h3><table class="t"><tr><th>Card</th><th>Título</th><th>Estado</th><th style="text-align:right">Suas horas</th></tr>
        ${open.map((r) => `<tr><td>${link(r)}</td><td>${esc(r.title)}</td><td class="muted">${esc(r.state)}</td><td class="num">${fmtH(r.myHours)}</td></tr>`).join('')}</table></div>`;
    }
    if (P.loading) html += '<div class="muted">Atualizando…</div>';
    el.innerHTML = html;
  }

  // ───────── Cronômetro ─────────
  // Cada cronômetro guarda trechos (início/fim). Ao apontar, cada trecho vira uma sessão no Work Session Hub.
  // "Pausar" estaciona o cronômetro num card lateral e libera o principal para outro work item.
  const T_KEY = 'apontadorHoras.timer.v1';
  const T = Object.assign({ itemId: null, notes: '', segs: [], parked: [] }, (() => { try { return JSON.parse(localStorage.getItem(T_KEY)) || {}; } catch { return {}; } })());
  if (!Array.isArray(T.parked)) T.parked = [];
  const tSave = () => { try { localStorage.setItem(T_KEY, JSON.stringify({ itemId: T.itemId, notes: T.notes, segs: T.segs, parked: T.parked })); } catch { /* ignore */ } };
  const isRun = (t) => t.segs.length > 0 && !t.segs[t.segs.length - 1].e;
  const msOf = (t) => t.segs.reduce((a, g) => a + ((g.e ? new Date(g.e) : new Date()) - new Date(g.s)), 0);
  const tRunning = () => isRun(T);
  const tMs = () => msOf(T);
  const tState = () => (tRunning() ? 'run' : T.segs.length ? 'pause' : 'idle');
  const hms = (ms) => { const t = Math.floor(ms / 1000); return `${pad(Math.floor(t / 3600))}:${pad(Math.floor((t % 3600) / 60))}:${pad(t % 60)}`; };
  const itemOf = (id) => id && (S.items.get(id) || R.rows.find((r) => r.id === id));
  // Trechos prontos para gravar: corta no minuto (como a extensão) e junta trechos que encostam
  function pendingOf(t, closeNow) {
    const segs = t.segs.map((g) => ({ s: new Date(g.s), e: g.e ? new Date(g.e) : (closeNow ? new Date() : null) })).filter((g) => g.e).sort((x, y) => x.s - y.s);
    const out = [];
    for (const g of segs) {
      const s0 = truncMin(g.s), e0 = truncMin(g.e);
      if (e0 <= s0) continue;
      const last = out[out.length - 1];
      if (last && s0 <= last.e) { if (e0 > last.e) last.e = e0; } else out.push({ s: s0, e: e0 });
    }
    return out;
  }
  const tPending = (closeNow) => pendingOf(T, closeNow);

  function tStart() {
    if (!T.itemId) { toast('Informe o work item antes de iniciar.', true); return; }
    if (tRunning()) return;
    adoptItem(T.itemId);
    T.segs.push({ s: new Date().toISOString(), e: null }); tSave(); renderTimer();
  }
  // Pausar = fecha o trecho atual e estaciona o cronômetro no painel de pausados
  function tPark(quiet) {
    if (!T.segs.length) return false;
    if (tRunning()) T.segs[T.segs.length - 1].e = new Date().toISOString();
    const same = T.parked.find((p) => p.itemId === T.itemId);
    if (same) { same.segs.push(...T.segs); same.notes = T.notes || same.notes; same.pausedAt = new Date().toISOString(); }
    else T.parked.unshift({ pid: `p${Date.now()}${Math.random().toString(36).slice(2, 6)}`, itemId: T.itemId, notes: T.notes, segs: T.segs, pausedAt: new Date().toISOString() });
    const id = T.itemId, ms = msOf(same || T.parked[0]);
    T.segs = []; T.notes = ''; T.itemId = null;
    tSave(); renderTimer();
    if (!quiet) toast(`#${id} pausado com ${hms(ms)}. O cronômetro está livre para outro card.`);
    return true;
  }
  function tResume(pid) {
    const i = T.parked.findIndex((p) => p.pid === pid);
    if (i < 0) return;
    const p = T.parked[i];
    if (T.segs.length) tPark(true); // troca: o card atual vai para os pausados
    const j = T.parked.findIndex((x) => x.pid === pid);
    T.parked.splice(j, 1);
    T.itemId = p.itemId; T.notes = p.notes || ''; T.segs = p.segs;
    adoptItem(T.itemId);
    T.segs.push({ s: new Date().toISOString(), e: null });
    tSave(); renderTimer();
    toast(`Retomado #${p.itemId} a partir de ${hms(msOf(T))}.`);
  }
  // Grava os trechos de um cronômetro no Azure. keepRunning: continua contando a partir de agora.
  async function logTimer(t, keepRunning) {
    if (!t.itemId) { toast('Informe o work item.', true); return false; }
    const wasRunning = isRun(t);
    const cut = new Date();
    if (wasRunning) t.segs[t.segs.length - 1].e = cut.toISOString();
    const items = pendingOf(t, false);
    if (!items.length) {
      toast('Menos de 1 minuto contado: nada para apontar ainda.', true);
      if (wasRunning) t.segs[t.segs.length - 1].e = null;
      tSave(); renderTimer(); return false;
    }
    const it = adoptItem(t.itemId) || await ensureItem(t.itemId);
    if (!it) { toast(`Item #${t.itemId} não encontrado.`, true); if (wasRunning) t.segs[t.segs.length - 1].e = null; return false; }
    let done = 0;
    const ok = await run(prefs.dryRun ? 'Validando…' : `Apontando ${items.length} trecho(s) em #${t.itemId}…`, async () => {
      for (const g of items) { await createSession({ itemId: t.itemId, start: g.s, end: g.e, notes: t.notes }); done++; }
    });
    const total = items.reduce((a, g) => a + (g.e - g.s), 0) / 36e5;
    if (ok && !prefs.dryRun) {
      t.segs = keepRunning && wasRunning ? [{ s: cut.toISOString(), e: null }] : [];
      P.loadedKey = '';
      toast(`${fmtH(total)} apontadas em #${t.itemId}${keepRunning && wasRunning ? ' · cronômetro continua' : ''}.`);
    } else if (ok) {
      if (wasRunning && keepRunning) t.segs[t.segs.length - 1].e = null;
      toast('Modo teste: o Azure aceitou, nada foi gravado.');
    } else {
      if (done) { const keepFrom = items[done].s; t.segs = t.segs.filter((g) => !g.e || new Date(g.e) > keepFrom).map((g) => (new Date(g.s) < keepFrom ? { ...g, s: keepFrom.toISOString() } : g)); }
      if (keepRunning && wasRunning) t.segs.push({ s: cut.toISOString(), e: null });
    }
    tSave(); renderTimer();
    return ok && !prefs.dryRun;
  }
  async function tLog(keepRunning) {
    const ok = await logTimer(T, keepRunning);
    if (ok && !keepRunning) { T.notes = ''; tSave(); renderTimer(); }
  }
  async function parkedLog(pid) {
    const p = T.parked.find((x) => x.pid === pid);
    if (!p) return;
    const ok = await logTimer(p, false);
    if (ok && !p.segs.length) { T.parked = T.parked.filter((x) => x.pid !== pid); tSave(); renderTimer(); }
  }
  function tDiscard() { T.segs = []; tSave(); renderTimer(); toast('Cronômetro zerado, nada foi apontado.'); }
  function parkedDiscard(pid) { T.parked = T.parked.filter((x) => x.pid !== pid); tSave(); renderTimer(); toast('Card pausado descartado, nada foi apontado.'); }
  function tSetItem(id) {
    if (T.segs.length && id !== T.itemId) { toast('Pause, aponte ou descarte o tempo atual antes de trocar o card.', true); return false; }
    T.itemId = id; tSave(); return true;
  }
  // ▶ das listas: leva o card para o cronômetro (pausando o que estiver rodando) e já inicia
  function timerFor(id) {
    adoptItem(id);
    setView('timer');
    if (T.itemId === id && T.segs.length) { if (!tRunning()) tStart(); return; }
    const parked = T.parked.find((p) => p.itemId === id);
    if (parked) { tResume(parked.pid); return; }
    if (T.segs.length) tPark(false);
    T.itemId = id; tSave(); tStart();
  }

  // Editar os trechos de um card pausado (ou do principal, se não estiver rodando)
  function openSegEditor(pid) {
    const t = pid === 'main' ? T : T.parked.find((x) => x.pid === pid);
    if (!t) return;
    if (isRun(t)) { toast('Pause antes de editar as horas.', true); return; }
    // Mostra os trechos já cortados no minuto e juntados (descarta pedaços de segundos)
    let rows = pendingOf(t, false).map((g) => ({ s: g.s, e: g.e }));
    const it = itemOf(t.itemId);
    const m = $('.modal');
    const draw = () => {
      m.innerHTML = `<h2>Editar horas · #${t.itemId}${it ? ` ${esc(it.title)}` : ''}</h2>
        <p style="font-size:12px">Cada linha é um trecho trabalhado. Ajuste os horários, remova ou adicione trechos.</p>
        <div class="segs-ed">${rows.map((r, i) => `<div class="row" data-i="${i}" style="align-items:flex-end">
          <label>Data<input type="date" class="e-d" value="${dateInput(r.s)}"></label>
          <label>Início<input type="time" class="e-s" value="${timeStr(r.s)}"></label>
          <label>Fim<input type="time" class="e-e" value="${timeStr(r.e)}"></label>
          <button class="danger e-del" title="Remover trecho" style="margin-bottom:1px">🗑</button></div>`).join('') || '<div class="muted">Nenhum trecho.</div>'}</div>
        <div><button class="e-add">＋ Adicionar trecho</button></div>
        <div class="e-tot muted" style="font-size:12px"></div>
        <label>Notas<input class="e-notes" maxlength="300" value="${esc(t.notes || '')}"></label>
        <div class="err"></div>
        <div class="foot"><span class="grow"></span><button class="e-cancel">Cancelar</button><button class="primary e-save">Salvar</button></div>`;
      const readRows = () => [...m.querySelectorAll('.segs-ed .row')].map((row) => {
        const d = row.querySelector('.e-d').value, a = row.querySelector('.e-s').value, b = row.querySelector('.e-e').value;
        if (!d || !a || !b) return null;
        const s = combine(d, a); let e = combine(d, b);
        if (e.getTime() === s.getTime()) return { s, e, zero: true };
        if (e < s) e = addDays(e, 1); // passou da meia-noite
        return { s, e };
      });
      const showTot = () => { const r = readRows(); m.querySelector('.e-tot').textContent = r.some((x) => !x) ? '' : `Total: ${fmtH(r.reduce((a, x) => a + (x.e - x.s), 0) / 36e5)}`; };
      showTot();
      m.oninput = showTot;
      m.querySelectorAll('.e-del').forEach((b) => b.addEventListener('click', () => { const keep = readRows(); keep.splice(Number(b.closest('.row').dataset.i), 1); rows = keep.filter(Boolean); draw(); }));
      m.querySelector('.e-add').addEventListener('click', () => {
        const cur = readRows().filter(Boolean);
        const last = cur.length ? cur[cur.length - 1].e : truncMin(new Date(Date.now() - 30 * 60e3));
        rows = [...cur, { s: last, e: new Date(last.getTime() + 30 * 60e3) }]; draw();
      });
      m.querySelector('.e-cancel').addEventListener('click', closeModal);
      m.querySelector('.e-save').addEventListener('click', () => {
        const r = readRows();
        if (r.some((x) => !x)) { m.querySelector('.err').textContent = 'Preencha data, início e fim de todos os trechos.'; return; }
        if (r.some((x) => x.zero)) { m.querySelector('.err').textContent = 'Há trecho com início igual ao fim. Ajuste ou remova.'; return; }
        r.sort((x, y) => x.s - y.s);
        for (let i = 1; i < r.length; i++) if (r[i].s < r[i - 1].e) { m.querySelector('.err').textContent = `Os trechos ${timeStr(r[i - 1].s)}–${timeStr(r[i - 1].e)} e ${timeStr(r[i].s)}–${timeStr(r[i].e)} se sobrepõem.`; return; }
        if (r.some((x) => (x.e - x.s) / 36e5 > 12)) { m.querySelector('.err').textContent = 'Algum trecho tem mais de 12h. Confira.'; return; }
        if (r.some((x) => x.e > new Date())) { m.querySelector('.err').textContent = 'Há trecho terminando no futuro.'; return; }
        t.segs = r.map((x) => ({ s: x.s.toISOString(), e: x.e.toISOString() }));
        t.notes = m.querySelector('.e-notes').value.trim();
        if (t !== T && !t.segs.length) T.parked = T.parked.filter((x) => x !== t);
        tSave(); closeModal(); renderTimer(); toast('Horas ajustadas.');
      });
    };
    draw();
    $('.modal-bg').classList.add('on');
  }

  function renderTimerBadge() {
    const dot = document.querySelector('.tdot');
    if (!dot) return;
    const st = tState();
    dot.classList.toggle('on', st !== 'idle' || T.parked.length > 0);
    dot.classList.toggle('paused', st !== 'run');
    dot.title = `${st === 'run' ? 'Rodando' : st === 'pause' ? 'Parado com tempo' : ''}${T.parked.length ? ` · ${T.parked.length} pausado(s)` : ''}`;
  }
  function renderTimer() {
    renderTimerBadge();
    const el = $('.timerv');
    if (S.view !== 'timer') return;
    const st = tState();
    const it = itemOf(T.itemId);
    const label = it ? `${it.id} — ${it.title}` : (T.itemId ? String(T.itemId) : '');
    const opts = [...S.items.values()].sort((a, b) => b.id - a.id).map((x) => `<option value="${esc(`${x.id} — ${x.title}`)}"></option>`).join('');
    const pend = tPending(st === 'run');
    const todayMine = it ? (S.items.get(it.id)?.entries || []).filter((e) => isMine(e) && e.end && sameDay(new Date(e.start), new Date())).reduce((a, e) => a + entryHours(e), 0) : 0;
    const lock = T.segs.length > 0;
    const parked = T.parked.map((p) => {
      const pi = itemOf(p.itemId);
      const pp = pendingOf(p, false);
      return `<div class="pk" data-pid="${p.pid}">
        <div class="pk-h"><span class="sw" style="background:${colorOf(p.itemId)}"></span><b>#${p.itemId}</b> <span class="pk-t">${esc(pi ? pi.title : '')}</span></div>
        <div class="pk-c">${hms(msOf(p))}</div>
        <div class="muted" style="font-size:11.5px">pausado às ${timeStr(new Date(p.pausedAt))} · ${pp.length} trecho(s)${p.notes ? ` · ${esc(p.notes)}` : ''}</div>
        <div class="pk-b">
          <button class="go" data-act="pk-resume" data-pid="${p.pid}">▶ Retomar</button>
          <button data-act="pk-edit" data-pid="${p.pid}">✎ Editar</button>
          <button class="ap" data-act="pk-log" data-pid="${p.pid}">⤴ Apontar</button>
          <button data-act="pk-discard" data-pid="${p.pid}" title="Descartar sem apontar">✕</button>
        </div></div>`;
    }).join('');
    el.innerHTML = `<div class="tlay"><div class="tw">
      <div class="tcard">
        <label>Work item${lock ? ' <span class="muted">(pause, aponte ou descarte para trocar)</span>' : ''}
          <input class="t-item" list="t-items" autocomplete="off" placeholder="Digite o número, ex.: 787869" value="${esc(label)}" ${lock ? 'disabled' : ''}></label>
        <datalist id="t-items">${opts}</datalist>
        <div class="t-info" style="font-size:12px;margin-top:4px;color:#8b93a3">${it ? `✓ ${esc(it.title)} · ${esc(it.type)} · ${esc(it.state)}${todayMine ? ` · você já apontou ${fmtH(todayMine)} hoje neste card` : ''}` : ''}</div>
        <label style="margin-top:10px">Notas (opcional)<input class="t-notes" maxlength="300" placeholder="O que você está fazendo" value="${esc(T.notes)}"></label>
      </div>
      <div class="tcard">
        <div class="clock ${st === 'run' ? 'run' : st === 'pause' ? 'pause' : ''}">${hms(tMs())}</div>
        <div class="tstate">${st === 'run' ? `Rodando desde ${timeStr(new Date(T.segs[T.segs.length - 1].s))}` : st === 'pause' ? 'Parado com tempo não apontado' : 'Parado'}${pend.length ? ` · ${pend.length} trecho(s) a apontar` : ''}${prefs.dryRun ? ' · <span style="color:#fde68a">modo teste</span>' : ''}</div>
        <div class="tbtns">
          ${st === 'run' ? '<button class="pz" data-act="t-pause" title="Guarda este card nos pausados e libera o cronômetro">⏸ Pausar</button>' : `<button class="go" data-act="t-start" ${T.itemId ? '' : 'disabled'}>▶ ${st === 'pause' ? 'Retomar' : 'Iniciar'}</button>`}
          <button class="ap" data-act="t-log" ${st === 'idle' ? 'disabled' : ''} title="Grava o tempo até agora e continua contando">⤴ Apontar</button>
          <button class="st" data-act="t-stop" ${st === 'idle' ? 'disabled' : ''} title="Para e grava tudo no Work Session Hub">■ Parar/Apontar</button>
          <button data-act="t-discard" ${st === 'idle' ? 'disabled' : ''} title="Zera sem apontar">✕ Descartar</button>
        </div>
        ${st === 'pause' ? '<div style="text-align:center;margin-top:8px"><button class="tlink" data-act="t-edit">✎ Editar horas</button> · <button class="tlink" data-act="t-pause">mandar para os pausados</button></div>' : ''}
      </div>
      ${pend.length ? `<div class="tcard"><h3 style="margin:0 0 6px;font-size:13px">Trechos que serão apontados</h3>
        ${pend.map((g, i) => `<div class="seg"><span>${pad(g.s.getDate())}/${pad(g.s.getMonth() + 1)} · ${timeStr(g.s)} – ${timeStr(g.e)}${st === 'run' && i === pend.length - 1 ? ' <span class="muted">(até agora)</span>' : ''}</span><span>${fmtH((g.e - g.s) / 36e5)}</span></div>`).join('')}
        <div class="muted" style="font-size:11.5px;margin-top:6px">Os horários são cortados no minuto, como no Work Session Hub. Cada trecho vira uma sessão.</div></div>` : ''}
    </div>
    <div class="parked"><h3>⏸ Pausados${T.parked.length ? ` (${T.parked.length})` : ''}</h3>
      ${parked || '<div class="muted" style="font-size:12px">Ao clicar em Pausar, o card vem para cá com o tempo guardado. Você pode iniciar outro card e voltar depois.</div>'}
    </div></div>`;
    const inp = el.querySelector('.t-item');
    let seq = 0, tmr = null;
    inp.addEventListener('input', () => {
      const id = parseItemId(inp.value); const info = el.querySelector('.t-info');
      clearTimeout(tmr);
      if (!id) { T.itemId = null; tSave(); info.textContent = ''; el.querySelector('[data-act="t-start"]')?.setAttribute('disabled', ''); return; }
      const known = itemOf(id);
      if (known) { tSetItem(id); info.textContent = `✓ ${known.title} · ${known.type} · ${known.state}`; el.querySelector('[data-act="t-start"]')?.removeAttribute('disabled'); return; }
      info.textContent = `Procurando #${id}…`; const my = ++seq;
      tmr = setTimeout(async () => {
        try {
          const x = await ensureItem(id); if (my !== seq) return;
          if (x) { tSetItem(id); info.textContent = `✓ ${x.title} · ${x.type} · ${x.state}`; el.querySelector('[data-act="t-start"]')?.removeAttribute('disabled'); }
          else info.textContent = `Item #${id} não encontrado no Azure.`;
        } catch (e) { info.textContent = e.message; }
      }, 400);
    });
    el.querySelector('.t-notes').addEventListener('input', (e) => { T.notes = e.target.value; tSave(); });
  }
  // Atualiza o relógio a cada segundo (só o número, sem redesenhar a tela)
  setInterval(() => {
    renderTimerBadge();
    if (tState() === 'idle') { if (/^[⏱⏸]/.test(document.title)) document.title = 'Apontador de Horas'; return; }
    const c = document.querySelector('.timerv.on .clock');
    if (c) c.textContent = hms(tMs());
    document.title = `${tState() === 'run' ? '⏱' : '⏸'} ${hms(tMs())} · #${T.itemId} · Apontador`;
  }, 1000);


  // ───────── Aba Cards ─────────
  const CARD_FIELDS = ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.Parent', 'System.TeamProject', 'System.AssignedTo',
    'System.CreatedDate', 'System.CreatedBy', 'System.ChangedDate', 'Microsoft.VSTS.Common.ClosedDate', 'Microsoft.VSTS.Common.StateChangeDate', 'Microsoft.VSTS.Common.ResolvedDate', 'System.AreaPath', 'System.IterationPath', F_WS];
  const C = { month: monthStart(new Date()), rows: [], raw: new Map(), parents: new Map(), loading: false, error: '', key: '', state: null, q: '', show: 'active', group: true };
  const isDone = (st, type, project) => isClosedState(project, type, st) || isRemovedState(project, type, st);
  const stClass = (st) => (isDone(st) ? 'done' : /^(New|To Do|Proposed)$/i.test(st || '') ? 'new' : 'act');
  const who = (x) => (x && (x.uniqueName || x.displayName) || '').toLowerCase();
  async function loadCards(force, silent) {
    const key = `${C.month.getFullYear()}-${C.month.getMonth()}|${S.project}`;
    if (!force && C.key === key && C.rows.length) { renderCards(); return; }
    if (C.rows.length && C.dataKey === key) { silent = true; renderCards(); }
    if (!silent) { C.loading = true; C.error = ''; renderCards(); }
    try {
      const base = `SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.ChangedDate] >= @Today - 120`;
      let ids = [];
      try { ids = await wiql(`${base} AND ([System.AssignedTo] = @Me OR [System.AssignedTo] EVER @Me OR [System.CreatedBy] = @Me) ORDER BY [System.ChangedDate] DESC`, S.project, 600); }
      catch (e) { if (e.status === 401) throw e; ids = await wiql(`${base} AND ([System.AssignedTo] = @Me OR [System.CreatedBy] = @Me) ORDER BY [System.ChangedDate] DESC`, S.project, 600); }
      const withMine = [...S.items.values()].filter((it) => it.entries.some(isMine)).map((it) => it.id);
      const all = await getItemsWith([...ids, ...withMine, ...(S.hubIds || [])], CARD_FIELDS);
      await ensureStateCats([S.project, ...all.map((w) => w.fields['System.TeamProject'])]);
      C.raw = new Map(all.map((w) => [w.id, w]));
      C.rows = all.map((w) => {
        const f = w.fields;
        const entries = (parseEntries(f[F_WS]) || []).filter((e) => isMine(e) && e.start && e.end);
        return {
          id: w.id, title: f['System.Title'] || `#${w.id}`, type: f['System.WorkItemType'] || '', state: f['System.State'] || '',
          parent: f['System.Parent'] || null, project: f['System.TeamProject'] || S.project,
          assignedMe: who(f['System.AssignedTo']) === S.me.email, createdMe: who(f['System.CreatedBy']) === S.me.email,
          created: f['System.CreatedDate'] ? new Date(f['System.CreatedDate']) : null,
          changed: f['System.ChangedDate'] ? new Date(f['System.ChangedDate']) : null,
          closed: closedAtOf(f, f['System.TeamProject'] || S.project),
          entries, myHours: entries.reduce((a, e) => a + entryHours(e), 0),
        };
      });
      const pids = [...new Set(C.rows.map((r) => r.parent).filter((p) => p && !C.raw.has(p)))];
      const ps = pids.length ? await getItemsWith(pids, ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.TeamProject']) : [];
      C.parents = new Map(ps.map((w) => [w.id, { id: w.id, title: w.fields['System.Title'], type: w.fields['System.WorkItemType'], state: w.fields['System.State'], project: w.fields['System.TeamProject'] }]));
