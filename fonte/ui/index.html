        <div class="k-info" style="font-size:12px;color:#8b93a3;margin-top:-4px">${parent ? `✓ ${esc(parent.type)} · ${esc(parent.state)} · ${esc(parent.area)} · ${esc(parent.iteration)}${children.length ? ` · já tem ${children.length} filho(s)` : ''}` : ''}</div>
        ${kidsHtml()}
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span style="font-size:12px;color:#9aa3b2">Formato do título</span>
          <span class="seg3 k-fmt"><button data-f="num" class="${fmt === 'num' ? 'on' : ''}">Número da US</button><button data-f="tit" class="${fmt === 'tit' ? 'on' : ''}">Título da US</button><button data-f="both" class="${fmt === 'both' ? 'on' : ''}">Número + título</button></span>
        </div>
        <div class="tpls" style="display:flex;flex-direction:column;gap:6px">
          ${all.map((r, i) => `<div class="tpl${r.on ? '' : ' off'}" data-i="${i}">
            <label class="sw2"><input type="checkbox" class="k-on" ${r.on ? 'checked' : ''}> ${esc(r.label)}</label>
            <input class="tt k-title" value="${esc(r.title)}" placeholder="Título do card">
            ${(() => { const d = parent && dupOf(r); if (!d) return ''; return d.how === 'igual'
              ? `<a class="badge2${d.c.mine ? ' mine' : ''}" href="${kidLink(d.c)}" target="_blank" rel="noopener" title="Já existe um filho com este título: #${d.c.id} ${esc(d.c.title)} (${d.c.mine ? 'seu' : esc(d.c.who || 'sem responsável')})">já existe #${d.c.id}${d.c.mine ? ' · seu' : ''}</a>`
              : `<a class="badge2 mine" href="${kidLink(d.c)}" target="_blank" rel="noopener" title="Você já tem um card deste tipo nesta US: #${d.c.id} ${esc(d.c.title)} (${esc(d.c.state)})">você já tem #${d.c.id}</a>`; })()}
            ${r.key ? `<button class="ibtn k-star" title="Usar este título como padrão para os próximos">⭐</button>` : '<button class="ibtn k-del" title="Remover">🗑</button>'}
          </div>`).join('')}
        </div>
        <div><button class="k-add">＋ Card personalizado</button> <span class="muted" style="font-size:11.5px">Use {id} e {titulo} no título para preencher com os dados da US.</span></div>
        <div class="row" style="align-items:center">
          <label style="flex:none">Tipo<select class="k-type">${['Issue', 'Task', 'Bug'].map((t) => `<option${(prefs.cardType || 'Issue') === t ? ' selected' : ''}>${t}</option>`).join('')}</select></label>
          <label class="chk" style="margin-top:16px"><input type="checkbox" class="k-me" ${prefs.cardAssignMe === false ? '' : 'checked'}> Atribuir a mim</label>
          <span class="grow"></span>
          <span style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;color:#9aa3b2">Estado ao criar</span>
            <span class="seg3 k-state"><button data-s="New" class="${(prefs.cardState || 'New') === 'New' ? 'on' : ''}">New</button><button data-s="Active" class="${prefs.cardState === 'Active' ? 'on' : ''}">Active</button></span></span>
        </div>
        ${created.length ? `<div class="p-sec" style="margin:0"><h3>Criados</h3><ul class="created" style="margin:0;padding-left:18px">${created.map((c) => `<li>${c.error ? `<span style="color:#fca5a5">✗ ${esc(c.title)}: ${esc(c.error)}</span>` : `✓ <a href="https://dev.azure.com/${encodeURIComponent(S.org)}/${encodeURIComponent(parent.project)}/_workitems/edit/${c.id}" target="_blank" rel="noopener">#${c.id}</a> ${esc(c.title)}${c.state ? ` <span class="stp ${stClass(c.state)}">${esc(c.state)}</span>` : ''}${c.warn ? ` <span style="color:#fde68a;font-size:11.5px">⚠ ${esc(c.warn)}</span>` : ''} <button class="ibtn" data-act="timer" data-id="${c.id}" title="Iniciar no cronômetro">▶</button>`}</li>`).join('')}</ul></div>` : ''}
        <div class="err"></div>
        <div class="foot"><span class="grow"></span><button class="k-cancel">${created.length ? 'Fechar' : 'Cancelar'}</button>
          <button class="primary k-go" ${parent && sel.length ? '' : 'disabled'}>${prefs.dryRun ? 'Validar' : 'Criar'} ${sel.length} card(s)</button></div>`;
      bind();
    };
    let lookTimer = null, seq = 0;
    const lookup = async (val) => {
      const id = parseItemId(val);
      if (!id) { parent = null; children = []; draw(); return; }
      const my = ++seq;
      m.querySelector('.k-info').textContent = `Procurando #${id}…`;
      try {
        const [w] = await getItemsWith([id], ['System.Id', 'System.Title', 'System.WorkItemType', 'System.State', 'System.TeamProject', 'System.AreaPath', 'System.IterationPath']);
        if (my !== seq) return;
        if (!w) { parent = null; m.querySelector('.k-info').textContent = `#${id} não encontrado no Azure.`; m.querySelector('.k-info').style.color = '#fca5a5'; return; }
        const f = w.fields;
        parent = { id: w.id, title: f['System.Title'], type: f['System.WorkItemType'], state: f['System.State'], project: f['System.TeamProject'], area: f['System.AreaPath'], iteration: f['System.IterationPath'] };
        const kids = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.Parent] = ${w.id}`, parent.project, 200).catch(() => []);
        const whoOf = (x) => (x && (x.uniqueName || '')).toLowerCase();
        children = kids.length ? (await getItemsWith(kids, ['System.Id', 'System.Title', 'System.State', 'System.WorkItemType', 'System.AssignedTo', 'System.TeamProject'])).map((x) => {
          const f = x.fields, a = f['System.AssignedTo'];
          return { id: x.id, title: f['System.Title'], state: f['System.State'] || '', type: f['System.WorkItemType'] || '', who: a ? a.displayName || a.uniqueName : '',
            mine: whoOf(a) === S.me.email, removed: isRemovedState(f['System.TeamProject'] || parent.project, f['System.WorkItemType'], f['System.State']) };
        }) : [];
        // já desmarca o que repetiria um card existente (o usuário pode marcar de novo)
        refreshTitles();
        for (const r of [...rows, ...extra]) if (dupOf(r)) r.on = false;
        draw();
        const inp = m.querySelector('.k-parent'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
      } catch (e) { if (my === seq) { m.querySelector('.k-info').textContent = e.message; m.querySelector('.k-info').style.color = '#fca5a5'; } }
    };
    const bind = () => {
      const all = [...rows, ...extra];
      const pin = m.querySelector('.k-parent');
      pin.addEventListener('input', () => { clearTimeout(lookTimer); lookTimer = setTimeout(() => lookup(pin.value), 450); });
      pin.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(lookTimer); lookup(pin.value); } });
      m.querySelectorAll('.k-fmt button').forEach((b) => b.addEventListener('click', () => { fmt = b.dataset.f; prefs.cardFmt = fmt; savePrefs(); for (const r of rows) r.edited = false; draw(); }));
      m.querySelectorAll('.tpl').forEach((row) => {
        const r = all[Number(row.dataset.i)];
        row.querySelector('.k-on').addEventListener('change', (e) => { r.on = e.target.checked; draw(); });
        row.querySelector('.k-title').addEventListener('input', (e) => { r.title = e.target.value; r.edited = true; const go = m.querySelector('.k-go'); const n = [...rows, ...extra].filter((x) => x.on && x.title.trim()).length; go.textContent = `${prefs.dryRun ? 'Validar' : 'Criar'} ${n} card(s)`; go.disabled = !parent || !n; });
        row.querySelector('.k-star')?.addEventListener('click', () => {
          // guarda o título como padrão, trocando o número/título da US por {id}/{titulo}
          let pat = r.title;
          if (parent) { pat = pat.split(String(parent.title)).join('{titulo}').split(String(parent.id)).join('{id}'); }
          prefs.cardTpl = prefs.cardTpl || {};
          prefs.cardTpl[r.key] = { ...(prefs.cardTpl[r.key] || {}), [fmt === 'tit' ? 'tit' : 'num']: fmt === 'both' ? pat.replace(/ - \{titulo\}$/, '') : pat };
          savePrefs(); toast(`Padrão de "${r.label.replace(/^\S+\s/, '')}" salvo: ${pat}`);
        });
        row.querySelector('.k-del')?.addEventListener('click', () => { extra = extra.filter((x) => x !== r); draw(); });
      });
      m.querySelector('.k-add').addEventListener('click', () => { extra.push({ label: '✏ Personalizado', title: parent ? `${parent.id} - ` : '', on: true, edited: true }); draw(); setTimeout(() => { const ins = m.querySelectorAll('.k-title'); ins[ins.length - 1]?.focus(); }, 0); });
      m.querySelector('.k-type').addEventListener('change', (e) => { prefs.cardType = e.target.value; savePrefs(); });
      m.querySelector('.k-me').addEventListener('change', (e) => { prefs.cardAssignMe = e.target.checked; savePrefs(); });
      m.querySelectorAll('.k-state button').forEach((b) => b.addEventListener('click', () => {
        prefs.cardState = b.dataset.s; savePrefs();
        m.querySelectorAll('.k-state button').forEach((x) => x.classList.toggle('on', x === b));
      }));
      m.querySelector('.k-cancel').addEventListener('click', closeModal);
      m.querySelector('.k-go').addEventListener('click', createAll);
    };
    const createAll = async () => {
      const sel = [...rows, ...extra].filter((r) => r.on && r.title.trim());
      if (!parent || !sel.length) return;
      const type = m.querySelector('.k-type').value, me = m.querySelector('.k-me').checked;
      const wantState = prefs.cardState === 'Active' ? 'Active' : null;
      let stateInCreate = !!wantState; // tenta criar já no estado; se o Azure não aceitar, cria e muda logo depois
      const go = m.querySelector('.k-go'); go.disabled = true;
      const errEl = m.querySelector('.err');
      const body = (title) => JSON.stringify([
        { op: 'add', path: '/fields/System.Title', value: title.trim() },
        ...(stateInCreate ? [{ op: 'add', path: '/fields/System.State', value: wantState }] : []),
        { op: 'add', path: '/fields/System.AreaPath', value: parent.area },
        { op: 'add', path: '/fields/System.IterationPath', value: parent.iteration },
        ...(me ? [{ op: 'add', path: '/fields/System.AssignedTo', value: S.me.email }] : []),
        { op: 'add', path: '/relations/-', value: { rel: 'System.LinkTypes.Hierarchy-Reverse', url: `https://dev.azure.com/${S.org}/_apis/wit/workItems/${parent.id}` } },
      ]);
      const url = (validate) => `/${encodeURIComponent(parent.project)}/_apis/wit/workitems/$${encodeURIComponent(type)}?api-version=7.1${validate ? '&validateOnly=true' : ''}`;
      // 1) valida o primeiro antes de criar qualquer um (mostra campo obrigatório faltando, permissão etc.)
      errEl.textContent = 'Validando com o Azure…';
      try { await api(url(true), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(sel[0].title) }); }
      catch (e) {
        if (!stateInCreate) { errEl.textContent = `O Azure recusou: ${e.message}`; go.disabled = false; return; }
        // o processo não deixa nascer como Active: valida sem o estado e muda depois de criar
        stateInCreate = false;
        try { await api(url(true), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(sel[0].title) }); }
        catch (e2) { errEl.textContent = `O Azure recusou: ${e2.message}`; go.disabled = false; return; }
      }
      if (prefs.dryRun) { errEl.textContent = 'Modo teste: o Azure aceitaria criar estes cards. Nada foi criado.'; go.disabled = false; return; }
      created = [];
      for (const r of sel) {
        errEl.textContent = `Criando "${r.title}"…`;
        try {
          let w = await api(url(false), { method: 'POST', headers: { 'Content-Type': 'application/json-patch+json' }, body: body(r.title) });
          let warn = '';
          if (wantState && w.fields && w.fields['System.State'] !== wantState) {
            try {
              w = await api(`/_apis/wit/workitems/${w.id}?api-version=7.1`, { method: 'PATCH', headers: { 'Content-Type': 'application/json-patch+json' }, body: JSON.stringify([{ op: 'add', path: '/fields/System.State', value: wantState }]) });
            } catch (e) { warn = `criado como ${w.fields['System.State']}; não consegui mudar para ${wantState}: ${e.message}`; }
          }
          created.push({ id: w.id, title: r.title, state: w.fields ? w.fields['System.State'] : '', warn });
          if (w.fields) S.items.set(w.id, toItem(w));
          r.on = false;
        } catch (e) { created.push({ title: r.title, error: e.message }); }
      }
      const ok = created.filter((c) => !c.error).length;
      if (ok) { toast(`${ok} card(s) criado(s) em #${parent.id}.`); C.key = ''; R.key = ''; children.push(...created.filter((c) => !c.error).map((c) => ({ ...c, type, mine: me, who: me ? S.me.name : '' }))); }
      draw();
      if (S.view === 'cards') loadCards(true);
    };
    $('.modal-bg').classList.add('on');
    draw();
    if (parentId) lookup(String(parentId)); else setTimeout(() => m.querySelector('.k-parent')?.focus(), 0);
  }

  function setView(v) {
    S.view = v;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.act === `view-${v}`));
    $('.body').classList.toggle('off', v !== 'cal');
    $('.prod').classList.toggle('on', v === 'prod');
    $('.timerv').classList.toggle('on', v === 'timer');
    $('.cardsv').classList.toggle('on', v === 'cards');
    $('.st-left').textContent = v === 'prod'
      ? 'Conta como feito: card fechado e com horas suas apontadas. O dia é o dia do fechamento.'
      : v === 'timer' ? 'Apontar grava o tempo até agora e continua contando · Parar/Apontar grava tudo e zera. O cronômetro continua salvo se você fechar o app.'
      : v === 'cards' ? 'Seus cards: atribuídos a você, criados por você ou com horas suas · clique 2x num card para apontar'
      : 'Arraste no calendário para criar uma sessão · clique numa sessão para editar';
    if (v === 'prod') loadProd(!(P.rows.length && P.at && Date.now() - P.at < 20e3));
    if (v === 'timer') renderTimer();
    if (v === 'cards') loadCards(false);
  }

  // ───────── Interações ─────────
  function scrollToNow() {
    const h0 = Number($('.grid').dataset.h0 || 0);
    $('.scroller').scrollTop = Math.max(0, (new Date().getHours() - h0 - 3) * PX_PER_HOUR);
  }
  async function reload(toNow) {
    const ok = await run('Carregando suas sessões…', loadAll);
    if (ok) { lastSync = Date.now(); syncLabel(`✓ atualizado às ${timeStr(new Date())}`); }
    if (ok && toNow) scrollToNow();
  }

  $('.q').addEventListener('input', (ev) => { S.filter = ev.target.value; renderList(); });
  $('.q').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { if (S.side === 'recent') loadRecent(true); else searchAzure(); } });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && $('.modal-bg').classList.contains('on') && S.me) closeModal(); });

  async function searchAzure() {
    const q = S.filter.trim().replace(/^#/, '');
    if (!q) return;
    await run('Buscando no Azure…', async () => {
      let ids;
      if (/^\d+$/.test(q)) ids = [Number(q)];
      else ids = await wiql(`SELECT [System.Id] FROM WorkItems WHERE [System.TeamProject] = @project AND [System.Title] CONTAINS '${q.replace(/'/g, "''")}' ORDER BY [System.ChangedDate] DESC`, S.project, 30);
      const found = await getItems(ids);
      if (!found.length) throw new Error('Nenhum item encontrado.');
      for (const w of found) {
        S.items.set(w.id, toItem(w));
        if (!prefs.pinned.includes(w.id)) prefs.pinned.push(w.id);
      }
      savePrefs();
      if (found.length === 1) S.selectedId = found[0].id;
      toast(`${found.length} item(ns) adicionado(s) aos fixados.`);
    });
  }

  document.addEventListener('click', async (ev) => {
    const btn = ev.target.closest('[data-act]');
    const itemEl = ev.target.closest('.item');
    const blk = ev.target.closest('.blk');
    if (btn) {
      const act = btn.dataset.act, id = Number(btn.dataset.id);
      ev.stopPropagation();
      if (!S.me && act !== 'settings') return;
      if (act === 'prev') { S.weekStart = addDays(S.weekStart, -7); render(); }
      else if (act === 'next') { S.weekStart = addDays(S.weekStart, 7); render(); }
      else if (act === 'today') { S.weekStart = startOfWeek(new Date()); render(); }
      else if (act === 'reload') { await reload(false); if (S.view === 'prod') loadProd(true); if (S.side === 'recent') loadRecent(true); }
      else if (act === 'settings') openSettings();
      else if (act === 'side-mine' || act === 'side-recent') setSide(act === 'side-mine' ? 'mine' : 'recent');
      else if (act === 'r-days') { R.days = Number(btn.dataset.days); document.querySelectorAll('.range button').forEach((b) => b.classList.toggle('on', b === btn)); loadRecent(true); }
      else if (act === 'view-cal' || act === 'view-prod' || act === 'view-timer' || act === 'view-cards') setView(act.slice(5));
      else if (act === 'c-prev' || act === 'c-next') { C.month = new Date(C.month.getFullYear(), C.month.getMonth() + (act === 'c-prev' ? -1 : 1), 1); renderCards(); }
      else if (act === 'c-today') { C.month = monthStart(new Date()); renderCards(); }
      else if (act === 'c-reload') loadCards(true);
      else if (act === 'c-edit') { C.editingId = id; C.redraw = true; renderCards(); }
      else if (act === 'c-del') openDeleteCard(id);
      else if (act === 'c-state') { C.state = btn.dataset.st || null; renderCards(); }
      else if (act === 'c-new') openCreateCards(btn.dataset.parent ? Number(btn.dataset.parent) : null);
      else if (act === 'p-prev' || act === 'p-next') { P.month = new Date(P.month.getFullYear(), P.month.getMonth() + (act === 'p-prev' ? -1 : 1), 1); P.selDay = null; loadProd(); }
      else if (act === 'p-today') { P.month = monthStart(new Date()); P.selDay = null; loadProd(); }
      else if (act === 'u-go') doUpdate();
      else if (act === 'u-notes') openNotes();
      else if (act === 'u-later') {
        const i = UPD.info;
        if (i) {
          UPD.laterFor = i.latest; UPD.busy = false;
          if (i.state === 'ready') toast(`Ok. A versão ${i.latest} é instalada sozinha quando você fechar o app.`);
          else if (i.state !== 'error') toast('Ok. Você pode atualizar depois em ⚙ Configurações.');
        }
        renderUpd();
      }
      else if (act === 'p-hid') { P.showHidden = !P.showHidden; renderProd(); }
      else if (act === 'p-hidemenu') openHideMenu(btn, id);
      else if (act === 'p-hide') { closeHideMenu(); if (!prefs.hiddenIds.includes(id)) prefs.hiddenIds.push(id); savePrefs(); renderProd(); toast(`#${id} não aparece mais na lista "sem horas". Para reexibir, clique em Mostrar ao lado dos ocultos.`); }
      else if (act === 'p-hidetitle' || act === 'p-hidetype') {
        closeHideMenu();
        const v = btn.dataset.v, list = act === 'p-hidetitle' ? prefs.hideTitles : prefs.hideTypes;
        if (!list.some((x) => x.toLowerCase() === v.toLowerCase())) list.push(v);
        savePrefs(); renderProd();
        toast(act === 'p-hidetitle' ? `Cards com "${v}" no título não aparecem mais nesta lista.` : `Cards do tipo ${v} não aparecem mais nesta lista.`);
      }
      else if (act === 'p-unhidepat') {
        const v = btn.dataset.v.toLowerCase();
        if (btn.dataset.k === 'type') prefs.hideTypes = prefs.hideTypes.filter((x) => x.toLowerCase() !== v); else prefs.hideTitles = prefs.hideTitles.filter((x) => x.toLowerCase() !== v);
        savePrefs(); renderProd();
      }
      else if (act === 'p-unhide') { prefs.hiddenIds = prefs.hiddenIds.filter((x) => x !== id); savePrefs(); renderProd(); }
      else if (act === 'p-day') { const k = btn.dataset.day; P.selDay = P.selDay === k ? null : k; renderProd(); }
      else if (act === 'p-log') { const it = P.rows.find((r) => r.id === id); if (it) { const ensure = await ensureItem(id); const end = it.closed ? truncMin(it.closed) : truncMin(new Date()); openSessionDialog({ itemId: ensure ? ensure.id : id, start: new Date(end.getTime() - 3600e3), end }); } }
      else if (act === 'search') { if (S.side === 'recent') loadRecent(true); else searchAzure(); }
      else if (act === 'new') {
        const now = truncMin(new Date());
        now.setMinutes(Math.floor(now.getMinutes() / SNAP_MIN) * SNAP_MIN);
        openSessionDialog({ itemId: S.selectedId, start: new Date(now.getTime() - 3600e3), end: now });
      }
      else if (act === 'pin') {
        prefs.pinned = prefs.pinned.includes(id) ? prefs.pinned.filter((x) => x !== id) : [...prefs.pinned, id];
        savePrefs(); renderList();
      }
      else if (act === 'timer') timerFor(id);
      else if (act === 't-start') tStart();
      else if (act === 't-pause') tPark(false);
      else if (act === 't-edit') openSegEditor('main');
      else if (act === 'pk-resume') tResume(btn.dataset.pid);
      else if (act === 'pk-edit') openSegEditor(btn.dataset.pid);
      else if (act === 'pk-log') parkedLog(btn.dataset.pid);
      else if (act === 'pk-discard') { if (btn.dataset.confirm) parkedDiscard(btn.dataset.pid); else { btn.dataset.confirm = '1'; btn.textContent = 'Confirmar?'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = '✕'; } }, 4000); } }
      else if (act === 't-log') tLog(true);
      else if (act === 't-stop') tLog(false);
      else if (act === 't-discard') { if (btn.dataset.confirm) tDiscard(); else { btn.dataset.confirm = '1'; btn.textContent = 'Confirmar?'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.confirm; btn.textContent = '✕ Descartar'; } }, 4000); } }
      else if (act === 'stop') stopTimer(id, btn.dataset.eid);
      return;
    }
    if (itemEl && !ev.target.closest('a')) {
      // Só troca a classe (sem redesenhar a lista), para o clique duplo funcionar no mesmo elemento
      const id = Number(itemEl.dataset.id);
      S.selectedId = S.selectedId === id ? null : id;
      document.querySelectorAll('.list .item.sel').forEach((e) => e.classList.remove('sel'));
      if (S.selectedId) itemEl.classList.add('sel');
      return;
    }
    if (blk && !dragJustEnded) {
      const it = S.items.get(Number(blk.dataset.id));
      const e = it?.entries.find((x) => x.id === blk.dataset.eid);
      if (it && e) openSessionDialog({ itemId: it.id, entry: e });
    }
  });

  // Tab num campo de data/hora vai direto para o próximo campo, em vez de passar por dia, mês, ano e o
  // botão do calendário (ou hora, minuto e o relógio)
  const tabbables = (root) => [...root.querySelectorAll('input, select, textarea, button, a[href], [tabindex]')]
    .filter((e) => e.tabIndex >= 0 && !e.disabled && e.type !== 'hidden' && e.getClientRects().length && getComputedStyle(e).visibility !== 'hidden');
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Tab' || ev.altKey || ev.ctrlKey) return;
    const t = ev.target, modal = $('.modal-bg.on .modal');
    const dateLike = t instanceof HTMLInputElement && ['date', 'time', 'datetime-local', 'month', 'week'].includes(t.type);
    // com um modal aberto, o Tab dá a volta dentro dele (não escapa para a tela de trás). Em data/hora o Tab
    // anda pelos pedaços (dia, mês, ano / hora, minuto), então lá o navegador decide.
    if (modal && !dateLike) {
      const list = tabbables(modal);
      if (!list.length) return;
      const i = list.indexOf(t);
      if (i < 0 || (!ev.shiftKey && i === list.length - 1) || (ev.shiftKey && i === 0)) {
        ev.preventDefault();
        (ev.shiftKey ? list[list.length - 1] : list[0]).focus();
      }
      return;
    }
  }, true);
  // Ícone desenhado do calendário/relógio: clique na ponta direita do campo ou Alt+↓ / F4 abre o seletor
  const pickerInput = (t) => t instanceof HTMLInputElement && ['date', 'time', 'datetime-local', 'month'].includes(t.type) && !t.disabled;
  document.addEventListener('click', (ev) => {
    const t = ev.target;
    if (!pickerInput(t)) return;
    const r = t.getBoundingClientRect();
    if (ev.clientX >= r.right - 32) { try { t.showPicker(); } catch { /* navegador sem showPicker */ } }
  });
  document.addEventListener('keydown', (ev) => {
    if (pickerInput(ev.target) && ((ev.altKey && ev.key === 'ArrowDown') || ev.key === 'F4')) { ev.preventDefault(); try { ev.target.showPicker(); } catch { /* ignore */ } }
  });
  document.addEventListener('mousemove', (ev) => {
    const t = ev.target;
    if (!pickerInput(t)) return;
    const r = t.getBoundingClientRect();
    t.style.cursor = ev.clientX >= r.right - 32 ? 'pointer' : '';
  });
  document.addEventListener('dblclick', (ev) => {
    const crow = ev.target.closest('tr.crow');
    if (crow && !ev.target.closest('a,button,input') && S.me) { ev.preventDefault(); const id = Number(crow.dataset.cid); adoptCard(id); quickLog(id); return; }
    const itemEl = ev.target.closest('.item');
    if (!itemEl || ev.target.closest('.acts') || !S.me) return;
    ev.preventDefault();
    quickLog(Number(itemEl.dataset.id));
  });

  async function startTimer(id) {
    adoptItem(id);
    if (runningEntry()) { toast('Já existe uma sessão em andamento. Pare-a primeiro.', true); return; }
    const ok = await run('Iniciando sessão…', () => createSession({ itemId: id, start: new Date() }));
    if (ok) toast(prefs.dryRun ? 'Modo teste: validado, nada foi gravado.' : `Sessão iniciada em #${id}.`);
  }
  async function stopTimer(id, eid) {
    const it = S.items.get(id);
    const e = it?.entries.find((x) => x.id === eid);
    if (!e) return;
    let end = truncMin(new Date());
    if (end <= new Date(e.start)) end = new Date(new Date(e.start).getTime() + 60e3);
    const ok = await run('Encerrando sessão…', () => updateSession(id, eid, { start: new Date(e.start), end, notes: e.notes }));
    if (ok) toast(prefs.dryRun ? 'Modo teste: validado, nada foi gravado.' : `Sessão encerrada: ${fmtH(entryHours({ start: e.start, end }))}.`);
  }

  // Arrastar para criar
  let drag = null, dragJustEnded = false;
  function yToMinutes(col, clientY) {
    const r = col.getBoundingClientRect();
    const h0 = Number($('.grid').dataset.h0);
    const mins = h0 * 60 + ((clientY - r.top) / PX_PER_HOUR) * 60;
    return Math.max(0, Math.min(24 * 60, Math.round(mins / SNAP_MIN) * SNAP_MIN));
  }
  document.addEventListener('pointerdown', (ev) => {
    const col = ev.target.closest('.col');
    if (!col || !S.me || ev.target.closest('.blk') || ev.button !== 0) return;
    const m = yToMinutes(col, ev.clientY);
    const ghost = document.createElement('div');
    ghost.className = 'ghost';
    col.appendChild(ghost);
    drag = { col, day: Number(col.dataset.day), m0: m, m1: m, ghost };
    col.setPointerCapture(ev.pointerId);
    updateGhost();
    ev.preventDefault();
  });
  document.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    drag.m1 = yToMinutes(drag.col, ev.clientY);
    updateGhost();
  });
  document.addEventListener('pointerup', () => {
    if (!drag) return;
    const { day, ghost } = drag;
    let a = Math.min(drag.m0, drag.m1), b = Math.max(drag.m0, drag.m1);
    if (b - a < SNAP_MIN) b = Math.min(24 * 60, a + 60); // clique simples = 1h
    ghost.remove(); drag = null;
    dragJustEnded = true; setTimeout(() => (dragJustEnded = false), 50);
    const d0 = addDays(S.weekStart, day);
    const start = new Date(d0.getTime()); start.setHours(0, a, 0, 0);
    const end = new Date(d0.getTime()); end.setHours(0, b, 0, 0);
    openSessionDialog({ itemId: S.selectedId, start, end });
  });
  // Arrastar um card da lista lateral para o calendário: abre o apontamento com o card e a data preenchidos.
  // Solto num horário da grade, já sugere esse horário (1 h); solto no cabeçalho do dia, só a data.
  let dnd = null;
  const DND_TYPE = 'application/x-apontador-item';
  document.addEventListener('dragstart', (ev) => {
    const el = ev.target.closest && ev.target.closest('.item[draggable="true"]');
    if (!el || !S.me) return;
    const id = Number(el.dataset.id);
    ev.dataTransfer.setData(DND_TYPE, String(id));
    ev.dataTransfer.setData('text/plain', `#${id}`);
    ev.dataTransfer.effectAllowed = 'copy';
    const it = S.items.get(id) || (R.rows || []).find((x) => x.id === id);
    dnd = { id, title: it ? it.title : '', ghost: null, col: null };
    document.body.classList.add('dnd-on');
  });
  const dndTarget = (ev) => {
    const col = ev.target.closest && ev.target.closest('.col');
    if (col) return { col, day: Number(col.dataset.day) };
    const dh = ev.target.closest && ev.target.closest('.dh[data-day]');
    if (dh) return { head: dh, day: Number(dh.dataset.day) };
    return null;
  };
  const dndClear = () => {
    if (!dnd) return;
    if (dnd.ghost) dnd.ghost.remove();
    dnd.ghost = null; dnd.col = null;
    document.querySelectorAll('.dh.dnd-over').forEach((e) => e.classList.remove('dnd-over'));
  };
  document.addEventListener('dragover', (ev) => {
    if (!dnd) return;
    const t = dndTarget(ev);
    if (!t) { dndClear(); return; }
    ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
    if (t.head) { dndClear(); t.head.classList.add('dnd-over'); return; }
    document.querySelectorAll('.dh.dnd-over').forEach((e) => e.classList.remove('dnd-over'));
    if (dnd.col !== t.col) { if (dnd.ghost) dnd.ghost.remove(); dnd.ghost = document.createElement('div'); dnd.ghost.className = 'ghost dnd'; t.col.appendChild(dnd.ghost); dnd.col = t.col; }
    const h0 = Number($('.grid').dataset.h0), a = Math.min(yToMinutes(t.col, ev.clientY), 23 * 60), b = a + 60;
    const f = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    dnd.ghost.style.top = `${((a - h0 * 60) * PX_PER_HOUR) / 60}px`;
    dnd.ghost.style.height = `${PX_PER_HOUR}px`;
    dnd.ghost.textContent = `#${dnd.id} · ${f(a)}–${f(b)}`;
  });
  document.addEventListener('drop', (ev) => {
    if (!dnd) return;
    const t = dndTarget(ev);
    const id = Number(ev.dataTransfer.getData(DND_TYPE)) || dnd.id;
    dndClear(); dnd = null; document.body.classList.remove('dnd-on');
    if (!t || !id) return;
    ev.preventDefault();
    adoptItem(id); S.selectedId = id;
    const d0 = addDays(S.weekStart, t.day);
    if (t.col) {
      const a = Math.min(yToMinutes(t.col, ev.clientY), 23 * 60);
      const start = new Date(d0.getTime()); start.setHours(0, a, 0, 0);
      openSessionDialog({ itemId: id, start, end: new Date(start.getTime() + 3600e3) });
    } else {
      const start = new Date(d0.getTime()); start.setHours(9, 0, 0, 0);
      openSessionDialog({ itemId: id, start, end: new Date(start.getTime() + 3600e3), blankTimes: true });
    }
  });
  document.addEventListener('dragend', () => { dndClear(); dnd = null; document.body.classList.remove('dnd-on'); });
  function updateGhost() {
    const h0 = Number($('.grid').dataset.h0);
    const a = Math.min(drag.m0, drag.m1), b = Math.max(drag.m0, drag.m1, a + SNAP_MIN);
    drag.ghost.style.top = `${((a - h0 * 60) * PX_PER_HOUR) / 60}px`;
    drag.ghost.style.height = `${((b - a) * PX_PER_HOUR) / 60}px`;
    const f = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    drag.ghost.textContent = `${f(a)}–${f(b)} · ${fmtH((b - a) / 60)}`;
  }

  // ───────── Diálogos ─────────
  function closeModal() { $('.modal-bg').classList.remove('on'); $('.modal').innerHTML = ''; $('.modal').classList.remove('wide'); }
  function openSessionDialog({ itemId, start, end, entry, blankTimes }) {
    const editing = !!entry;
    if (editing) { start = new Date(entry.start); end = entry.end ? new Date(entry.end) : null; }
    const items = [...S.items.values()].sort((a, b) => b.id - a.id);
    const label = (it) => `${it.id} — ${it.title}`;
    const opts = items.map((it) => `<option value="${esc(label(it))}"></option>`).join('');
    const cur = itemId && S.items.get(itemId);
    const m = $('.modal');
    m.innerHTML = `
      <h2>${editing ? 'Editar sessão' : 'Nova sessão'}</h2>
      <label>Item (digite o número ou escolha da lista)<input class="f-item" list="ah-items" autocomplete="off" placeholder="Ex.: 787869" value="${cur ? esc(label(cur)) : ''}"></label>
      <datalist id="ah-items">${opts}</datalist>
      <div class="f-info" style="font-size:12px;color:#8b93a3;margin-top:-4px"></div>
      <div class="row">
        <label>Data<input type="date" class="f-date" value="${dateInput(start)}"></label>
        <label>Início<input type="time" class="f-start" step="300" value="${timeStr(start)}"></label>
        <label>Fim<input type="time" class="f-end" step="300" value="${end ? timeStr(end) : ''}" ${end ? '' : 'disabled'}></label>
      </div>
      <div class="row" style="align-items:center">
        <label class="chk"><input type="checkbox" class="f-open" tabindex="-1" ${end ? '' : 'checked'}> Em andamento (sem fim)</label>
        <span class="grow"></span>
        <span class="chips"><button data-dur="30" tabindex="-1">30m</button><button data-dur="60" tabindex="-1">1h</button><button data-dur="120" tabindex="-1">2h</button><button data-dur="240" tabindex="-1">4h</button></span>
      </div>
      <label>Notas<textarea class="f-notes" rows="2" placeholder="Opcional">${esc(entry?.notes || '')}</textarea></label>
      <div class="dur" style="color:#8b93a3;font-size:12px"></div>
      <div class="err"></div>
      <div class="foot">
        ${editing ? '<button class="danger f-del" tabindex="-1">Excluir</button>' : ''}
        <span class="grow"></span>
        <button class="f-cancel" tabindex="-1" title="Esc">Cancelar</button>
        <button class="primary f-save">${prefs.dryRun ? 'Validar (teste)' : 'Salvar'}</button>
      </div>`;
    $('.modal-bg').classList.add('on');
    const q = (s) => m.querySelector(s);
    const read = () => {
      const ds = q('.f-date').value, s = q('.f-start').value, e = q('.f-end').value;
      const open = q('.f-open').checked;
      if (!ds || !s) return { err: 'Informe data e início.' };
      const st = combine(ds, s);
      let en = null;
      if (!open) {
        if (!e) return { err: 'Informe o fim ou marque "em andamento".' };
        en = combine(ds, e);
        if (en <= st) en = addDays(en, 1); // atravessa meia-noite
      }
      return { start: st, end: en, notes: q('.f-notes').value.trim(), itemId: parseItemId(q('.f-item').value) };
    };
    const showDur = () => { const r = read(); q('.dur').textContent = r.err ? '' : r.end ? `Duração: ${fmtH((r.end - r.start) / 36e5)}` : 'Sessão em andamento'; };
    let lookupTimer = null, lookupSeq = 0;
    const info = (t, color = '#8b93a3') => { q('.f-info').textContent = t; q('.f-info').style.color = color; };
    const lookup = () => {
      const id = parseItemId(q('.f-item').value);
      clearTimeout(lookupTimer);
      if (!id) { info(q('.f-item').value.trim() ? 'Digite o número do work item.' : ''); return; }
      const known = S.items.get(id);
      if (known) { info(`✓ ${known.title} · ${known.type} · ${known.state}`, '#86efac'); return; }
      info(`Procurando #${id} no Azure…`);
      const seq = ++lookupSeq;
      lookupTimer = setTimeout(async () => {
        try {
          const it = await ensureItem(id);
          if (seq !== lookupSeq) return;
          if (it) info(`✓ ${it.title} · ${it.type} · ${it.state}`, '#86efac');
          else info(`Item #${id} não encontrado no Azure.`, '#fca5a5');
        } catch (e) { if (seq === lookupSeq) info(e.message, '#fca5a5'); }
      }, 400);
    };
    q('.f-item').addEventListener('input', lookup);
    lookup();
    m.oninput = showDur;
    q('.f-open').addEventListener('change', () => { q('.f-end').disabled = q('.f-open').checked; if (!q('.f-open').checked && !q('.f-end').value) q('.f-end').value = timeStr(new Date(combine(q('.f-date').value, q('.f-start').value).getTime() + 3600e3)); showDur(); });
    m.querySelectorAll('[data-dur]').forEach((b) => b.addEventListener('click', () => {
      const st = combine(q('.f-date').value, q('.f-start').value);
      q('.f-open').checked = false; q('.f-end').disabled = false;
      q('.f-end').value = timeStr(new Date(st.getTime() + Number(b.dataset.dur) * 60e3)); showDur();
    }));
    showDur();
    q('.f-cancel').addEventListener('click', closeModal);
    const save = async () => {
      const r = read();
      if (r.err) { q('.err').textContent = r.err; return; }
      if (!r.itemId) { q('.err').textContent = 'Informe o número do work item.'; return; }
      if (!S.items.has(r.itemId)) {
        q('.err').textContent = 'Procurando o item…';
        let it = null;
        try { it = await ensureItem(r.itemId); } catch (e) { q('.err').textContent = e.message; return; }
        if (!it) { q('.err').textContent = `Item #${r.itemId} não encontrado no Azure.`; return; }
        q('.err').textContent = '';
      }
      if (r.end && (r.end - r.start) / 36e5 > 12) { q('.err').textContent = 'Sessão com mais de 12h. Confira os horários.'; return; }
      if (!r.end && runningEntry() && (!editing || entry.end)) { q('.err').textContent = 'Já existe uma sessão em andamento.'; return; }
      closeModal();
      const ok = await run(prefs.dryRun ? 'Validando…' : 'Gravando…', async () => {
        if (!editing) await createSession(r);
        else if (r.itemId !== itemId) await moveSession(itemId, entry.id, r.itemId, r);
        else await updateSession(itemId, entry.id, r);
      });
      if (ok) { P.loadedKey = ''; if (S.view === 'prod') loadProd(true); toast(prefs.dryRun ? 'Modo teste: o Azure aceitou a gravação, mas nada foi salvo.' : 'Sessão salva.'); }
    };
    q('.f-save').addEventListener('click', save);
    m.onkeydown = (ev) => { if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); save(); } };
    if (editing) {
      const del = q('.f-del');
      del.addEventListener('click', async () => {
        if (!del.classList.contains('confirm')) { del.classList.add('confirm'); del.textContent = 'Confirmar exclusão'; return; }
        closeModal();
        const ok = await run(prefs.dryRun ? 'Validando…' : 'Excluindo…', () => deleteSession(itemId, entry.id));
        if (ok) toast(prefs.dryRun ? 'Modo teste: exclusão validada, nada foi alterado.' : 'Sessão excluída.');
      });
    }
    if (blankTimes) { q('.f-start').value = ''; q('.f-end').value = ''; q('.f-end').disabled = false; q('.f-open').checked = false; q('.f-start').dispatchEvent(new Event('input', { bubbles: true })); }
    setTimeout(() => (itemId ? q('.f-start') : q('.f-item')).focus(), 0);
  }

  const daysLeft = (ymdStr) => { if (!ymdStr) return null; const [y, mo, d] = ymdStr.split('-').map(Number); const t0 = new Date(); t0.setHours(0, 0, 0, 0); return Math.round((new Date(y, mo - 1, d) - t0) / 864e5); };
  const expLabel = (ymdStr) => {
    const n = daysLeft(ymdStr);
    if (n == null) return '<span class="muted">validade não informada</span>';
    if (n < 0) return `<span style="color:#fca5a5">venceu há ${-n} dia(s)</span>`;
    if (n <= 7) return `<span style="color:#fde68a">vence em ${n} dia(s)</span>`;
    return `<span class="muted">vence em ${n} dias</span>`;
  };
  function openSettings() {
    const m = $('.modal');
    m.classList.add('wide');
    m.innerHTML = `
      <h2>Configurações</h2>
      <div class="tok">
        <div style="display:flex;align-items:center;gap:8px"><b>🔑 Token do Azure (PAT)</b><span class="grow"></span><span class="t-exp"></span></div>
        <div class="muted" style="font-size:12px;margin:4px 0 8px">Conectado como <b style="color:#e6e8ec">${esc(S.me?.name || '—')}</b> em <code>${esc(S.org)}/${esc(S.project)}</code><span class="t-saved"></span></div>
        <div class="row" style="align-items:center">
          <input class="t-val" readonly value="carregando…" style="font-family:Consolas,monospace;font-size:12.5px">
          <button class="t-show" title="Mostrar / esconder" style="flex:none">👁 Mostrar</button>

        </div>
        <div class="row" style="align-items:flex-end;margin-top:8px">
          <label style="flex:none">Vence em<input type="date" class="t-expd"></label>
          <span class="grow"></span>
          <button class="t-test">Testar conexão</button>

        </div>
        <div class="t-msg" style="font-size:12px;min-height:16px;margin-top:6px"></div>
        <div style="font-size:12px"><a href="https://dev.azure.com/${encodeURIComponent(S.org)}/_usersSettings/tokens" target="_blank" rel="noopener">Gerenciar meus tokens no Azure ↗</a> <span class="muted">· o token fica criptografado só para o seu usuário do Windows</span></div>
      </div>
      <div class="tok">
        <div style="display:flex;align-items:center;gap:8px"><b>📅 Feriados</b><span class="muted" style="font-size:12px">· não contam nas metas de horas e de cards</span></div>
        <div class="muted" style="font-size:12px;margin:4px 0 6px">Os nacionais já vêm no app. Os da empresa e da cidade chegam pela <b>lista da equipe</b> (baixada sozinha do repositório) ou, para quem usa, pelo Clockin. Você também pode adicionar e desativar à mão.</div>
        <div class="h-team muted" style="font-size:12px;margin-bottom:6px"></div>
        <div class="h-opt" style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;margin-bottom:8px"><span class="muted">Pontos facultativos:</span>${Object.entries(OPT_HOL).map(([k, o]) => `<label class="chk" style="margin:0"><input type="checkbox" data-k="${k}" ${prefs.optHol.includes(k) ? 'checked' : ''}> ${esc(o.label)}</label>`).join('')}</div>
        <div class="holl"></div>
        <div class="row" style="align-items:flex-end;margin-top:8px">
          <label style="flex:none">Data<input type="date" class="h-date"></label>
          <label>Nome<input class="h-name" placeholder="Ex.: Aniversário da cidade" maxlength="80"></label>
          <button class="h-add" style="flex:none">＋ Adicionar</button>
        </div>
      </div>
      <div class="tok">
        <div style="display:flex;align-items:center;gap:8px"><b>✅ O que conta como fechado</b><span class="muted" style="font-size:12px">· para a meta de cards e a aba Produtividade</span></div>
        <div class="muted" style="font-size:12px;margin:4px 0 8px">O app lê a categoria de cada estado no Azure. Marque as categorias que, no seu time, significam card terminado.</div>
        <div class="s-cats"></div>
        <label style="margin-top:10px">Ocultar da lista "fechados sem horas" os cards cujo título contém <span class="muted">(separe por vírgula)</span>
          <input class="s-hide" value="${esc(prefs.hideTitles.join(', '))}" placeholder="Ex.: Code Review, Integrated Test, Unit Test"></label>
        <label style="margin-top:8px">… e os cards destes tipos <span class="muted">(separe por vírgula)</span>
          <input class="s-hidetypes" value="${esc(prefs.hideTypes.join(', '))}" placeholder="Ex.: Release Note"></label>

      <div class="foot">

      q('.h-refresh').addEventListener('click', async (ev) => { ev.preventDefault(); q('.h-team').textContent = '📋 Atualizando a lista da equipe…'; await loadHolidays(true); drawHol(); render(); });
      q('.h-export').addEventListener('click', async (ev) => {
        ev.preventDefault();

    if (q('.s-unhide')) q('.s-unhide').addEventListener('click', (e) => { e.preventDefault(); prefs.hiddenIds = []; savePrefs(); e.target.parentElement.textContent = 'Todos os cards ocultos um a um voltam a aparecer.'; });

        : i.state === 'downloading' ? `· baixando a versão ${esc(i.latest)}… ${Math.round((i.progress || 0) * 100)}%`
        : i.available ? `· <b style="color:#86efac">versão ${esc(i.latest)} disponível</b> ${i.canApply ? '<button class="primary s-updgo" style="font-size:12px">Atualizar agora</button>' : `<a href="${esc(i.page)}" target="_blank" rel="noopener">Baixar ↗</a>`}`
        : i.checkError ? `· ${esc(i.checkError)}` : i.latest ? '· você está na versão mais recente' : '';
      if (q('.s-updgo')) q('.s-updgo').addEventListener('click', () => { closeModal(); prefs.skipVersion = ''; savePrefs(); doUpdate(); });
    };

    q('.s-cancel').addEventListener('click', closeModal);
    q('.s-token').addEventListener('click', () => openSetup());
    q('.s-save').addEventListener('click', () => {

      prefs.cardGoal = Math.max(0, Math.floor(Number(q('.s-cards').value) || 0));
      prefs.dayStart = Math.max(0, Math.min(23, Number(q('.s-h0').value) || 0));
      prefs.dayEnd = Math.max(prefs.dayStart + 1, Math.min(24, Number(q('.s-h1').value) || 24));
      prefs.dryRun = q('.s-dry').checked;
      const catsChanged = cats.slice().sort().join() !== prefs.closedCats.slice().sort().join();
      prefs.closedCats = cats.length ? cats : ['Resolved', 'Completed'];
      prefs.hideTitles = q('.s-hide').value.split(',').map((x) => x.trim()).filter(Boolean);
      prefs.hideTypes = q('.s-hidetypes').value.split(',').map((x) => x.trim()).filter(Boolean);
      savePrefs(); closeModal();
      if (catsChanged) { P.loadedKey = ''; C.key = ''; if (S.view === 'prod') loadProd(true); else if (S.view === 'cards') loadCards(true); }

  // Primeira configuração: token pessoal do Azure DevOps
  function openSetup(message) {

    m.innerHTML = `
      <h2>Conectar ao Azure DevOps</h2>
      ${message ? `<p style="color:#fca5a5">${esc(message)}</p>` : ''}

        <li>Abra <a class="tok-link" href="${tokensUrl}" target="_blank" rel="noopener">${esc(tokensUrl)}</a></li>
        <li>Clique em <b>New Token</b>. Organização: <code>${esc(S.org)}</code>. Validade: até 1 ano (o máximo que a organização permitir).</li>
        <li>Em <b>Scopes</b>, escolha <b>Custom defined</b>, clique em <b>Show all scopes</b> e marque só <b>Work Items → Read &amp; write</b> e <b>Extension Data → Read &amp; write</b> (esta é para os itens aparecerem no Work Session Hub).</li>

      <div class="row">
        <label style="flex:3">Token (PAT)<input class="c-pat" type="password" autocomplete="off" placeholder="${S.me ? 'Deixe vazio para manter o atual' : 'Cole aqui'}"></label>
        <label style="flex:1">Vence em (opcional)<input class="c-exp" type="date"></label>
      </div>
      <div class="err"></div>
      <div class="foot">
        ${S.me ? '<button class="danger c-logout">Desconectar</button><span class="grow"></span><button class="c-cancel">Cancelar</button>' : ''}
        <button class="primary c-save">Conectar</button>
      </div>`;
    $('.modal-bg').classList.add('on');
    const q = (s) => m.querySelector(s);

    const save = async () => {

        const changed = r.org !== S.org || r.project !== S.project;
        S.me = r.me; S.org = r.org; S.project = r.project;
        if (changed) { prefs.pinned = []; prefs.known = []; savePrefs(); }
        closeModal();
        toast(`Conectado como ${r.me.name}.`);

    };
    q('.c-save').addEventListener('click', save);
    q('.c-pat').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') save(); });
    if (S.me) {
      q('.c-cancel').addEventListener('click', closeModal);

      lo.addEventListener('click', async () => {
        if (!lo.classList.contains('confirm')) { lo.classList.add('confirm'); lo.textContent = 'Confirmar: apagar token salvo'; return; }
        await local('/api/logout', { method: 'POST' });

  // ───────── Versão nova do app ─────────
  // O app consulta a última release no GitHub; aqui só mostra o aviso e acompanha a atualização.
  const UPD = { info: null, busy: false, laterFor: null };
  setInterval(() => { UPD.laterFor = null; renderUpd(); }, 2 * 3600e3); // lembra de novo depois de 2 h
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  async function checkAppUpdate(force) {
    try { UPD.info = await local('/api/update' + (force ? '?check=1' : '')); } catch { return null; }
    renderUpd();
    return UPD.info;
  }
  function renderUpd() {
    const el = $('.upd'), i = UPD.info;
    if (!el) return;
    const pct = Math.round(((i && i.progress) || 0) * 100);
    const later = i && UPD.laterFor === i.latest;
    let show = false, err = false, html = '';
    if (!i) { /* nada */ }
    else if (i.state === 'restarting') { show = true; html = '🔄 Instalando e reabrindo o app… não feche esta janela.<span class="grow"></span>'; }
    else if (i.state === 'ready' && !later) {
      show = true;
      html = `✅ <b>Versão ${esc(i.latest)} pronta</b><span style="opacity:.8">· baixada e conferida. Reinicie para usar as novidades.</span><span class="grow"></span>
        ${i.notes ? '<button data-act="u-notes">Ver novidades</button>' : ''}
        <button class="primary" data-act="u-go">Reiniciar agora</button>
        <button data-act="u-later" title="Ela é instalada sozinha quando você fechar o app">Depois</button>`;
    } else if (i.state === 'downloading' && !later) {
      show = true;
      html = `⬇ Baixando a versão ${esc(i.latest)} em segundo plano… ${pct}%<span class="ubar"><i style="width:${pct}%"></i></span><span class="grow"></span><span style="opacity:.7;font-size:12px">pode continuar usando o app</span>`;
    } else if (i.state === 'error' && i.available && !later) {
      show = true; err = true;
      html = `⚠ Não deu para baixar a versão ${esc(i.latest)}: ${esc(i.error)}<span class="grow"></span><button data-act="u-go">Tentar de novo</button><a href="${esc(i.page)}" target="_blank" rel="noopener">Baixar pelo GitHub ↗</a><button class="icon" data-act="u-later" title="Fechar">✕</button>`;
    } else if (i.available && !later && prefs.skipVersion !== i.latest) {
      show = true;
      html = `🎉 <b>Versão ${esc(i.latest)} disponível</b><span style="opacity:.8">· você está na ${esc(i.current)}</span><span class="grow"></span>
        ${i.notes ? '<button data-act="u-notes">Ver novidades</button>' : ''}
        ${i.canApply ? '<button class="primary" data-act="u-go">Atualizar agora</button>' : `<a href="${esc(i.page)}" target="_blank" rel="noopener">Baixar ↗</a>`}
        <button class="icon" data-act="u-later" title="Lembrar mais tarde">Depois</button>`;
    }
    el.hidden = !show; el.classList.toggle('err', err);
    if (show) el.innerHTML = html;
    // enquanto baixa, acompanha de perto; depois, volta ao ritmo normal
    clearTimeout(UPD.fast);
    if (i && i.state === 'downloading' && !UPD.busy) UPD.fast = setTimeout(() => checkAppUpdate(), 1500);
  }
  function mdLite(t) {
    const out = []; let inList = false;
    for (const raw of String(t || '').replace(/\r/g, '').split('\n')) {
      const line = esc(raw).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
      const li = /^\s*[-*]\s+(.*)/.exec(line);
      if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push(`<li>${li[1]}</li>`); continue; }
      if (inList) { out.push('</ul>'); inList = false; }
      const h = /^#{1,4}\s+(.*)/.exec(line);
      if (h) out.push(`<h3>${h[1]}</h3>`); else if (line.trim()) out.push(`<div>${line}</div>`);
    }
    if (inList) out.push('</ul>');
    return out.join('');
  }
  function openNotes() {
    const i = UPD.info; if (!i) return;
    const m = $('.modal');
    m.classList.remove('wide');
    m.innerHTML = `<h2>Novidades da versão ${esc(i.latest)}</h2><div class="notes">${mdLite(i.notes) || '<div class="muted">Sem descrição.</div>'}</div>
      <div class="foot"><a href="${esc(i.page)}" target="_blank" rel="noopener">Ver no GitHub ↗</a><span class="grow"></span><button class="n-close">Fechar</button>${i.canApply ? `<button class="primary n-go">${i.state === 'ready' ? 'Reiniciar agora' : 'Atualizar agora'}</button>` : ''}</div>`;
    $('.modal-bg').classList.add('on');
    m.querySelector('.n-close').addEventListener('click', closeModal);
    if (m.querySelector('.n-go')) m.querySelector('.n-go').addEventListener('click', () => { closeModal(); doUpdate(); });
  }
  async function doUpdate() {
    if (UPD.busy && UPD.info && UPD.info.state !== 'error') return;
    let pid = null;
    try { pid = (await (await fetch('/api/version', { cache: 'no-store' })).json()).pid; } catch { /* ignore */ }
    UPD.busy = true;
    try { UPD.info = await local('/api/update', { method: 'POST' }); } catch (e) { UPD.busy = false; toast(e.message, true); return; }
    renderUpd();
    const t0 = Date.now();
    for (;;) {
      await wait(700);
      let v = null;
      try { v = await (await fetch('/api/version', { cache: 'no-store' })).json(); } catch { /* reiniciando */ }
      if (!v && UPD.info && UPD.info.state === 'downloading') { UPD.info = Object.assign({}, UPD.info, { state: 'restarting' }); renderUpd(); }
      if (v && pid && v.pid !== pid) { try { localStorage.setItem('apontadorHoras.updatedTo', v.version); } catch { /* ignore */ } location.reload(); return; }
      if (v && v.pid === pid) {
        try { UPD.info = await (await fetch('/api/update', { headers: { 'X-App-Token': APP_TOKEN }, cache: 'no-store' })).json(); } catch { /* ignore */ }
        renderUpd();
        if (UPD.info && UPD.info.state === 'error') return;
      }
      if (Date.now() - t0 > 180000) {
        UPD.info = Object.assign({}, UPD.info, { state: 'error', error: 'O app não voltou sozinho. Feche esta janela e abra o ApontadorHoras.exe de novo.' });
        renderUpd(); return;
      }
    }
  }

  // Novidades: na primeira vez que uma versão nova abre (depois de atualizar ou de trocar o .exe)
  const SEEN_KEY = 'apontadorHoras.seenVersion';
  const verNewer = (a, b) => {
    const x = String(a || '').split(/[.+-]/).map((n) => parseInt(n, 10) || 0), y = String(b || '').split(/[.+-]/).map((n) => parseInt(n, 10) || 0);
    for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0; }
    return false;
  };
  async function showWhatsNew() {
    let w;
    try { w = await local('/api/whatsnew'); } catch { return; }
    if (!w || !w.version || /dev/.test(w.version)) return;
    let seen = null;
    try { // sem registro, mas com preferências salvas = já usava uma versão anterior a este aviso
      seen = localStorage.getItem(SEEN_KEY) || ((localStorage.getItem('apontadorHoras.updatedTo') || HAD_PREFS) && '0'); localStorage.removeItem('apontadorHoras.updatedTo'); } catch { /* ignore */ }
    try { localStorage.setItem(SEEN_KEY, w.version); } catch { /* ignore */ }
    if (!seen || !verNewer(w.version, seen)) return; // primeira instalação ou mesma versão: nada a mostrar
    if ($('.modal-bg').classList.contains('on')) return; // não atropela outra janela aberta
    const m = $('.modal');
    m.classList.remove('wide');
    m.innerHTML = `<h2>🎉 Novidades da versão ${esc(w.version)}</h2>
      <div class="notes">${w.notes ? mdLite(w.notes) : '<div class="muted">O app foi atualizado. Os detalhes estão na página da versão.</div>'}</div>
      <div class="foot"><a href="${esc(w.page)}" target="_blank" rel="noopener">Ver tudo no GitHub ↗</a><span class="grow"></span><button class="primary n-ok">Entendi</button></div>`;
    $('.modal-bg').classList.add('on');
    m.querySelector('.n-ok').addEventListener('click', closeModal);
    m.querySelector('.n-ok').focus();
  }

  // ───────── Início ─────────
  async function boot() {
    render();
    try {
      const st = await local('/api/status');
      S.org = st.org; S.project = st.project;
      if (!st.configured) { openSetup(); return; }
      S.me = st.me;
      if (loadSnapshot()) {
        // abre na hora com a última cópia; a atualização do Azure vem logo depois, sem travar a tela
        render(); scrollToNow();
        loadHolidays().then(() => { if (!editingNow()) render(); });
        autoRefresh('abertura', true);
      } else {
        await loadHolidays();
        await reload(true);
        setTimeout(prefetchTabs, 2000);
      }
      showWhatsNew();
      const n = daysLeft(st.expiresAt);
      if (n != null && n <= 7) toast(n < 0 ? 'Seu token do Azure já venceu. Gere outro em ⚙ → Trocar token.' : `Seu token do Azure vence em ${n} dia(s). Gere outro em ⚙ antes que pare de funcionar.`, true);
    } catch (e) {
      toast(e.message, true);
    }
  }
  // sinal de vida a cada 5 s: depois de uma atualização, o app sabe se a janela continua aberta
  setInterval(() => { local('/api/ping').catch(() => {}); }, 5e3);
  setTimeout(() => checkAppUpdate(), 5e3);
  setTimeout(() => checkAppUpdate(), 15e3);
  setInterval(() => { if (!UPD.busy) checkAppUpdate(); }, 60e3);
  // Ao fechar a janela, avisa o app para encerrar (libera o .exe)
  window.addEventListener('pagehide', () => { try { navigator.sendBeacon('/api/bye?t=' + encodeURIComponent(APP_TOKEN), ''); } catch { /* ignore */ } });
  setInterval(() => { if (S.me && !S.busy && !drag && !$('.modal-bg').classList.contains('on')) render(); }, 60e3);

  // ───────── Atualização automática ─────────
  // Recarrega do Azure a cada 30 s com a janela visível e sempre que você volta para ela
  // (ex.: depois de excluir ou fechar cards no Azure). Não roda enquanto você digita ou edita algo.
  const AUTO_MS = 30e3;
  let lastSync = Date.now(), syncing = false;
  const syncLabel = (t, color) => { const el = $('.st-sync'); if (el) { el.textContent = t; el.style.color = color || '#8b93a3'; } };
  const editingNow = () => {
    const ae = document.activeElement;
    return $('.modal-bg').classList.contains('on') || !!drag || S.busy
      || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && ae.value !== '' && !ae.readOnly);
  };
  // Deixa Produtividade e Cards prontas antes de você clicar nelas (por trás, sem tela de carregando)
  let prefetching = false;
  async function prefetchTabs() {
    if (!S.me || prefetching) return;
    prefetching = true;
    try {
      const old = (t) => !t || Date.now() - t > 120e3;
      if (S.view !== 'prod' && old(P.at)) await loadProd(true, true).catch(() => {});
      if (S.view !== 'cards' && old(C.at)) await loadCards(true, true).catch(() => {});
    } finally { prefetching = false; }
  }
  async function autoRefresh(why, force) {
    if (!S.me || syncing || (!force && editingNow())) return;
    syncing = true; syncLabel('↻ atualizando…');
    try {
      const scroll = $('.scroller')?.scrollTop;
      await Promise.all([loadHolidays(), loadAll()]);
      const jobs = [];
      if (S.view === 'prod') jobs.push(loadProd(true, true));
      if (S.view === 'cards') jobs.push(loadCards(true, true));
      if (S.side === 'recent') jobs.push(loadRecent(true, true));
      await Promise.all(jobs);
      if (!editingNow()) { render(); if (scroll != null && $('.scroller')) $('.scroller').scrollTop = scroll; }
      // as abas que não estão na tela: atualiza por trás, uma de cada vez, se os dados tiverem mais de 2 min
      if (S.view !== 'prod') P.loadedKey = '';
      if (S.view !== 'cards') C.key = '';
      if (S.side !== 'recent') R.key = '';
      lastSync = Date.now();
      setTimeout(prefetchTabs, 1500);
      syncLabel(`✓ atualizado às ${timeStr(new Date())}`);
    } catch (e) {
      console.warn('[Apontador] atualização automática', why, e);
      syncLabel('⚠ não consegui atualizar agora', '#fca5a5');
    } finally { syncing = false; }
  }
  setInterval(() => { if (document.visibilityState === 'visible' && Date.now() - lastSync >= AUTO_MS) autoRefresh('intervalo'); }, 5000);
  window.addEventListener('focus', () => { if (Date.now() - lastSync > 4000) autoRefresh('foco'); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - lastSync > 4000) autoRefresh('visível'); });
  boot();
})();
</script>
</body>
</html>
