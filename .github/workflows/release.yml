# Publica uma versão nova: crie e envie uma tag (ex.: git tag v1.2.0 && git push origin v1.2.0).
# O GitHub gera o ApontadorHoras.exe com essa versão, calcula o SHA-256 e cria a release.
# Quem já tem o app vê o aviso "Versão nova disponível" e atualiza com um clique.
name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar as novidades
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}$TAG"
          # Resumo (vai para o modal "Novidades" dentro do app): a mensagem da tag anotada, se houver;
          # senão, os títulos dos commits desde a tag anterior, sem os de documentação.
          MSG=""
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then MSG=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,$d'); fi
          if [ -n "$(printf '%s' "$MSG" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$MSG" > fonte/novidades.md
          else
            git log --no-merges --pretty='- %s' "$RANGE" | grep -viE '^- (update|merge|readme|docs?)\b' | head -10 > fonte/novidades.md || true
          fi
          {
            cat fonte/novidades.md
            echo
            echo "## Todos os commits"
            git log --no-merges --pretty='- %s' "$RANGE" | head -50
            echo
            echo "Quem já usa o app: clique em **Atualizar agora** no aviso que aparece no topo da janela."
          } > notes.md
          echo "--- resumo:"; cat fonte/novidades.md

      - name: Gerar o .exe
        working-directory: fonte
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          node build.js
          # Node base com o ícone e a descrição do app (o pkg usa via PKG_NODE_PATH)
          npm i --no-save --no-package-lock resedit@2 @yao-pkg/pkg-fetch@3.6.7
          node icone-exe.js
          PKG_NODE_PATH="$PWD/dist/node-base-win-x64.exe" npx --yes @yao-pkg/pkg@6.25.0 . -t node22-win-x64 --options use-system-ca --no-bytecode --public-packages "*" --public -o dist/ApontadorHoras.exe
          cp ../clockin-importar.user.js dist/
          cd dist && sha256sum ApontadorHoras.exe > ApontadorHoras.exe.sha256 && cat ApontadorHoras.exe.sha256

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            fonte/dist/ApontadorHoras.exe fonte/dist/ApontadorHoras.exe.sha256 fonte/dist/clockin-importar.user.js \
            --title "Apontador de Horas $GITHUB_REF_NAME" --notes-file notes.md --latest
